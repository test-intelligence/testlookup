[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testlookup-cli"
version = "0.4.0"
description = "TestLookup CLI — QA intelligence from your terminal"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    # Floors exclude releases with known advisories (2026-11-12 review):
    # pydantic <2.4 CVE-2024-3772 (ReDoS); cryptography <49 CVE-2026-69249,
    # GHSA-537c-gmf6-5ccf, CVE-2026-26007 (high).
    "pydantic>=2.4",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "cryptography>=49",
]

[project.scripts]
testlookup = "testlookup_cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["testlookup_cli"]
