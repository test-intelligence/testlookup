[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testlookup-cli"
version = "0.1.0"
description = "TestLookup CLI — QA intelligence from your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
testlookup = "testlookup_cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["testlookup_cli"]
