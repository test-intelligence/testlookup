name: testlookup

# GCP VM override for testlookup.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gcp-vm.yml up -d --build
#
# This override switches app services to production targets,
# avoids bind mounts, and keeps resource-heavy services optional.

services:
  db-migrate:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production

  backend:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes: []
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      # Re-audit H2. This override runs uvicorn DIRECTLY, not gunicorn, so
      # backend/gunicorn_conf.py never loads here — the uvicorn CLI reads this
      # variable itself (default 127.0.0.1). Without it the API sees the
      # frontend nginx as every caller whenever traffic arrives through the
      # proxy, collapsing the login rate limiter onto one bucket and recording
      # that one address for every audit event. Trust the Docker bridge range
      # the nginx container connects from, never "*": under a wildcard uvicorn
      # returns the leftmost X-Forwarded-For entry, i.e. whatever the caller
      # sent.
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

  frontend:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "80:80"
    volumes: []
    environment: []

  worker:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production
    profiles: ["async"]
    volumes: []
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-1} -Q default,critical,ingestion,ai_analysis

  worker-children:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production
    profiles: ["async"]
    volumes: []

  beat:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production
    profiles: ["async"]
    volumes: []

  seed-init:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production
    volumes: []

  # Bucket setup (scripts/s3_setup.py) runs from the same production image.
  minio-setup:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    build:
      target: production

  mcp:
    image: gcr.io/${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set}/testlookup-mcp:${IMAGE_TAG:?IMAGE_TAG must be set}

  flower:
    profiles: ["async"]

  ollama:
    profiles: ["ai"]

  chromadb:
    profiles: ["ai"]

  # The S3 endpoint (the `minio` service, versitygw) publishes only its API
  # port 9000; there is no web console. Keep it off the internet: firewall
  # port 9000 on the VM, or remove the published port with an override like:
  # minio:
  #   ports: !reset []
