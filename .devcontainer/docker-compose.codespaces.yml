# GitHub Codespaces only: layered on docker-compose.dev-lite.yml by
# .devcontainer/devcontainer.json. Local development does not use this file.
services:
  frontend:
    environment:
      # Same-origin API calls through Vite's dev proxy. In a browser-based
      # codespace "http://localhost:8000" is the visitor's own machine.
      - VITE_API_BASE_URL=
      - VITE_PROXY_TARGET=http://backend:8000
      # Codespaces forwards ports on *.app.github.dev, and Vite refuses
      # requests for hosts it does not know (DNS-rebinding protection).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.app.github.dev
