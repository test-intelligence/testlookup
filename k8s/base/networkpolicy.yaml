# ── Default-deny + explicit allows ──────────────────────────────────────────
# Baseline NetworkPolicy set. Denies all ingress/egress by default and then
# explicitly allows only the flows the application needs. This eliminates
# lateral-movement surface area if any pod is compromised.
#
# NOTE: these policies assume the stateful data stores (postgres, mongo, redis,
# minio) run OUTSIDE the testlookup namespace (managed services or a shared
# "data" namespace). An overlay that colocates them here includes the
# k8s/components/colocated-data-stores component for their allows; an
# in-namespace Chroma is covered by allow-chromadb below.
# ───────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: testlookup
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow DNS egress for every pod (kube-dns / CoreDNS in kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: testlookup
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Frontend: accept ingress from the ingress controller namespace; egress to
# backend service only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: testlookup
spec:
  podSelector:
    matchLabels:
      app: testlookup-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: testlookup-backend
      ports:
        - protocol: TCP
          port: 8000

---
# Backend API: ingress from ingress-nginx + frontend + workers + the MCP
# server (for internal service-to-service calls). Egress is allowed to anywhere
# in-cluster — the backend talks to Ollama, MCP, and data stores; tightening
# this further needs explicit per-service labels which vary by environment.
#
# ``testlookup-mcp`` was missing here until 2026-08-15 while ``allow-mcp``
# already granted MCP *egress* to this service. NetworkPolicy needs both
# halves, so every MCP tool call died with "All connection attempts failed"
# while the pod stayed Ready — its probes are tcpSocket on its own port, and
# the SSE handshake and ``tools/list`` are served without touching the API.
# Same class as the beat/scheduler omission recorded below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: testlookup
spec:
  podSelector:
    matchLabels:
      app: testlookup-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: testlookup-frontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
        - podSelector:
            matchLabels:
              app: testlookup-mcp
      ports:
        - protocol: TCP
          port: 8000
    # Metrics are discovered per pod. Restrict scrapes to the conventional
    # in-cluster monitoring namespace rather than opening the API port broadly.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [monitoring, openshift-monitoring, openshift-user-workload-monitoring]
        # Managed collectors may use a provider-specific namespace. Operators
        # opt that namespace in without editing this policy:
        # kubectl label namespace <name> testlookup.io/metrics-scraper=true
        - namespaceSelector:
            matchLabels:
              testlookup.io/metrics-scraper: "true"
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - {}   # allow all egress — data stores are external to this namespace

---
# Celery workers + the beat scheduler. Same network needs (Redis broker,
# Postgres). Beat carries ``component: scheduler`` instead of ``worker``;
# prior to 2026-05-15 only ``worker`` was matched, so the beat pod's
# ``wait-for-redis`` initContainer hung forever under ``default-deny-all``.
# That stopped ``close_stale_live_sessions`` from running and live
# sessions stuck on ``status='active'`` piled up indefinitely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workers
  namespace: testlookup
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [worker, scheduler]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [monitoring, openshift-monitoring, openshift-user-workload-monitoring]
        - namespaceSelector:
            matchLabels:
              testlookup.io/metrics-scraper: "true"
      ports:
        - protocol: TCP
          port: 9100
  egress:
    - {}

---
# MCP server: accept SSE ingress from backend and from outside the namespace
# (assistant clients via ingress); egress to backend only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp
  namespace: testlookup
spec:
  podSelector:
    matchLabels:
      app: testlookup-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        - podSelector:
            matchLabels:
              app: testlookup-backend
      ports:
        - protocol: TCP
          port: 8002
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: testlookup-backend
      ports:
        - protocol: TCP
          port: 8000

---
# ChromaDB: in-cluster only, reachable by the backend + Celery workers on its
# container port. Selects nothing where Chroma runs outside the namespace; the
# homelab and openshift-artifactory overlays run it here (infra-chromadb.yaml).
#
# Narrower than the other data stores on purpose. The chromadb/chroma 1.x
# server has no authentication, and the backend's Python client builds each
# collection's embedding function from the configuration Chroma returns
# (chromadb Collection._embed -> build_from_config), so a pod that can write
# to Chroma can point the backend's embedding calls -- and the API key it
# reads from the environment -- at an endpoint of its choosing. The open
# chromadb advisories (GHSA-f4j7-r4q5-qw2c, GHSA-36p7-vc44-83pf,
# GHSA-2wm9-hf6c-p5cr, GHSA-xph7-9rjv-w5fr) have no fixed release, which
# leaves network reachability as the control. Keep no other policy selecting
# these pods: NetworkPolicy allows are a union, so one broad allow elsewhere
# undoes this one (tests/regression/test_chroma_network_isolation.py).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chromadb
  namespace: testlookup
spec:
  podSelector:
    matchLabels:
      app: testlookup-chromadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: testlookup-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 8000

---
# Ollama: in-cluster only, reachable by backend + workers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama
  namespace: testlookup
spec:
  podSelector:
    matchLabels:
      app: testlookup-ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: testlookup-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 11434
