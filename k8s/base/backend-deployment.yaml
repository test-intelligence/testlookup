apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-backend
  namespace: testlookup
  labels:
    app: testlookup-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testlookup-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: testlookup-backend
        app.kubernetes.io/component: api
        testlookup.io/live-fanout-protocol: "v1"
    spec:
      serviceAccountName: testlookup-sa
      containers:
        - name: backend
          image: testlookup/backend:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: testlookup-config
            - secretRef:
                name: testlookup-secrets
          env:
            - name: APP_ENV
              value: "production"
            # The API creates ChromaDB collections too (chat, semantic
            # search), so it faces the same 79 MB weight download. Keep it
            # on the mounted cache rather than $HOME, which is discarded on
            # container restart.
            - name: CHROMA_ONNX_MODEL_DIR
              value: /var/cache/testlookup/chroma-onnx
          volumeMounts:
            - name: embedder-model-cache
              mountPath: /var/cache/testlookup/chroma-onnx
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      # Spread replicas across nodes; fall back to best-effort if topology unavailable
      volumes:
        # ChromaDB's all-MiniLM ONNX weights (79 MB) — see the note in
        # worker-deployments.yaml.
        - name: embedder-model-cache
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: testlookup-backend
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: testlookup-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: testlookup-backend
                topologyKey: kubernetes.io/hostname
