# ── Celery Worker Deployments ──────────────────────────────────────────────
#
# Each queue runs as a SEPARATE Deployment so Kubernetes can scale them
# independently based on their individual CPU / memory / queue-depth signals.
#
#  worker-critical   — real-time "critical" queue  (live test analysis, LLM)
#  worker-ingestion  — "ingestion" queue            (MinIO → DB parsing)
#  worker-ai         — "ai_analysis" queue          (full LangGraph pipeline)
#  worker-default    — "default" queue              (notifications, housekeeping)
#  beat              — Celery beat scheduler        (always exactly 1 replica)
#
# HPAs live in hpa.yaml; replicas here are the floor for non-prod environments.
# ─────────────────────────────────────────────────────────────────────────────

# ── worker-critical: real-time analysis (critical queue) ─────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-worker-critical
  namespace: testlookup
  labels:
    app: testlookup-worker-critical
    app.kubernetes.io/component: worker
    queue: critical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testlookup-worker-critical
  template:
    metadata:
      annotations:
        # Celery workers are separate processes from the backend, so the
        # backend's /metrics cannot carry task-execution metrics. Each
        # worker exposes its own scrape target.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
      labels:
        app: testlookup-worker-critical
        app.kubernetes.io/component: worker
        queue: critical
    spec:
      serviceAccountName: testlookup-sa
      terminationGracePeriodSeconds: 60   # allow in-flight tasks to finish
      # Block worker startup until the Celery broker (Redis) is reachable.
      # Without this, the worker container can start before Redis is ready,
      # the initial broker connect fails, and although Celery retries the
      # connection, the consumer loop is not always re-established cleanly —
      # leaving a "1/1 Running" pod that is silently NOT consuming from its
      # queue. See: persist_live_session was never running on the homelab
      # despite live sessions completing, because worker-ingestion came up
      # before testlookup-redis.
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z testlookup-redis 6379; do
                echo "wait-for-redis: testlookup-redis:6379 not reachable yet, retrying in 2s"
                sleep 2
              done
              echo "wait-for-redis: Redis is reachable, starting worker"
      containers:
        - name: worker
          image: testlookup/backend:0.0.1
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2           # lower concurrency — LLM tasks are memory-heavy
            - -Q
            - critical
            - --max-tasks-per-child=100
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: testlookup-config
            - secretRef:
                name: testlookup-secrets
          env:
            # prometheus_client multiprocess mode. Prefork children each keep a
            # private registry, so the parent serving /metrics would otherwise
            # publish only its own view of the worker. Children write metric
            # files here and the exporter aggregates them.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
          # cpu limit 1000m -> 2000m to match --concurrency=2. Not separately
          # measured; same arithmetic as the ingestion worker below, which was.
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            # Liveness only proves the process is alive — a lightweight pgrep avoids
            # the broker round-trip of `inspect ping`, which can exceed the timeout
            # under load and kill a worker mid-task. Readiness keeps the ping check.
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: testlookup-worker-critical
                topologyKey: kubernetes.io/hostname
      volumes:
        # Scratch space for multiprocess metric files. emptyDir, not
        # persistent: the files describe this pod's live processes and
        # must start empty, or a restart would resurrect dead children.
        - name: prometheus-multiproc
          emptyDir: {}

---
# ── worker-ingestion: test report parsing (ingestion queue) ──────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-worker-ingestion
  namespace: testlookup
  labels:
    app: testlookup-worker-ingestion
    app.kubernetes.io/component: worker
    queue: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testlookup-worker-ingestion
  template:
    metadata:
      annotations:
        # Celery workers are separate processes from the backend, so the
        # backend's /metrics cannot carry task-execution metrics. Each
        # worker exposes its own scrape target.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
      labels:
        app: testlookup-worker-ingestion
        app.kubernetes.io/component: worker
        queue: ingestion
    spec:
      serviceAccountName: testlookup-sa
      terminationGracePeriodSeconds: 120   # parsing can take time
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z testlookup-redis 6379; do
                echo "wait-for-redis: testlookup-redis:6379 not reachable yet, retrying in 2s"
                sleep 2
              done
              echo "wait-for-redis: Redis is reachable, starting worker"
      containers:
        - name: worker
          image: testlookup/backend:0.0.1
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            # Subscribe to BOTH the legacy ``ingestion`` queue AND every
            # ``ingestion.shard.<i>`` queue. ``persist_live_session`` is
            # routed to ``ingestion.shard.<hash(project_id) mod N>`` by
            # the Phase 2 fairness work (services/stream_service.py +
            # worker/ingestion_routing.py). Without the shard queues in
            # this -Q list, tasks pile up unconsumed and per-test rows
            # never get written — the symptom is /suites empty +
            # /failures showing "per-test rows haven't been persisted
            # yet" while /runs displays the aggregate counts cleanly.
            # Incident 2026-05-18.
            #
            # Keep this in lockstep with LIVE_INGEST_SHARD_COUNT
            # (default 8 — see core/config.py). If you change the
            # shard count, update this list too.
            - ingestion,ingestion.shard.0,ingestion.shard.1,ingestion.shard.2,ingestion.shard.3,ingestion.shard.4,ingestion.shard.5,ingestion.shard.6,ingestion.shard.7
            - --max-tasks-per-child=200
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: testlookup-config
            - secretRef:
                name: testlookup-secrets
          env:
            # prometheus_client multiprocess mode. Prefork children each keep a
            # private registry, so the parent serving /metrics would otherwise
            # publish only its own view of the worker. Children write metric
            # files here and the exporter aggregates them.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
          # cpu limit raised 1000m -> 4000m (2026-08-08) on measurement.
          # --concurrency=4 under a 1-core limit is four processes that cannot
          # exceed one core between them. Under an 80-run ingest burst the
          # cgroup was throttled 36-74 times per pod every single run, while
          # the CPU *average* read only 0.64 cores -- the average looks like
          # headroom because it includes the idle tail, so throttled_usec is
          # the field that actually settles it. Back to back at the same
          # corpus size: 5.0 runs/s throttled at 1 core, 23.5 and 22.7 runs/s
          # unthrottled at 4. Observed demand peaked at 1.46 cores per pod.
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 2Gi
          livenessProbe:
            # Liveness only proves the process is alive — a lightweight pgrep avoids
            # the broker round-trip of `inspect ping`, which can exceed the timeout
            # under load and kill a worker mid-task. Readiness keeps the ping check.
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: testlookup-worker-ingestion
                topologyKey: kubernetes.io/hostname
      volumes:
        # Scratch space for multiprocess metric files. emptyDir, not
        # persistent: the files describe this pod's live processes and
        # must start empty, or a restart would resurrect dead children.
        - name: prometheus-multiproc
          emptyDir: {}

---
# ── worker-ai: multi-agent LangGraph pipeline (ai_analysis queue) ────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-worker-ai
  namespace: testlookup
  labels:
    app: testlookup-worker-ai
    app.kubernetes.io/component: worker
    queue: ai_analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testlookup-worker-ai
  template:
    metadata:
      annotations:
        # Celery workers are separate processes from the backend, so the
        # backend's /metrics cannot carry task-execution metrics. Each
        # worker exposes its own scrape target.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
      labels:
        app: testlookup-worker-ai
        app.kubernetes.io/component: worker
        queue: ai_analysis
    spec:
      serviceAccountName: testlookup-sa
      terminationGracePeriodSeconds: 1860  # match Celery hard time limit (31 min)
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z testlookup-redis 6379; do
                echo "wait-for-redis: testlookup-redis:6379 not reachable yet, retrying in 2s"
                sleep 2
              done
              echo "wait-for-redis: Redis is reachable, starting worker"
      containers:
        - name: worker
          image: testlookup/backend:0.0.1
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2           # LangGraph pipelines are CPU+memory heavy
            - -Q
            - ai_analysis
            - --max-tasks-per-child=50  # lower limit: prevent LLM memory leaks
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: testlookup-config
            - secretRef:
                name: testlookup-secrets
          env:
            # prometheus_client multiprocess mode. Prefork children each keep a
            # private registry, so the parent serving /metrics would otherwise
            # publish only its own view of the worker. Children write metric
            # files here and the exporter aggregates them.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            # Liveness only proves the process is alive — a lightweight pgrep avoids
            # the broker round-trip of `inspect ping`, which can exceed the timeout
            # under load and kill a worker mid-task. Readiness keeps the ping check.
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: testlookup-worker-ai
                topologyKey: kubernetes.io/hostname
      volumes:
        # Scratch space for multiprocess metric files. emptyDir, not
        # persistent: the files describe this pod's live processes and
        # must start empty, or a restart would resurrect dead children.
        - name: prometheus-multiproc
          emptyDir: {}

---
# ── worker-default: notifications, housekeeping (default queue) ──────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-worker-default
  namespace: testlookup
  labels:
    app: testlookup-worker-default
    app.kubernetes.io/component: worker
    queue: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testlookup-worker-default
  template:
    metadata:
      annotations:
        # Celery workers are separate processes from the backend, so the
        # backend's /metrics cannot carry task-execution metrics. Each
        # worker exposes its own scrape target.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
      labels:
        app: testlookup-worker-default
        app.kubernetes.io/component: worker
        queue: default
    spec:
      serviceAccountName: testlookup-sa
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z testlookup-redis 6379; do
                echo "wait-for-redis: testlookup-redis:6379 not reachable yet, retrying in 2s"
                sleep 2
              done
              echo "wait-for-redis: Redis is reachable, starting worker"
      containers:
        - name: worker
          image: testlookup/backend:0.0.1
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            - default
            - --max-tasks-per-child=200
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: testlookup-config
            - secretRef:
                name: testlookup-secrets
          env:
            # prometheus_client multiprocess mode. Prefork children each keep a
            # private registry, so the parent serving /metrics would otherwise
            # publish only its own view of the worker. Children write metric
            # files here and the exporter aggregates them.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
          # cpu limit 500m -> 4000m: --concurrency=4 under half a core was the
          # worst ratio of any worker (8 processes' worth of demand per core).
          # Not separately measured -- driving the default queue in isolation
          # is awkward -- but the arithmetic is the ingestion worker's.
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 4000m
              memory: 1Gi
          livenessProbe:
            # Liveness only proves the process is alive — a lightweight pgrep avoids
            # the broker round-trip of `inspect ping`, which can exceed the timeout
            # under load and kill a worker mid-task. Readiness keeps the ping check.
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
                - --timeout=10
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # Scratch space for multiprocess metric files. emptyDir, not
        # persistent: the files describe this pod's live processes and
        # must start empty, or a restart would resurrect dead children.
        - name: prometheus-multiproc
          emptyDir: {}

---
# ── beat: Celery beat scheduler (always exactly 1 replica — never scaled) ─────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-beat
  namespace: testlookup
  labels:
    app: testlookup-beat
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testlookup-beat
  strategy:
    type: Recreate              # beat MUST NOT run as two instances simultaneously
  template:
    metadata:
      labels:
        app: testlookup-beat
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: testlookup-sa
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z testlookup-redis 6379; do
                echo "wait-for-redis: testlookup-redis:6379 not reachable yet, retrying in 2s"
                sleep 2
              done
              echo "wait-for-redis: Redis is reachable, starting beat"
      containers:
        - name: beat
          image: testlookup/backend:0.0.1
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.worker.celery_app
            - beat
            - --loglevel=info
            # Write schedule/pid to a writable path: the pod runs as UID 1000 but
            # /app is owned by the image's build user, so the default cwd write fails.
            - --schedule=/tmp/celerybeat-schedule
            - --pidfile=/tmp/celerybeat.pid
          envFrom:
            - configMapRef:
                name: testlookup-config
            - secretRef:
                name: testlookup-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                # python:slim doesn't ship procps/pgrep, so grep /proc cmdlines instead.
                - "grep -la 'celery' /proc/[0-9]*/cmdline 2>/dev/null | head -1 | grep -q ."
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
