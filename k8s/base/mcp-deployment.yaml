apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-mcp
  namespace: testlookup
  labels:
    app: testlookup-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testlookup-mcp
  template:
    metadata:
      labels:
        app: testlookup-mcp
    spec:
      containers:
        - name: mcp
          image: testlookup/mcp:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: sse
          env:
            - name: TESTLOOKUP_API_URL
              value: "http://testlookup-backend:8000"
            - name: TESTLOOKUP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MCP_USERNAME
            - name: TESTLOOKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MCP_PASSWORD
            - name: TESTLOOKUP_REQUEST_TIMEOUT
              value: "120"
          command: ["python", "server.py", "--transport", "sse", "--port", "8002"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # /sse is a streaming endpoint that rejects plain HTTP GET probes
          # with 421 — use a TCP probe to verify the server is listening.
          readinessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
