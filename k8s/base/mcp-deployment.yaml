apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-mcp
  namespace: testlookup
  labels:
    app: testlookup-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  # SSE session state is process-local. Recreate prevents a rolling update
  # from briefly routing one session across two incompatible server processes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-mcp
  template:
    metadata:
      labels:
        app: testlookup-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp
          image: testlookup/mcp:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: sse
          env:
            - name: TESTLOOKUP_API_URL
              value: "http://testlookup-backend:8000"
            - name: TESTLOOKUP_REQUEST_TIMEOUT
              value: "120"
            - name: TESTLOOKUP_AUTH_TIMEOUT
              value: "5"
            - name: TESTLOOKUP_AUTH_MAX_CONNECTIONS
              value: "50"
            - name: TESTLOOKUP_MCP_ALLOWED_HOSTS
              value: "testlookup-mcp.example.com"
          command: ["python", "server.py", "--transport", "sse", "--port", "8002"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            # readOnlyRootFilesystem: true makes / read-only; give libs a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
