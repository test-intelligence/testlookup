# ============================================================
# IMPORTANT: This file is a TEMPLATE only.
# Real secrets must be managed via External Secrets Operator,
# HashiCorp Vault, or OCP Secrets — NEVER commit real values.
# ============================================================
# To generate base64: echo -n "your-value" | base64
# To generate strong random values:
#   openssl rand -hex 32 | base64        # 64-char hex secret
#   openssl rand -base64 32 | base64     # 32-byte base64 secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: testlookup-secrets
  namespace: testlookup
type: Opaque
data:
  # Required — generate strong random values:
  # openssl rand -hex 32 | tr -d '\n' | base64
  APP_SECRET_KEY: <base64-encoded-strong-random-secret>
  JWT_SECRET_KEY: <base64-encoded-strong-random-secret>

  # postgresql+asyncpg://testlookup_user:<strong-password>@testlookup-postgres:5432/testlookup
  # echo -n "postgresql+asyncpg://testlookup_user:<pw>@testlookup-postgres:5432/testlookup" | base64
  DATABASE_URL: <base64-encoded-database-url>

  # echo -n "<strong-db-password>" | base64
  POSTGRES_PASSWORD: <base64-encoded-postgres-password>

  # echo -n "testlookup_minio" | base64
  MINIO_ACCESS_KEY: <base64-encoded-minio-access-key>

  # echo -n "<strong-minio-secret>" | base64
  MINIO_SECRET_KEY: <base64-encoded-minio-secret-key>

  # mongodb://testlookup-mongo:27017
  MONGO_URI: <base64-encoded-mongo-uri>

  # Webhook secret — must match WEBHOOK_SECRET set in MinIO notification config
  # openssl rand -hex 32 | tr -d '\n' | base64
  WEBHOOK_SECRET: <base64-encoded-webhook-secret>

  # MCP server credentials — account used by the MCP service to authenticate to the backend
  # Create the account first: POST /api/v1/auth/register
  # echo -n "mcp-service-account" | base64
  MCP_USERNAME: <base64-encoded-mcp-username>
  # echo -n "<strong-mcp-password>" | base64
  MCP_PASSWORD: <base64-encoded-mcp-password>

  # Optional — only needed if using cloud LLMs or integrations:
  # OPENAI_API_KEY: <base64>
  # JIRA_API_TOKEN: <base64>
  # SPLUNK_API_TOKEN: <base64>
  # OCP_SA_TOKEN: <base64>
  # SLACK_BOT_TOKEN: <base64>
