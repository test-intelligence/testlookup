apiVersion: v1
kind: ConfigMap
metadata:
  name: testlookup-config
  namespace: testlookup
data:
  APP_ENV: "production"
  APP_VERSION: "0.0.1"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  POSTGRES_HOST: "testlookup-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "testlookup"
  POSTGRES_USER: "testlookup_user"
  # Fleet-wide PostgreSQL contract. External/managed databases must report at
  # least this SHOW max_connections value before a production rollout.
  PG_FLEET_MAX_CONNECTIONS: "400"
  PG_FLEET_OPERATIONAL_RESERVE: "50"
  PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS: "3"
  PG_FLEET_RESERVED_CONNECTIONS: "0"
  # A release runs one controlled migration process before API rollout.
  PG_FLEET_MIGRATION_CONNECTIONS: "1"
  PG_FLEET_REQUIRED_CONNECTIONS: "273"
  MONGO_HOST: "testlookup-mongo"
  MONGO_PORT: "27017"
  MONGO_DB: "testlookup_logs"
  REDIS_URL: "redis://testlookup-redis:6379/0"
  CELERY_BROKER_URL: "redis://testlookup-redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://testlookup-redis:6379/1"
  MINIO_ENDPOINT: "testlookup-minio:9000"
  MINIO_BUCKET_NAME: "test-telemetry"
  MINIO_USE_SSL: "false"
  OLLAMA_BASE_URL: "http://testlookup-ollama:11434"
  CHROMA_HOST: "testlookup-chromadb"
  CHROMA_PORT: "8001"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "qwen2.5:7b"
  AI_OFFLINE_MODE: "true"
  # BUG-001: disable ChromaDB anonymous telemetry (posthog phone-home that errors
  # against the installed posthog and floods AI-worker logs; also wrong offline).
  ANONYMIZED_TELEMETRY: "False"
  AI_CONFIDENCE_THRESHOLD: "80"
  CELERY_WORKER_CONCURRENCY: "4"
  # Producers and the ingestion worker subscription must change together.
  # Follow docs/operations/ingestion-shard-count-change.md for any edit.
  LIVE_INGEST_SHARD_COUNT: "8"
  # IMPORTANT: override per environment via a kustomize overlay patch.
  # Must match the ingress hostname users open in their browser, otherwise
  # the dashboard will be blocked by CORS. Multiple origins comma-separated.
  CORS_ORIGINS: "https://testlookup.example.com"
  # Externally-reachable base URL used to build links in Jira tickets,
  # Slack/Teams notifications, and emails. Override per environment.
  PUBLIC_BASE_URL: "https://testlookup.example.com"
  # MCP server internal service URL (used by the backend's health endpoint reference only)
  MCP_SERVICE_URL: "http://testlookup-mcp:8002"
  # Peer addresses allowed to supply X-Forwarded-For (re-audit H2). Without
  # this the API sees the ingress address as every caller's IP, collapsing the
  # login rate limiter onto one shared bucket and making every audit IP
  # meaningless. "*" is safe ONLY because networkpolicy.yaml is default-deny
  # and admits :8000 from ingress-nginx, the frontend, the workers and the MCP
  # server alone. Widening that policy means narrowing this to the ingress
  # controller pod CIDR in the same change.
  FORWARDED_ALLOW_IPS: "*"
  # ── Observability ────────────────────────────────────────────────────────────
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "testlookup"
  # Set to your OTEL Collector / Jaeger OTLP HTTP endpoint in overlays
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4318"
  METRICS_ENABLED: "true"
