# Dedicated bounded sub-agent worker. Parent decision pipelines may wait for a
# selected cluster child, so this queue must never share their worker pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-worker-children
  namespace: testlookup
  labels:
    app: testlookup-worker-children
    app.kubernetes.io/component: worker
    queue: agent_children
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: testlookup-worker-children
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
      labels:
        app: testlookup-worker-children
        app.kubernetes.io/component: worker
        queue: agent_children
    spec:
      # Pod-level, so every container in this pod (an init container, and any
      # added later) inherits them. No fsGroup: OpenShift's restricted SCC
      # refuses a fixed one, and the writable volumes are emptyDirs.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: testlookup-sa
      terminationGracePeriodSeconds: 960
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z testlookup-redis 6379; do
                echo "wait-for-redis: Redis unavailable, retrying in 2s"
                sleep 2
              done
          # The same restrictions as the main container below. busybox's own
          # default user is root, so the uid is stated.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: worker
          image: ghcr.io/test-intelligence/testlookup/backend:v0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.worker.worker_process
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=1
            - --prefetch-multiplier=1
            - -Q
            - agent_children
            - --max-tasks-per-child=25
            - --hostname=agent-children@%h
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: testlookup-config
            - secretRef:
                name: testlookup-secrets
          env:
            - name: PG_PROCESS_ROLE
              value: worker
            - name: PG_PROCESSES_PER_POD
              value: "1"
            - name: PG_POOL_SIZE
              value: "1"
            - name: PG_MAX_OVERFLOW
              value: "1"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
            # Keep the embedding weights on the mounted cache below rather than
            # in $HOME, which is /tmp here and is discarded on restart.
            - name: CHROMA_ONNX_MODEL_DIR
              value: /var/cache/testlookup/chroma-onnx
          volumeMounts:
            # The root filesystem is read-only. /tmp is HOME in the image, and
            # holds temp files, uploads being parsed and the worker's ready file.
            - name: tmp
              mountPath: /tmp
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
            - name: embedder-model-cache
              mountPath: /var/cache/testlookup/chroma-onnx
            # Re-audit M14: per-pod ML model cache (see backend-deployment.yaml).
            - name: ml-models
              mountPath: /var/lib/testlookup/ml-models
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command: [python, -m, app.worker.worker_process, probe, --mode=alive]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # A file written by the worker_ready signal — see the note in
            # worker-deployments.yaml. `inspect ping` measures responsiveness,
            # not health, so a busy worker reads as NotReady and the rollout
            # deadlocks. The local parent-identity liveness probe still catches a dead worker.
            exec:
              command:
                - python
                - -m
                - app.worker.worker_process
                - probe
                - --mode=ready
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # Everything the process writes is on a volume below.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        # Writable /tmp for a read-only root filesystem.
        - name: tmp
          emptyDir: {}
        - name: prometheus-multiproc
          emptyDir: {}
        # ChromaDB's all-MiniLM ONNX weights (79 MB) — see the note in
        # worker-deployments.yaml. Fetched at most once per pod instead of
        # once per container restart.
        - name: embedder-model-cache
          emptyDir: {}
        # Re-audit M14: ML model cache, filled from the object store.
        - name: ml-models
          emptyDir: {}
