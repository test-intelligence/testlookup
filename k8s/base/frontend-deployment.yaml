apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-frontend
  namespace: testlookup
  labels:
    app: testlookup-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testlookup-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: testlookup-frontend
        app.kubernetes.io/component: frontend
    spec:
      # Pod-level, so every container in this pod (an init container, and any
      # added later) inherits them. No fsGroup: OpenShift's restricted SCC
      # refuses a fixed one, and the writable volumes are emptyDirs.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Drain before stop (2026-10-17: a page open during a deploy got a 504).
      # A deleted pod keeps receiving requests until the ingress drops it from
      # its endpoints; the preStop sleep keeps nginx serving through that lag,
      # and the grace period leaves the in-flight requests time to finish.
      terminationGracePeriodSeconds: 45
      # No Kubernetes API calls here, so no service-account token in the pod
      # (OSS review 2026-11-12, L-8).
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/test-intelligence/testlookup/frontend:v0.1.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          ports:
            # nginx runs as uid 101 and listens on 8080 in the container; the
            # Service (services.yaml) keeps port 80 and targets this port.
            - containerPort: 8080
              name: http
          env:
            # Override the docker-compose default ("backend:8000") with the
            # in-cluster Service name. The base ingress routes /api to the
            # backend before traffic reaches this pod, but this fallback lets
            # `kubectl port-forward svc/testlookup-frontend` also work.
            - name: BACKEND_UPSTREAM
              value: "testlookup-backend:8000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            # Everything the process writes is on a volume below.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The root filesystem is read-only; nginx runs as uid 101. These
            # two are everything the image writes (frontend/nginx.main.conf):
            # the pid file and temp directories, and the server block the
            # entrypoint renders from the template.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
            # Only a frontend image from before nginx.main.conf writes these
            # two (its stock nginx.conf keeps the pid file in /run and temp
            # files in /var/cache/nginx). They let such an image still start
            # under this manifest: the upgrade test runs the previous build
            # that way. Remove both once no supported image predates the change.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: tmp
          emptyDir: {}
        # An overlay that ships a rendered server block (k3s,
        # openshift-artifactory) replaces this volume's source with its
        # ConfigMap and keeps the name.
        - name: nginx-conf-d
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: testlookup-frontend
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: testlookup-frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: testlookup-frontend
                topologyKey: kubernetes.io/hostname
