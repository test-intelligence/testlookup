apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: testlookup

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - rbac.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - worker-deployments.yaml   # parent queues + beat (independently scalable)
  - worker-children-deployment.yaml  # isolated bounded cluster sub-agents
  - mcp-deployment.yaml
  - ollama-deployment.yaml
  - hpa.yaml                  # all HPAs consolidated here (not embedded in deployments)
  - pdb.yaml                  # PodDisruptionBudgets for graceful node drains
  - networkpolicy.yaml        # default-deny + explicit allows for lateral-movement hardening
  - services.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: testlookup
      app.kubernetes.io/version: "0.0.1"
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true
