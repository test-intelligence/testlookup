apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-beat
spec:
  template:
    spec:
      containers:
        - name: beat
          env:
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://testlookup-otel.testlookup-telemetry.svc:4318
            - name: OTEL_LOGS_ROLE
              value: beat
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /var/run/testlookup-otel/ca.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
              value: /var/run/testlookup-otel/tls.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
              value: /var/run/testlookup-otel/tls.key
          volumeMounts:
            - name: telemetry-client-identity
              mountPath: /var/run/testlookup-otel
              readOnly: true
      volumes:
        - name: telemetry-client-identity
          secret:
            secretName: testlookup-otel-beat-client
            optional: true
