apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-mcp
  namespace: testlookup
spec:
  template:
    spec:
      containers:
        - name: mcp
          env:
            - name: TESTLOOKUP_OTLP_LOGS_ENDPOINT
              value: https://testlookup-otel.testlookup-telemetry.svc:4318/v1/logs
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /var/run/testlookup-otel/ca.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
              value: /var/run/testlookup-otel/tls.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
              value: /var/run/testlookup-otel/tls.key
          volumeMounts:
            - name: telemetry-client-identity
              mountPath: /var/run/testlookup-otel
              readOnly: true
      volumes:
        - name: telemetry-client-identity
          secret:
            secretName: testlookup-otel-mcp-client
            optional: true
