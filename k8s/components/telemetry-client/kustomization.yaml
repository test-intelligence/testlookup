apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - networkpolicy.yaml
patches:
  - path: api.yaml
  - path: worker.yaml
    target:
      kind: Deployment
      name: testlookup-worker-.+
  - path: worker-children.yaml
    target:
      kind: Deployment
      name: testlookup-worker-children
  - path: beat.yaml
    target:
      kind: Deployment
      name: testlookup-beat
  - path: mcp.yaml
