# Daily backup (re-audit M25). One phase per container, sharing an emptyDir:
#   postgres (init) -> pg_dump -Fc          (postgres:16-alpine)
#   mongo    (init) -> mongodump --gzip     (mongo:7)
#   minio    (init) -> every bucket/object  (the backend image: boto3)
#   finalize        -> manifest.json with sha256, one .tar.gz on the PVC,
#                      retention (newest BACKUP_KEEP archives kept)
# A failed phase fails the pod before finalize, so no partial archive is ever
# written. Same archive layout + manifest schema as scripts/ops/backup.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: testlookup-backup
  namespace: testlookup
  labels:
    app: testlookup-backup
    app.kubernetes.io/component: backup
spec:
  # 02:17 in the controller manager's time zone (UTC on most clusters): off
  # the hour, when ingestion is usually quiet.
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: testlookup-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: postgres
              image: postgres:16-alpine
              command: ["/bin/sh", "/scripts/backup.sh", "postgres"]
              # Only this store's credentials, key by key: the dump containers
              # used to receive the whole testlookup-secrets Secret, signing and
              # encryption keys included. lib.sh uses DATABASE_URL when it is
              # set and the ConfigMap's POSTGRES_* pieces with this password
              # otherwise, so neither key has to exist.
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: DATABASE_URL
                      optional: true
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: POSTGRES_PASSWORD
                      optional: true
              # Host names, ports and database names: nothing secret.
              envFrom: &settings
                - configMapRef:
                    name: testlookup-config
              volumeMounts: &work
                - name: scripts
                  mountPath: /scripts
                - name: staging
                  mountPath: /staging
              securityContext: &hardened
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources: &small
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
            - name: mongo
              image: mongo:7
              command: ["/bin/sh", "/scripts/backup.sh", "mongo"]
              # MONGO_URI carries the MongoDB user and password where the
              # store requires them (the K3s and OpenShift deploy scripts
              # write it that way). Without the key, lib.sh falls back to the
              # ConfigMap's MONGO_HOST and MONGO_PORT.
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: MONGO_URI
                      optional: true
              envFrom: *settings
              volumeMounts: *work
              securityContext: *hardened
              resources: *small
            - name: minio
              image: ghcr.io/test-intelligence/testlookup/backend:v0.1.0
              command: ["python", "/scripts/minio_sync.py", "dump", "/staging/minio_data.tar.gz"]
              env:
                - name: HOME
                  value: /tmp
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: MINIO_SECRET_KEY
              envFrom: *settings
              volumeMounts: *work
              securityContext: *hardened
              resources: *small
          containers:
            - name: finalize
              image: postgres:16-alpine
              command: ["/bin/sh", "/scripts/backup.sh", "finalize"]
              env:
                - name: BACKUP_KEEP
                  value: "14"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: staging
                  mountPath: /staging
                - name: backups
                  mountPath: /backups
              securityContext: *hardened
              resources: *small
          volumes:
            - name: scripts
              configMap:
                name: testlookup-backup-scripts
            - name: staging
              emptyDir:
                sizeLimit: 20Gi
            - name: backups
              persistentVolumeClaim:
                claimName: testlookup-backups
