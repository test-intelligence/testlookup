# Restore, run on demand only (re-audit M25). A SUSPENDED CronJob rather than
# a loose Job file so it is rendered through the overlay like everything else:
# the air-gapped overlay's image rewrites apply to it too. Run it with
#
#   kubectl -n testlookup create job restore-$(date +%s) --from=cronjob/testlookup-restore
#
# after the steps in README.md (scale the app down, fill in the
# testlookup-restore-request ConfigMap). Phases, sharing an emptyDir:
#   verify   (init) -> extract the archive, check every sha256 in manifest.json
#   postgres (init) -> pg_restore --clean --if-exists --single-transaction
#   mongo    (init) -> mongorestore --drop
#   minio           -> re-upload every bucket/object
apiVersion: batch/v1
kind: CronJob
metadata:
  name: testlookup-restore
  namespace: testlookup
  labels:
    app: testlookup-backup
    app.kubernetes.io/component: restore
spec:
  suspend: true
  # Never fires on its own (suspend), and Feb 31st never comes anyway.
  schedule: "0 0 31 2 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app: testlookup-backup
            app.kubernetes.io/component: restore
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: verify
              image: postgres:16-alpine
              command: ["/bin/sh", "/scripts/restore.sh", "verify"]
              envFrom:
                - configMapRef:
                    name: testlookup-restore-request
              volumeMounts: &all
                - name: scripts
                  mountPath: /scripts
                - name: staging
                  mountPath: /staging
                - name: backups
                  mountPath: /backups
                  readOnly: true
              securityContext: &hardened
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
            - name: postgres
              image: postgres:16-alpine
              command: ["/bin/sh", "/scripts/restore.sh", "postgres"]
              # Only this store's credentials, key by key: these containers
              # used to receive the whole testlookup-secrets Secret, signing and
              # encryption keys included. lib.sh uses DATABASE_URL when it is
              # set and the ConfigMap's POSTGRES_* pieces with this password
              # otherwise, so neither key has to exist.
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: DATABASE_URL
                      optional: true
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: POSTGRES_PASSWORD
                      optional: true
              # Host names, ports and database names: nothing secret.
              envFrom: &settings
                - configMapRef:
                    name: testlookup-config
              volumeMounts: *all
              securityContext: *hardened
            - name: mongo
              image: mongo:7
              command: ["/bin/sh", "/scripts/restore.sh", "mongo"]
              # MONGO_URI carries the MongoDB user and password where the
              # store requires them (the K3s and OpenShift deploy scripts
              # write it that way). Without the key, lib.sh falls back to the
              # ConfigMap's MONGO_HOST and MONGO_PORT.
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: MONGO_URI
                      optional: true
              envFrom: *settings
              volumeMounts: *all
              securityContext: *hardened
          containers:
            - name: minio
              image: ghcr.io/test-intelligence/testlookup/backend:v0.1.0
              command: ["python", "/scripts/minio_sync.py", "restore", "/staging/minio_data.tar.gz"]
              env:
                - name: HOME
                  value: /tmp
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: testlookup-secrets
                      key: MINIO_SECRET_KEY
              envFrom: *settings
              volumeMounts: *all
              securityContext: *hardened
          volumes:
            - name: scripts
              configMap:
                name: testlookup-backup-scripts
            - name: staging
              emptyDir:
                sizeLimit: 20Gi
            - name: backups
              persistentVolumeClaim:
                claimName: testlookup-backups
