apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: testlookup-dev

patches:
  # ── Replica overrides — keep dev footprint small ─────────────────────────
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-backend

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-frontend

  # In dev, a single worker-critical handles all queue traffic to reduce resource use.
  # Other queues are set to 0; tasks will queue in Redis until staging/prod.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-critical

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-ingestion

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-ai

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-default

  # Beat is disabled in dev — tasks are triggered manually
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: testlookup-beat

  # ── Disable HPAs in dev — fixed replica counts are sufficient ────────────
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
    target:
      kind: HorizontalPodAutoscaler

  # ── Dev uses mutable tags (dev-latest); force fresh pulls ───────────────
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/component in (api,worker,frontend)"

  # ── Environment configuration ─────────────────────────────────────────────
  # APP_ENV is "production" here on purpose. "dev" names the cluster stage (one
  # replica, moving image tags, debug logging), not the application's
  # development mode: that mode skips the production secret check and mounts
  # the debug routes, and belongs on a laptop (docker-compose.yml). The base
  # backend Deployment already pins APP_ENV=production; this value used to say
  # "development", so the workers and beat ran in a different mode from the API.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        APP_ENV: "production"
        LOG_LEVEL: "DEBUG"
        CORS_ORIGINS: "http://localhost:3000,https://testlookup-dev.yourdomain.com"
    target:
      kind: ConfigMap
      name: testlookup-config

  # ── Ingress: not on the public controller ─────────────────────────────────
  # A dev install runs moving image tags with debug logging, so its Ingresses
  # must not be served by the internet-facing controller (class "nginx"). Both
  # move to the class "nginx-internal": run an ingress controller with that
  # class behind an internal load balancer to publish them inside your network.
  # With no such controller nothing serves them, and you reach the UI with
  #   kubectl -n testlookup-dev port-forward svc/testlookup-frontend 3000:80
  # (see docs/operations/deploy-kubernetes.md, "Generic overlays").
  - patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx-internal
    target:
      kind: Ingress

images:
  - name: ghcr.io/test-intelligence/testlookup/backend
    newTag: dev-latest
  - name: ghcr.io/test-intelligence/testlookup/frontend
    newTag: dev-latest
  - name: ghcr.io/test-intelligence/testlookup/mcp
    newTag: dev-latest
