# HTTP-only ingress for the single-node K3s path.
#
# Plain HTTP on purpose: the cluster is meant for a trusted network, and a
# self-signed certificate creates friction on every client (browsers, Java SDK,
# curl). There is one origin, http://<host>. The host below is the default;
# k3ssetup/deploy-k3s.sh replaces it with K3S_HOST in its per-deploy
# overlay. For HTTPS, terminate TLS in front of Traefik or add the
# middleware-redirect-https.yaml pattern in this directory with a certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testlookup-traefik-ingress
  namespace: testlookup
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: testlookup.localhost
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /webhooks/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          # Health goes to the diagnostics Service, which keeps NotReady pods
          # in its endpoints. When a critical dependency is down every replica
          # fails readiness and the normal Service empties, so these paths would
          # answer "no available server" -- hiding WHICH dependency died at
          # exactly the moment that is the only thing worth knowing. Serving
          # traffic above still uses the strict Service and still stops.
          #
          # The four endpoints are published by name (Exact), not the /health/
          # prefix: the prefix also published every health endpoint added later
          # (/health/ingestion today). Only these four are meant for callers
          # outside the cluster: the three probes, and /health/details, which
          # the web UI polls for its degraded banner and version badge. Any
          # other /health/ path falls through to the frontend route below.
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: testlookup-backend-diagnostics
                port:
                  number: 8000
          - path: /health/ready
            pathType: Exact
            backend:
              service:
                name: testlookup-backend-diagnostics
                port:
                  number: 8000
          - path: /health/version
            pathType: Exact
            backend:
              service:
                name: testlookup-backend-diagnostics
                port:
                  number: 8000
          - path: /health/details
            pathType: Exact
            backend:
              service:
                name: testlookup-backend-diagnostics
                port:
                  number: 8000
          # No /metrics route: the endpoint has no authentication and would
          # publish internal counters to the internet. Prometheus scrapes each
          # pod directly (k8s/monitoring/podmonitors.yaml), and /metrics
          # requests here fall through to the frontend, which never proxies it.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testlookup-frontend
                port:
                  number: 80
