# Single-node K3s overlay: the in-cluster datastores, a Traefik
# ingress on plain HTTP, single replicas and local-path storage. Deploy it with
# k3ssetup/deploy-k3s.sh, which renders a per-deploy overlay on top of
# this one (your host name, registry, image tag and site patches) — see
# docs/operations/deploy-k3s.md. Applying this directory directly fails at
# image pull on purpose (BUILD_TAG_PLACEHOLDER below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress-traefik.yaml
  # middleware-redirect-https.yaml removed — reference K3s install ingress is HTTP-only.
  - infra-postgres.yaml
  - infra-mongo.yaml
  - infra-redis.yaml
  - infra-minio.yaml
  - infra-chromadb.yaml
  - netpol-k3s.yaml
  - frontend-nginx-configmap.yaml

# Kubernetes backup + restore (re-audit M25): daily pg_dump / mongodump /
# MinIO export to a PVC, retention, and an on-demand restore. Runbook:
# k8s/components/backup/README.md.
components:
  - ../../components/backup
  # Ingress allows for the in-cluster Postgres / MongoDB / Redis / object store
  # above (shared with openshift-artifactory).
  - ../../components/colocated-data-stores

namespace: testlookup

patches:
  # ── Remove the base nginx Ingress (replaced by Traefik IngressRoute) ──────
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-ingress
    target:
      kind: Ingress
      name: testlookup-ingress

  # MCP bearer tokens stay off the HTTP-only Traefik listener. Use a local
  # kubectl port-forward instead of publishing MCP on the network.
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-mcp-ingress
    target:
      kind: Ingress
      name: testlookup-mcp-ingress

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-mcp
      spec:
        template:
          spec:
            containers:
              - name: mcp
                env:
                  - name: TESTLOOKUP_MCP_ALLOWED_HOSTS
                    value: "127.0.0.1:*,localhost:*,[::1]:*"
    target:
      kind: Deployment
      name: testlookup-mcp

  # No imagePullPolicy patch: the base value (IfNotPresent) is kept. The deploy
  # script names every TestLookup image by digest, so a cached image is by
  # definition the right one and a pod restart does not need the registry to
  # be up. (Until the security audit of 2026-11-18 the images were named by
  # tag and pulled on every pod start, so a tag overwritten in the open
  # registry was picked up by the next restart.)

  # ── Redis URLs with the password, from the Secret ─────────────────────────
  # The in-cluster Valkey requires a password (infra-redis.yaml). The base
  # ConfigMap keeps its password-less REDIS_URL / CELERY_BROKER_URL /
  # CELERY_RESULT_BACKEND for the cloud overlays, so every workload that loads
  # that ConfigMap gets the three URLs from the Secret here: an `env` entry
  # wins over `envFrom`. k3ssetup/deploy-k3s.sh writes the Secret keys.
  # One patch per container name (backend, the five workers, beat); a new
  # workload that talks to Redis needs the same three entries
  # (backend/tests/regression/test_k3s_data_stores_require_a_password.py).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: REDIS_URL
                  - name: CELERY_BROKER_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_BROKER_URL
                  - name: CELERY_RESULT_BACKEND
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_RESULT_BACKEND
    target:
      kind: Deployment
      name: testlookup-backend

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: REDIS_URL
                  - name: CELERY_BROKER_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_BROKER_URL
                  - name: CELERY_RESULT_BACKEND
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_RESULT_BACKEND
    target:
      kind: Deployment
      name: testlookup-worker-.*

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-beat
      spec:
        template:
          spec:
            containers:
              - name: beat
                env:
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: REDIS_URL
                  - name: CELERY_BROKER_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_BROKER_URL
                  - name: CELERY_RESULT_BACKEND
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_RESULT_BACKEND
    target:
      kind: Deployment
      name: testlookup-beat

  # ── Single-replica deployments for reference K3s install ────────────────────────────────
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-backend

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-frontend

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-critical

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-ingestion

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-ai

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-worker-default

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: testlookup-beat

  # ── Cap HPAs for reference K3s install resource limits ──────────────────────────────────
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler

  - patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 1
    target:
      kind: HorizontalPodAutoscaler
      name: testlookup-mcp-hpa

  # ── Ollama PVC: use local-path StorageClass (K3s built-in) ────────────────
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
    target:
      kind: PersistentVolumeClaim
      name: ollama-models-pvc

  # ── Lower Ollama memory for reference K3s install (models are smaller) ──────────────────
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 16Gi
    target:
      kind: Deployment
      name: testlookup-ollama

  # ── Frontend nginx: the pre-rendered server block ─────────────────────────
  # The image runs nginx as uid 101 on a read-only root filesystem (the base
  # sets both), so nothing here changes the user any more.
  #
  # The base mounts an emptyDir named nginx-conf-d on /etc/nginx/conf.d, where
  # the image's entrypoint renders its template. This overlay ships the
  # rendered file instead (frontend-nginx-configmap.yaml), so the volume's
  # source becomes the ConfigMap (`emptyDir: null` removes the base's source)
  # and the entrypoint, which has nothing left to render, is skipped.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                command: [nginx, "-g", "daemon off;"]
            volumes:
              - name: nginx-conf-d
                emptyDir: null
                configMap:
                  name: frontend-nginx-conf
    target:
      kind: Deployment
      name: testlookup-frontend

  # ── Beat: write celerybeat-schedule to /tmp (writable by uid 1000) ──────────
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - celery
          - -A
          - app.worker.celery_app
          - beat
          - --loglevel=info
          - -s
          - /tmp/celerybeat-schedule
    target:
      kind: Deployment
      name: testlookup-beat

  # ── Environment configuration ─────────────────────────────────────────────
  # The AI posture stays the base default: AI_OFFLINE_MODE=true with the
  # in-cluster Ollama. A site that wants a hosted provider sets it with a site
  # patch (K3S_PATCHES_DIR), never with a live `kubectl patch`: the deploy
  # re-applies this manifest every run, so a patched value silently reverts.
  # CORS_ORIGINS / PUBLIC_BASE_URL below are the defaults for the default host;
  # the deploy script replaces them with http://<K3S_HOST>.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        APP_ENV: "production"
        LOG_LEVEL: "INFO"
        # Re-audit H2. Users usually sit on a private network too, so the
        # base value's private ranges would trust the clients as well as the
        # proxy -- and uvicorn's reverse walk would then run past a caller's
        # real address and return the spoofed leftmost X-Forwarded-For entry.
        # Pin the K3s pod CIDR (default 10.42.0.0/16, one /24 per node):
        # Traefik and the frontend nginx are the only hops, and both live in
        # it. A cluster installed with a custom --cluster-cidr overrides this
        # with a site patch.
        TRUSTED_PROXY_IPS: "10.42.0.0/16"
        CORS_ORIGINS: "http://testlookup.localhost"
        PUBLIC_BASE_URL: "http://testlookup.localhost"
        STORAGE_BACKEND: "minio"
        ANALYSIS_MODE: "auto"
        DEEP_INVESTIGATION_ENABLED: "true"
        DEV_AUTO_LOGIN_ENABLED: "false"
    target:
      kind: ConfigMap
      name: testlookup-config

images:
  # k3ssetup/deploy-k3s.sh maps these names onto the configured
  # registry (K3S_REGISTRY) and the sha256 digests of one build
  # (build-YYYYMMDD-HHMMSS) in its per-deploy overlay, so nothing ever runs a
  # tag that can be moved and this file is never edited. The placeholder intentionally won't resolve in any
  # registry — running ``kubectl apply -k`` here directly (bypassing the deploy
  # script) fails at ImagePull, which prevents accidental :latest deploys.
  #
  # **Port 30500, not 5000.** This is the NodePort the registry pod is exposed
  # on (``REGISTRY_NODEPORT`` in bootstrap-k3s.sh, mirrored via
  # ``/etc/rancher/k3s/registries.yaml`` on every K3s node). The registry's
  # pod-internal port (5000) is not covered by the containerd mirror config, so
  # pulls would fail with "connection refused" while pushes kept succeeding.
  - name: ghcr.io/test-intelligence/testlookup/backend
    newName: registry.local:30500/testlookup/backend
    newTag: BUILD_TAG_PLACEHOLDER
  - name: ghcr.io/test-intelligence/testlookup/frontend
    newName: registry.local:30500/testlookup/frontend
    newTag: BUILD_TAG_PLACEHOLDER
  - name: ghcr.io/test-intelligence/testlookup/mcp
    newName: registry.local:30500/testlookup/mcp
    newTag: BUILD_TAG_PLACEHOLDER
