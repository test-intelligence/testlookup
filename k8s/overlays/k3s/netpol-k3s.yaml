# NetworkPolicy additions for the single-node K3s overlay. The colocated data
# stores' allow-data-stores comes from k8s/components/colocated-data-stores,
# shared with openshift-artifactory.
#
# Traefik on K3s lives in kube-system, not ingress-nginx, so the base
# allow-frontend/allow-backend/allow-mcp policies are extended below.

# Allow Traefik (kube-system) to reach frontend, backend, and MCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: testlookup
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - testlookup-frontend
          - testlookup-backend
          - testlookup-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
