# Valkey 8.1 (BSD-3-Clause, protocol-compatible with Redis) — deployed inside
# the K3s cluster for reference K3s install, under the original testlookup-redis names.
#
# It is the Celery broker, live-evidence authority, and cache. AOF plus a
# local-path PVC keeps queued work and accepted evidence recoverable across a
# pod restart. volatile-lru avoids silently evicting TTL-less broker/evidence
# keys under cache pressure; ephemeral cache entries must carry a TTL.
#
# Only the image differs from the Redis 7 manifest: the Valkey image ships
# `redis-server` / `redis-cli` as symlinks to valkey-server / valkey-cli, so
# the command and probes below work with either image. Valkey cannot load a
# Redis 7.4 AOF/RDB — an existing install either drains + empties the PVC or
# pins the old image with a one-line patch (see UPGRADING.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-redis
  namespace: testlookup
  labels:
    app: testlookup-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-redis
  template:
    metadata:
      labels:
        app: testlookup-redis
    spec:
      # No Kubernetes API calls here, so no service-account token in the pod
      # (OSS review 2026-11-12, L-8).
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: valkey/valkey:8.1-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - volatile-lru
            # Every client must send the password (security audit 2026-11-18:
            # the broker and token-revocation store took any client that could
            # reach the port). Kubernetes replaces $(REDIS_PASSWORD) with the
            # value of the env entry below. k3ssetup/deploy-k3s.sh generates
            # the Secret key before it applies this manifest.
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: REDIS_PASSWORD
            # redis-cli reads this variable, so `kubectl exec ... redis-cli`
            # signs in without a flag.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # The probes sign in and require the PONG: `redis-cli ping` alone
          # exits 0 on a "NOAUTH" error reply, so it would report a server
          # nobody can use as healthy.
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
