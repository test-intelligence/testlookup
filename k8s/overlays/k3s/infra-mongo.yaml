# MongoDB 7 — deployed inside the K3s cluster for reference K3s install
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-mongo
  namespace: testlookup
  labels:
    app: testlookup-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-mongo
  template:
    metadata:
      labels:
        app: testlookup-mongo
    spec:
      # No Kubernetes API calls here, so no service-account token in the pod
      # (OSS review 2026-11-12, L-8).
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:7
          # With both variables set the image starts mongod with --auth: every
          # client must sign in (security audit 2026-11-18). The image creates
          # this root user by itself ONLY on an empty data directory. On a
          # volume that already holds data, k3ssetup/deploy-k3s.sh creates the
          # user in the running database before it applies this manifest, so
          # never apply this file to an existing install by hand.
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MONGO_ROOT_PASSWORD
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
