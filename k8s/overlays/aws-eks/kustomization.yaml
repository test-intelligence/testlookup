apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AWS EKS overlay — production-grade defaults assuming:
#   - AWS Load Balancer Controller installed (ingressClassName: alb)
#   - EBS CSI driver installed (StorageClass: gp3 — created by storageclass.yaml)
#   - cert-manager + ACM (or Let's Encrypt) for TLS — see docs/operations/deploy-cloud.md
#   - Stateful workloads (postgres/mongo/redis) MAY run in-cluster with EBS, but
#     for production we recommend RDS / DocumentDB / ElastiCache. The base
#     manifests don't deploy those data stores; you wire ConnectionStrings via
#     the testlookup-secrets Secret created out-of-band (see deploy guide).

resources:
  - ../prod
  - storageclass.yaml

namespace: testlookup

patches:
  # ── Ingress: switch to AWS ALB (ingressClassName: alb) ────────────────────
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-ingress
        annotations:
          # Drop nginx-only annotations
          nginx.ingress.kubernetes.io/proxy-read-timeout: null
          nginx.ingress.kubernetes.io/proxy-send-timeout: null
          nginx.ingress.kubernetes.io/proxy-body-size: null
          nginx.ingress.kubernetes.io/ssl-redirect: null
          cert-manager.io/cluster-issuer: null
          # AWS ALB controller
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/group.name: testlookup
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/ssl-redirect: '443'
          # Replace with your ACM certificate ARN
          alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/REPLACE-ME
          alb.ingress.kubernetes.io/healthcheck-path: /health/live
          alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
      spec:
        ingressClassName: alb
    target:
      kind: Ingress
      name: testlookup-ingress

  # ── Health: publish the endpoints by name, not the /health/ prefix ────────
  # The base routes the whole prefix, which also publishes every health
  # endpoint added later (/health/ingestion today). Only these four are meant
  # for callers outside the cluster: the three probes, and /health/details,
  # which the web UI polls for its degraded banner and version badge. They
  # still go to the diagnostics Service, which answers while the backend is
  # failing readiness. The `test` op stops the build if the base path list
  # changes and index 4 is no longer the /health/ entry.
  - patch: |-
      - op: test
        path: /spec/rules/0/http/paths/4/path
        value: /health/
      - op: remove
        path: /spec/rules/0/http/paths/4
      - op: add
        path: /spec/rules/0/http/paths/4
        value:
          path: /health/live
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/5
        value:
          path: /health/ready
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/6
        value:
          path: /health/version
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/7
        value:
          path: /health/details
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
    target:
      kind: Ingress
      name: testlookup-ingress

  # The MCP host joins the same ALB and keeps SSE connections open for one hour.
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-mcp-ingress
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: null
          nginx.ingress.kubernetes.io/proxy-read-timeout: null
          nginx.ingress.kubernetes.io/proxy-send-timeout: null
          nginx.ingress.kubernetes.io/limit-rps: null
          nginx.ingress.kubernetes.io/limit-connections: null
          cert-manager.io/cluster-issuer: null
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/group.name: testlookup
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/ssl-redirect: '443'
          alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/REPLACE-ME
          alb.ingress.kubernetes.io/healthcheck-path: /health/live
          alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
      spec:
        ingressClassName: alb
        tls: null
    target:
      kind: Ingress
      name: testlookup-mcp-ingress

  # ── PVCs: pin to gp3 StorageClass (defined in storageclass.yaml) ──────────
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: gp3
    target:
      kind: PersistentVolumeClaim

  # ALB target-type ip reaches pod IPs directly. The ALB security group is the
  # network perimeter; bearer verification remains mandatory at the MCP pod.
  - patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          ipBlock:
            cidr: 0.0.0.0/0
    target:
      kind: NetworkPolicy
      name: allow-mcp

  # The same for the frontend (8080) and the backend API (8000): with
  # target-type ip the ALB sends straight to those pods too. Without these two
  # rules, turning NetworkPolicy enforcement on (Terraform
  # enable_network_policy, the VPC CNI's enableNetworkPolicy) made
  # default-deny-all refuse the load balancer and the application stopped
  # answering, which is why enforcement was left off (security review
  # 2026-11-20, TL-05). The rule opens only the port each policy already
  # names; the data stores, workers and model services stay closed to
  # everything but the pods the base policies list.
  #
  # 0.0.0.0/0 because the ALB's addresses are your VPC's public subnets, which
  # this file cannot know. Narrow it in your copy: replace the CIDR in all
  # three rules with those subnets (Terraform output public_subnet_cidrs, or
  # the subnets tagged kubernetes.io/role/elb). Pods get VPC addresses from
  # the private subnets, so that also stops other workloads in the cluster
  # from skipping the load balancer.
  - patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          ipBlock:
            cidr: 0.0.0.0/0
    target:
      kind: NetworkPolicy
      name: allow-frontend
  - patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          ipBlock:
            cidr: 0.0.0.0/0
    target:
      kind: NetworkPolicy
      name: allow-backend

images:
  # Replace ACCOUNT/REGION below with your ECR registry path before applying.
  # Example: docker tag ghcr.io/test-intelligence/testlookup/backend:v0.1.0 \
  #   123456789012.dkr.ecr.us-east-1.amazonaws.com/testlookup/backend:v0.1.0
  - name: ghcr.io/test-intelligence/testlookup/backend
    newName: ACCOUNT.dkr.ecr.REGION.amazonaws.com/testlookup/backend
    newTag: "v0.1.0"
  - name: ghcr.io/test-intelligence/testlookup/frontend
    newName: ACCOUNT.dkr.ecr.REGION.amazonaws.com/testlookup/frontend
    newTag: "v0.1.0"
  - name: ghcr.io/test-intelligence/testlookup/mcp
    newName: ACCOUNT.dkr.ecr.REGION.amazonaws.com/testlookup/mcp
    newTag: "v0.1.0"
