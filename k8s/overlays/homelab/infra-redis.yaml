# Redis 7 — deployed inside the K3s cluster for homelab.
#
# Redis is the Celery broker as well as the cache. AOF plus a local-path PVC
# keeps queued child dispatches recoverable across a pod restart. volatile-lru
# avoids silently evicting TTL-less broker/session keys under cache pressure;
# ephemeral cache entries must carry a TTL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-redis
  namespace: testlookup
  labels:
    app: testlookup-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-redis
  template:
    metadata:
      labels:
        app: testlookup-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
