# Valkey 8.1 (BSD-3-Clause, protocol-compatible with Redis) — deployed inside
# the K3s cluster for homelab, under the original testlookup-redis names.
#
# It is the Celery broker, live-evidence authority, and cache. AOF plus a
# local-path PVC keeps queued work and accepted evidence recoverable across a
# pod restart. volatile-lru avoids silently evicting TTL-less broker/evidence
# keys under cache pressure; ephemeral cache entries must carry a TTL.
#
# Only the image differs from the Redis 7 manifest: the Valkey image ships
# `redis-server` / `redis-cli` as symlinks to valkey-server / valkey-cli, so
# the command and probes below work with either image. Valkey cannot load a
# Redis 7.4 AOF/RDB — an existing install either drains + empties the PVC or
# pins the old image with a one-line patch (see UPGRADING.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-redis
  namespace: testlookup
  labels:
    app: testlookup-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-redis
  template:
    metadata:
      labels:
        app: testlookup-redis
    spec:
      containers:
        - name: redis
          image: valkey/valkey:8.1-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
