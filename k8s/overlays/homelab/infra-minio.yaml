# S3-compatible object storage for homelab: versitygw (Apache-2.0), posix
# backend — buckets are directories and objects plain files on the PVC.
#
# The testlookup-minio names, the minio-data PVC, the /data mount, port 9000
# and the MINIO_* secret keys are unchanged; only the container differs from
# the former MinIO/Silo one. Objects live in /data/s3, NOT /data, so a PVC
# that still holds a MinIO/Silo data directory is never read or modified.
# Existing data is migrated with scripts/s3_setup.py --copy-from-endpoint, or
# the old container is pinned with a local patch (see UPGRADING.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-minio
  namespace: testlookup
  labels:
    app: testlookup-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-minio
  template:
    metadata:
      labels:
        app: testlookup-minio
    spec:
      containers:
        - name: minio
          image: ghcr.io/versity/versitygw:v1.8.0
          # The posix backend refuses to start when its root directory is missing.
          command: ["/bin/sh", "-c", 'mkdir -p "$VGW_BACKEND_ARG" && exec /usr/local/bin/docker-entrypoint.sh']
          ports:
            - containerPort: 9000
              name: api
          env:
            - name: VGW_BACKEND
              value: posix
            - name: VGW_BACKEND_ARG
              value: /data/s3
            - name: VGW_PORT
              value: ":9000"
            - name: VGW_HEALTH
              value: /health
            - name: VGW_QUIET
              value: "true"
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MINIO_ACCESS_KEY
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MINIO_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
