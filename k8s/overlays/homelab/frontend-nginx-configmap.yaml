apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: testlookup
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ────────────────────────────────────────────────
        # index.html carries a CSP <meta> tag, but browsers IGNORE
        # frame-ancestors delivered that way, so the anti-clickjacking intent
        # stated in index.html was never enforced. It only works as a header.
        #
        # NGINX GOTCHA: add_header is inherited only when the child level
        # declares NO add_header of its own — so every location that sets its
        # own headers must REPEAT these or silently lose them.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # index.html must NEVER be cached — Vite hashes asset filenames, so a new
        # build emits new index-<hash>.js URLs and a fresh index.html referencing
        # them. If a browser or intermediate caches the old index.html it will keep
        # loading the old (and possibly 404'ing) asset hashes after a redeploy.
        # The hashed assets below are immutable and stay aggressively cached.
        location = /index.html {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://testlookup-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /ws/ {
            proxy_pass http://testlookup-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /webhooks/ {
            proxy_pass http://testlookup-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 1000;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
