# PostgreSQL 16 — deployed inside the K3s cluster for homelab
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-postgres
  namespace: testlookup
  labels:
    app: testlookup-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-postgres
  template:
    metadata:
      labels:
        app: testlookup-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: testlookup-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: testlookup-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # CPU limit raised 1000m -> 4000m (2026-08-08) on measurement, not a
          # hunch. Under 8 concurrent /api/v1/search requests this pod ran at
          # 0.99 of its 1-core limit (cgroup usage_usec: cpu=50013ms over
          # wall=50601ms) while the backend sat at 0.12 cores and
          # pg_stat_activity showed 8 queries ACTIVE with no wait_event —
          # i.e. running concurrently but sharing a single core. Search p95
          # hit 397ms against its 300ms budget; run_list was unaffected
          # because it is a cheap indexed page.
          #
          # Nodes have 20 cores and this cluster runs TestLookup alone, so the
          # 1-core cap was the binding constraint, not capacity. Requests stay
          # at 250m: this is bursty query load, not steady draw, and a low
          # request keeps scheduling flexible.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "testlookup_user", "-d", "testlookup"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "testlookup_user", "-d", "testlookup"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
