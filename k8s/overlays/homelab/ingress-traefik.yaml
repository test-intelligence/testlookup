# Two ingresses:
#   testlookup-traefik-redirect — HTTP listener, 308-redirects every request to
#     HTTPS via the redirect-https Middleware (see middleware-redirect-https.yaml).
#   testlookup-traefik-ingress  — HTTPS listener that serves the app. TLS is
#     terminated with the testlookup-tls-cert Secret, which deploy-homelab.sh
#     provisions out-of-band as a self-signed cert (idempotent).
# Splitting them ensures the browser settles on a single canonical
# https://testlookup.local origin, so the SPA's JWT in localStorage is always
# accessible to subsequent requests (an http→https mid-session causes a silent
# origin swap and 401s on every API call).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testlookup-traefik-redirect
  namespace: testlookup
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: testlookup-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: testlookup.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testlookup-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testlookup-traefik-ingress
  namespace: testlookup
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - testlookup.local
      secretName: testlookup-tls-cert
  rules:
    - host: testlookup.local
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /webhooks/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /health/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testlookup-frontend
                port:
                  number: 80
