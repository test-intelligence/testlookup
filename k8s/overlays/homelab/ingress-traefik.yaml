# HTTP-only ingress for the homelab.
#
# TLS was intentionally removed: this cluster is on the local LAN, the
# `testlookup.local` hostname only resolves via /etc/hosts on trusted
# machines, and we kept hitting self-signed-cert friction on every client
# (browsers, Java SDK, curl). Splitting the listeners is no longer needed
# once the redirect is gone — there's only one origin, http://testlookup.local.
#
# If you ever want HTTPS back, restore middleware-redirect-https.yaml +
# the split ingresses from git history.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testlookup-traefik-ingress
  namespace: testlookup
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: testlookup.local
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /webhooks/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /health/
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: testlookup-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testlookup-frontend
                port:
                  number: 80
