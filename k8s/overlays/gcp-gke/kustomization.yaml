apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GCP GKE overlay — production-grade defaults assuming:
#   - GKE Autopilot or Standard cluster (1.27+)
#   - Built-in GCE Ingress controller (ingressClassName: gce)
#   - Built-in pd.csi.storage.gke.io driver (StorageClass: standard-rwo)
#   - Google-managed certificates via networking.gke.io/managed-certificates
#   - For production, prefer Cloud SQL (Postgres) / MongoDB Atlas / Memorystore
#     (Redis) / GCS-compatible MinIO. The base manifests don't deploy those —
#     wire DSNs into the testlookup-secrets Secret created out-of-band (see
#     docs/operations/deploy-cloud.md).

resources:
  - ../prod
  - managed-cert.yaml
  - frontend-config.yaml
  - mcp-backend-config.yaml

namespace: testlookup

patches:
  # ── Ingress: switch to GCE LoadBalancer ───────────────────────────────────
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-ingress
        annotations:
          # Drop nginx-only annotations
          nginx.ingress.kubernetes.io/proxy-read-timeout: null
          nginx.ingress.kubernetes.io/proxy-send-timeout: null
          nginx.ingress.kubernetes.io/proxy-body-size: null
          nginx.ingress.kubernetes.io/ssl-redirect: null
          cert-manager.io/cluster-issuer: null
          # GCE Ingress with managed certificate
          kubernetes.io/ingress.class: "gce"
          networking.gke.io/managed-certificates: "testlookup-cert"
          kubernetes.io/ingress.global-static-ip-name: "testlookup-ip"
          # Redirect port 80 to HTTPS (frontend-config.yaml). A GCE Ingress
          # serves plain HTTP unless it is told not to.
          networking.gke.io/v1beta1.FrontendConfig: "testlookup-frontend-config"
      spec:
        ingressClassName: gce
        # GCE Ingress doesn't use the `tls` block — TLS is wired via the
        # ManagedCertificate annotation above.
        tls: null
    target:
      kind: Ingress
      name: testlookup-ingress

  # GCE Ingress owns one load balancer/static IP. Add the MCP hostname to the
  # primary Ingress, then delete the inherited nginx-only MCP Ingress.
  # This is a JSON patch that appends a rule. A merge patch with a `rules`
  # list replaces the whole list, which left this Ingress with the MCP host
  # only and the application host routed nowhere.
  - patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: testlookup-mcp.example.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: testlookup-mcp
                    port:
                      number: 8002
    target:
      kind: Ingress
      name: testlookup-ingress

  # ── Health: publish the endpoints by name, not the /health/ prefix ────────
  # The base routes the whole prefix, which also publishes every health
  # endpoint added later (/health/ingestion today). Only these four are meant
  # for callers outside the cluster: the three probes, and /health/details,
  # which the web UI polls for its degraded banner and version badge. They
  # still go to the diagnostics Service, which answers while the backend is
  # failing readiness. The `test` op stops the build if the base path list
  # changes and index 4 is no longer the /health/ entry.
  - patch: |-
      - op: test
        path: /spec/rules/0/http/paths/4/path
        value: /health/
      - op: remove
        path: /spec/rules/0/http/paths/4
      - op: add
        path: /spec/rules/0/http/paths/4
        value:
          path: /health/live
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/5
        value:
          path: /health/ready
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/6
        value:
          path: /health/version
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/7
        value:
          path: /health/details
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
    target:
      kind: Ingress
      name: testlookup-ingress

  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-mcp-ingress
    target:
      kind: Ingress
      name: testlookup-mcp-ingress

  # ── PVCs: pin to standard-rwo (GKE default SSD-backed) ───────────────────
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: standard-rwo
    target:
      kind: PersistentVolumeClaim

  # GCE external Application Load Balancers and health checks reach standalone
  # NEG endpoints from these documented Google Front End source ranges.
  - patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          ipBlock:
            cidr: 35.191.0.0/16
      - op: add
        path: /spec/ingress/0/from/-
        value:
          ipBlock:
            cidr: 130.211.0.0/22
    target:
      kind: NetworkPolicy
      name: allow-mcp

  # ── Backend Service: needs container-native LB annotation for GCE ─────────
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: testlookup-backend
        annotations:
          cloud.google.com/neg: '{"ingress": true}'
    target:
      kind: Service
      name: testlookup-backend

  # ── Re-audit H2: who may set X-Forwarded-For on THIS topology ────────────
  # Container-native load balancing (the standalone NEG annotations below)
  # means the Google Front End connects DIRECTLY to the backend pod, so the
  # pod's TCP peer is a GFE address, not another pod. The base ConfigMap trusts
  # the private ranges cloud pod networks are drawn from, which does not
  # include these — and uvicorn ignores X-Forwarded-For entirely unless the
  # immediate peer is trusted, so without this the API records the load
  # balancer as every caller and H2 is back.
  #
  # These are Google's documented health-check and GFE source ranges — the same
  # two CIDRs this file already adds to the NetworkPolicy above.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        TRUSTED_PROXY_IPS: "35.191.0.0/16,130.211.0.0/22"
    target:
      kind: ConfigMap
      name: testlookup-config

  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: testlookup-frontend
        annotations:
          cloud.google.com/neg: '{"ingress": true}'
    target:
      kind: Service
      name: testlookup-frontend

  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: testlookup-mcp
        annotations:
          cloud.google.com/neg: '{"ingress": true}'
          cloud.google.com/backend-config: '{"default":"testlookup-mcp-backend-config"}'
    target:
      kind: Service
      name: testlookup-mcp

images:
  # Replace PROJECT/REGION with your Artifact Registry path.
  # Example: docker tag ghcr.io/test-intelligence/testlookup/backend:v0.1.0 \
  #   us-docker.pkg.dev/my-project/testlookup/backend:v0.1.0
  - name: ghcr.io/test-intelligence/testlookup/backend
    newName: REGION-docker.pkg.dev/PROJECT/testlookup/backend
    newTag: "v0.1.0"
  - name: ghcr.io/test-intelligence/testlookup/frontend
    newName: REGION-docker.pkg.dev/PROJECT/testlookup/frontend
    newTag: "v0.1.0"
  - name: ghcr.io/test-intelligence/testlookup/mcp
    newName: REGION-docker.pkg.dev/PROJECT/testlookup/mcp
    newTag: "v0.1.0"
