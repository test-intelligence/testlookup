apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testlookup
  namespace: testlookup
  annotations:
    # HSTS at the TLS edge (re-audit L1): one year, no includeSubDomains.
    haproxy.router.openshift.io/hsts_header: "max-age=31536000"
spec:
  host: testlookup.apps.example.com
  to:
    kind: Service
    name: testlookup-frontend
  port:
    targetPort: http
  tls:
    termination: edge
---
# The API host carries only the paths the base Ingress sends to the backend
# (k8s/base/ingress.yaml). One Route for the whole host also published
# /metrics, which has no authentication (OSS review 2026-11-12, M-12);
# Prometheus scrapes the pods directly (k8s/monitoring/podmonitors.yaml).
# /health/ goes to the diagnostics Service, as in the Ingress.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testlookup-api
  namespace: testlookup
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000"
spec:
  host: testlookup-api.apps.example.com
  path: /api/
  to:
    kind: Service
    name: testlookup-backend
  port:
    targetPort: http
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testlookup-api-webhooks
  namespace: testlookup
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000"
spec:
  host: testlookup-api.apps.example.com
  path: /webhooks/
  to:
    kind: Service
    name: testlookup-backend
  port:
    targetPort: http
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testlookup-api-docs
  namespace: testlookup
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000"
spec:
  host: testlookup-api.apps.example.com
  path: /api-docs
  to:
    kind: Service
    name: testlookup-backend
  port:
    targetPort: http
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testlookup-api-ws
  namespace: testlookup
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000"
spec:
  host: testlookup-api.apps.example.com
  path: /ws/
  to:
    kind: Service
    name: testlookup-backend
  port:
    targetPort: http
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testlookup-api-health
  namespace: testlookup
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000"
spec:
  host: testlookup-api.apps.example.com
  path: /health/
  to:
    kind: Service
    name: testlookup-backend-diagnostics
  port:
    targetPort: http
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testlookup-mcp
  namespace: testlookup
  annotations:
    haproxy.router.openshift.io/timeout: "1h"
    haproxy.router.openshift.io/hsts_header: "max-age=31536000"
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "20"
    haproxy.router.openshift.io/rate-limit-connections.rate-tcp: "10"
spec:
  host: testlookup-mcp.apps.example.com
  to:
    kind: Service
    name: testlookup-mcp
  port:
    targetPort: sse
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
