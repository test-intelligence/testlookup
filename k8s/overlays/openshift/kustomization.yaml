apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This overlay does not deploy Redis. Before applying it, the platform overlay
# must provide a durable endpoint behind the ``testlookup-redis`` Service and
# authenticated Redis URLs. The H02/H03 cutover runbook defines the required
# persistence, backup, failover, and non-eviction contract; a cache-only Redis
# service is not valid for live evidence or the Celery broker.
resources:
  - ../../base
  - route.yaml

namespace: testlookup

patches:
  # ── Re-audit H2: who may set X-Forwarded-For ─────────────────────────────
  # REPLACE WITH YOUR CLUSTER'S POD CIDR:
  #     oc get network.config/cluster -o jsonpath='{.spec.clusterNetwork[*].cidr}'
  #
  # This is an ON-PREMISE cluster: its users share RFC1918 with its pods, so
  # inheriting the base value (which is shaped for clusters whose callers
  # arrive from public addresses) makes each caller a trusted hop. uvicorn's
  # reverse walk then runs PAST a caller's real address and returns the
  # leftmost X-Forwarded-For entry, which the caller supplied -- the same spoof
  # as TRUSTED_PROXY_IPS="*", reached by being generous.
  #
  # 10.128.0.0/14 is the OpenShift SDN/OVN-Kubernetes default cluster network.
  # A value that is too NARROW costs the real client IP (the original H2); one
  # that is too WIDE lets a caller forge it. Prefer the narrow mistake.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        TRUSTED_PROXY_IPS: "10.128.0.0/14"
    target:
      kind: ConfigMap
      name: testlookup-config

  # ── Remove standard Ingress — OpenShift uses Routes instead ──────────────
  - path: remove-ingress.yaml

  # ── OpenShift SCC: remove hardcoded runAsUser from every Deployment ───────
  # The "restricted" SCC assigns a random UID from the project's namespace range.
  # Keeping runAsUser: 1000 causes "SCC violation" admission failures on clusters
  # that do not grant the "anyuid" SCC to the service account.
  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
    target:
      kind: Deployment
      name: testlookup-backend

  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
    target:
      kind: Deployment
      name: testlookup-worker-critical

  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
    target:
      kind: Deployment
      name: testlookup-worker-ingestion

  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
    target:
      kind: Deployment
      name: testlookup-worker-ai

  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
    target:
      kind: Deployment
      name: testlookup-worker-default

  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
    target:
      kind: Deployment
      name: testlookup-beat

  # ── Add OpenShift-required annotation to force restricted SCC ─────────────
  # This prevents the pod from accidentally getting a more permissive SCC via
  # namespace defaults.  Remove this annotation if your SA has anyuid granted.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
      spec:
        template:
          metadata:
            annotations:
              openshift.io/scc: restricted-v2
    target:
      kind: Deployment

  # ── Environment ───────────────────────────────────────────────────────────
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        APP_ENV: "production"
        LOG_LEVEL: "INFO"
        AI_OFFLINE_MODE: "true"
        CORS_ORIGINS: "https://testlookup.apps.example.com"
    target:
      kind: ConfigMap
      name: testlookup-config

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-mcp
      spec:
        template:
          spec:
            containers:
              - name: mcp
                env:
                  - name: TESTLOOKUP_MCP_ALLOWED_HOSTS
                    value: "testlookup-mcp.apps.example.com"
    target:
      kind: Deployment
      name: testlookup-mcp

images:
  - name: testlookup/backend
    newTag: "0.0.1"
  - name: testlookup/frontend
    newTag: "0.0.1"
  - name: testlookup/mcp
    newTag: "0.0.1"
