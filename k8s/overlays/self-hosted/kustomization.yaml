apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Self-hosted / private-cloud K8s overlay — works on:
#   - Vanilla kubeadm clusters
#   - K3s / RKE / RKE2
#   - Rancher (multi-cluster)
#   - On-prem OpenStack/VMware K8s
#   - kind / minikube (for testing the manifests)
#
# Assumes:
#   - NGINX Ingress Controller (the most portable choice)
#   - cert-manager + Let's Encrypt OR a corporate CA wired via the
#     `cluster-issuer` annotation
#   - StorageClass defaults to whatever your cluster provides — override via
#     STORAGE_CLASS env in scripts/deploy-k8s.sh, or patch this file.
#   - Stateful workloads (postgres/mongo/redis/minio) run IN-CLUSTER by default
#     (see homelab overlay for an example wiring). For production, swap to
#     external managed services and update testlookup-secrets accordingly.

resources:
  - ../prod

namespace: testlookup

patches:
  # ── Re-audit H2: who may set X-Forwarded-For ─────────────────────────────
  # REPLACE THIS WITH YOUR CLUSTER'S POD CIDR:
  #     kubectl get nodes -o jsonpath='{range .items[*]}{.spec.podCIDR}{"\n"}{end}'
  #
  # The base ConfigMap trusts the private ranges cloud pod networks come from,
  # which is right when your USERS arrive from public addresses. On an
  # on-premise cluster they do not: they share RFC1918 with the pods. Trusting
  # a range your callers sit in makes each caller a trusted hop, so uvicorn's
  # reverse walk runs PAST its real address and returns the leftmost
  # X-Forwarded-For entry — which the caller supplied. That is the same spoof
  # as TRUSTED_PROXY_IPS="*", reached by being generous instead.
  #
  # The value below covers the pod CIDRs the distributions named at the top of
  # this file use by default (K3s/RKE2 10.42/16, kubeadm+Flannel 10.244/16,
  # Kubespray 10.233/16). If yours differs, a WRONG value here costs you the
  # real client IP — the original H2 — while a value that is merely too WIDE
  # lets a caller forge it. Prefer the narrow mistake.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        TRUSTED_PROXY_IPS: "10.42.0.0/16,10.244.0.0/16,10.233.0.0/16"
    target:
      kind: ConfigMap
      name: testlookup-config

  # ── Ingress: NGINX with cert-manager (most portable) ──────────────────────
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-ingress
      spec:
        ingressClassName: nginx
    target:
      kind: Ingress
      name: testlookup-ingress

  # ── Optional: pin a specific StorageClass ────────────────────────────────
  # Uncomment and replace `local-path` (K3s default) with whatever your
  # cluster provides (e.g. `longhorn`, `rook-ceph-block`, `nfs-client`).
  # - patch: |-
  #     - op: replace
  #       path: /spec/storageClassName
  #       value: longhorn
  #   target:
  #     kind: PersistentVolumeClaim

# Image pull from your private/internal registry. The deploy-k8s.sh script
# can override these via `kustomize edit set image` for one-off deployments.
images:
  - name: testlookup/backend
    newName: testlookup/backend
    newTag: "0.0.1"
  - name: testlookup/frontend
    newName: testlookup/frontend
    newTag: "0.0.1"
  - name: testlookup/mcp
    newName: testlookup/mcp
    newTag: "0.0.1"
