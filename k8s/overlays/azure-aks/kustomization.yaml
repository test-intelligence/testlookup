apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Azure AKS overlay — production-grade defaults assuming:
#   - AKS cluster (1.27+) with managed-csi (Azure Disk) StorageClass available
#   - NGINX Ingress Controller installed (ingressClassName: nginx) — common
#     pattern on AKS. If you prefer Application Gateway Ingress Controller
#     (AGIC), see the commented section below.
#   - cert-manager + Let's Encrypt for TLS (or use AGIC + Key Vault if AGIC)
#   - For production prefer Azure Database for PostgreSQL Flexible Server,
#     Cosmos DB for MongoDB API, Azure Cache for Redis, and Azure Blob Storage
#     (S3-compatible via blob-csi-driver, or use rclone). Wire connection
#     strings into testlookup-secrets out-of-band — see docs/operations/deploy-cloud.md.

resources:
  - ../prod

namespace: testlookup

patches:
  # ── Ingress: NGINX (default AKS pattern) ──────────────────────────────────
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: testlookup-ingress
        annotations:
          nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
          nginx.ingress.kubernetes.io/proxy-body-size: "100m"
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
      spec:
        ingressClassName: nginx
    target:
      kind: Ingress
      name: testlookup-ingress

  # ── Health: publish the endpoints by name, not the /health/ prefix ────────
  # The base routes the whole prefix, which also publishes every health
  # endpoint added later (/health/ingestion today). Only these four are meant
  # for callers outside the cluster: the three probes, and /health/details,
  # which the web UI polls for its degraded banner and version badge. They
  # still go to the diagnostics Service, which answers while the backend is
  # failing readiness. The `test` op stops the build if the base path list
  # changes and index 4 is no longer the /health/ entry.
  - patch: |-
      - op: test
        path: /spec/rules/0/http/paths/4/path
        value: /health/
      - op: remove
        path: /spec/rules/0/http/paths/4
      - op: add
        path: /spec/rules/0/http/paths/4
        value:
          path: /health/live
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/5
        value:
          path: /health/ready
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/6
        value:
          path: /health/version
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
      - op: add
        path: /spec/rules/0/http/paths/7
        value:
          path: /health/details
          pathType: Exact
          backend:
            service:
              name: testlookup-backend-diagnostics
              port:
                number: 8000
    target:
      kind: Ingress
      name: testlookup-ingress

  # ── Alternative: Application Gateway Ingress Controller (AGIC) ───────────
  # Uncomment if you want AGIC instead of NGINX. AGIC integrates with Azure
  # App Gateway + Key Vault for certificates. Requires AGIC add-on enabled
  # on the AKS cluster.
  # - patch: |-
  #     apiVersion: networking.k8s.io/v1
  #     kind: Ingress
  #     metadata:
  #       name: testlookup-ingress
  #       annotations:
  #         kubernetes.io/ingress.class: azure/application-gateway
  #         appgw.ingress.kubernetes.io/ssl-redirect: "true"
  #         appgw.ingress.kubernetes.io/request-timeout: "120"
  #         appgw.ingress.kubernetes.io/appgw-ssl-certificate: "testlookup-cert"
  #     spec:
  #       ingressClassName: azure-application-gateway
  #   target:
  #     kind: Ingress
  #     name: testlookup-ingress

  # ── PVCs: pin to managed-csi (Azure Disk Premium SSD) ────────────────────
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: managed-csi
    target:
      kind: PersistentVolumeClaim

images:
  # Replace REGISTRY with your Azure Container Registry (ACR) login server.
  # Example: docker tag ghcr.io/test-intelligence/testlookup/backend:v0.1.0 \
  #   mycorp.azurecr.io/testlookup/backend:v0.1.0
  - name: ghcr.io/test-intelligence/testlookup/backend
    newName: REGISTRY.azurecr.io/testlookup/backend
    newTag: "v0.1.0"
  - name: ghcr.io/test-intelligence/testlookup/frontend
    newName: REGISTRY.azurecr.io/testlookup/frontend
    newTag: "v0.1.0"
  - name: ghcr.io/test-intelligence/testlookup/mcp
    newName: REGISTRY.azurecr.io/testlookup/mcp
    newTag: "v0.1.0"
