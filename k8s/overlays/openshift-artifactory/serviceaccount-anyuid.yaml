# The one ServiceAccount that gets the ``anyuid`` SCC
# (openshiftsetup/deploy-openshift-artifactory.sh, Step 5). Only the stock
# third-party images use it: they start as root and drop to their own user
# (postgres, mongo, valkey), or run as root (the object store, chroma, ollama).
# Everything else in the namespace runs with a fixed non-zero UID under
# ``nonroot-v2`` and can never be root. Do not point another workload here.
#
# imagePullSecrets: the deploy script (``artifactory-pull``) and the
# offline-bundle procedure (``local-registry``) link their pull secret to the
# ``default`` account only; a pod on this account needs its own link. A name
# that does not exist in the namespace only logs a warning event.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testlookup-anyuid
  namespace: testlookup
# None of these pods calls the Kubernetes API.
automountServiceAccountToken: false
imagePullSecrets:
  - name: artifactory-pull
  - name: local-registry
