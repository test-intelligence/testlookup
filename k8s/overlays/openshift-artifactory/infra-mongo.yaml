# MongoDB 7 — in-cluster for the air-gapped OpenShift deploy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: STORAGE_CLASS_PLACEHOLDER
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-mongo
  namespace: testlookup
  labels:
    app: testlookup-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-mongo
  template:
    metadata:
      labels:
        app: testlookup-mongo
    spec:
      # No Kubernetes API calls here, so no service-account token in the pod
      # (OSS review 2026-11-12, L-8).
      automountServiceAccountToken: false
      # The stock image starts with its own UID: the only account with the
      # anyuid SCC (serviceaccount-anyuid.yaml).
      serviceAccountName: testlookup-anyuid
      containers:
        - name: mongo
          image: mongo:7
          # Authentication is on when testlookup-secrets holds a root user, and
          # off (as before) when it does not: the keys are optional. The image
          # creates the user only on an EMPTY data directory, so never add the
          # keys by hand on an install with data: the deploy script does it
          # safely (ENABLE_MONGO_AUTH in openshiftsetup/artifactory.env.example).
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MONGO_ROOT_USERNAME
                  optional: true
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: MONGO_ROOT_PASSWORD
                  optional: true
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
