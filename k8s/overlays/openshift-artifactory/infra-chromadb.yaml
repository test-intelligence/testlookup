# ChromaDB — vector store for semantic search / RAG, in-cluster for air-gap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: STORAGE_CLASS_PLACEHOLDER
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-chromadb
  namespace: testlookup
  labels:
    app: testlookup-chromadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-chromadb
  template:
    metadata:
      labels:
        app: testlookup-chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:1.5.9
          ports:
            - containerPort: 8000
          env:
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          # Chroma 1.x persists to /data (its /config.yaml); the 0.x settings
          # IS_PERSISTENT / PERSIST_DIRECTORY are ignored, so the claim was
          # mounted where nothing current was written. subPath chroma-1x: a fresh
          # directory on the same claim, leaving the 0.x files at its root as they
          # are; the vectors are rebuilt by a search reindex (UPGRADING.md).
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: chroma-1x
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chromadb-data
