apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ============================================================================
# OpenShift + single-Artifactory, air-gapped overlay
# ============================================================================
# Deploys the COMPLETE TestLookup stack (app + in-cluster infra) to an
# OpenShift cluster that can ONLY reach one Artifactory registry — no public
# internet. Every image (the 3 app images AND every third-party infra image)
# is rewritten to that single registry by the ``images:`` block below, so the
# cluster never tries to pull from docker.io / ghcr.io / quay.io.
#
# Driven by ``openshiftsetup/deploy-openshift-artifactory.sh``, which builds +
# pushes the app images, mirrors the infra images, then sed-substitutes the
# *_PLACEHOLDER tokens in a working copy of this file before ``oc apply -k``
# and restores the committed placeholders afterwards (same trap-restore trick
# as k3ssetup/deploy-k3s.sh). Running ``oc apply -k`` directly without
# the script is expected to fail at ImagePull — the placeholders intentionally
# don't resolve, which prevents an accidental mis-registry deploy.
# ============================================================================

resources:
  - ../../base
  # In-cluster infra. Self-contained copies (kustomize forbids referencing
  # files outside this overlay dir, and an air-gapped overlay should be
  # self-describing anyway). The PVCs carry STORAGE_CLASS_PLACEHOLDER, which
  # the deploy script substitutes. Image registries are re-pointed by the
  # images: block below. Shapes mirror k8s/overlays/k3s/infra-*.yaml.
  - infra-postgres.yaml
  - infra-mongo.yaml
  - infra-redis.yaml
  - infra-minio.yaml
  - infra-chromadb.yaml
  # The only ServiceAccount that gets the anyuid SCC (data stores + Ollama).
  - serviceaccount-anyuid.yaml
  - frontend-nginx-configmap.yaml
  # OpenShift Routes (HTTPS, edge-terminated, HTTP->HTTPS redirect).
  - route.yaml

# Kubernetes backup + restore (re-audit M25): daily pg_dump / mongodump /
# MinIO export to a PVC, retention, and an on-demand restore. Runbook:
# k8s/components/backup/README.md.
components:
  - ../../components/backup
  # Ingress allows for the in-cluster Postgres / MongoDB / Redis / object store
  # above. Without them the base default-deny-all leaves the stores
  # unreachable (shared with the K3s overlay).
  - ../../components/colocated-data-stores

namespace: testlookup

patches:
  # ── Re-audit H2: who may set X-Forwarded-For ─────────────────────────────
  # REPLACE WITH YOUR CLUSTER'S POD CIDR:
  #     oc get network.config/cluster -o jsonpath='{.spec.clusterNetwork[*].cidr}'
  #
  # This is an ON-PREMISE cluster: its users share RFC1918 with its pods, so
  # inheriting the base value (which is shaped for clusters whose callers
  # arrive from public addresses) makes each caller a trusted hop. uvicorn's
  # reverse walk then runs PAST a caller's real address and returns the
  # leftmost X-Forwarded-For entry, which the caller supplied -- the same spoof
  # as TRUSTED_PROXY_IPS="*", reached by being generous.
  #
  # 10.128.0.0/14 is the OpenShift SDN/OVN-Kubernetes default cluster network.
  # A value that is too NARROW costs the real client IP (the original H2); one
  # that is too WIDE lets a caller forge it. Prefer the narrow mistake.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        TRUSTED_PROXY_IPS: "10.128.0.0/14"
    target:
      kind: ConfigMap
      name: testlookup-config

  # ── Remove the base nginx Ingress — OpenShift uses Routes ─────────────────
  - path: remove-ingress.yaml

  # ── Re-point the base Ollama PVC at the cluster's storage class ───────────
  # The 6 infra PVCs (postgres/mongo/redis/minio/chromadb + Ollama)
  # carry STORAGE_CLASS_PLACEHOLDER directly in their local manifests. The
  # Ollama PVC comes from ../../base (hardcoded ``standard``), so it needs an
  # explicit re-point here. The deploy script substitutes the placeholder in
  # both places. OpenShift clusters use a CSI class — gp3-csi /
  # ocs-storagecluster-ceph-rbd / thin-csi / etc.
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: STORAGE_CLASS_PLACEHOLDER
    target:
      kind: PersistentVolumeClaim
      name: ollama-models-pvc

  # The backups PVC (components/backup) has no class of its own either.
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: STORAGE_CLASS_PLACEHOLDER
    target:
      kind: PersistentVolumeClaim
      name: testlookup-backups

  # ── Frontend nginx: serve the pre-rendered server block ───────────────────
  # The frontend image runs nginx as uid 101 on port 8080 with a read-only
  # root filesystem (k8s/base/frontend-deployment.yaml), so this overlay no
  # longer makes it root and it needs no ``anyuid`` SCC. Only two things
  # differ from the base: the base's ``nginx-conf-d`` volume (mounted at
  # /etc/nginx/conf.d) is the ConfigMap with the rendered server block instead
  # of an emptyDir, and the command skips the image entrypoint, whose envsubst
  # would try to render the template into that read-only directory.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                command: [nginx, "-g", "daemon off;"]
            volumes:
              - name: nginx-conf-d
                emptyDir: null
                configMap:
                  name: frontend-nginx-conf
    target:
      kind: Deployment
      name: testlookup-frontend

  # ── Security context constraints: who runs under which SCC ────────────────
  # The stock third-party images start as root or with their own UID, which
  # only the ``anyuid`` SCC admits. The deploy script grants ``anyuid`` to ONE
  # ServiceAccount, testlookup-anyuid (serviceaccount-anyuid.yaml), and the
  # five bundled data stores (infra-*.yaml) plus Ollama (here) use it. Every
  # other pod states a non-zero UID and runs under ``nonroot-v2``, granted to
  # testlookup-sa and to ``default`` (frontend, MCP, backup jobs and the
  # migration Job, which names no account). Pinned by
  # backend/tests/regression/test_openshift_anyuid_is_scoped_to_the_data_stores.py.
  - patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: testlookup-anyuid
    target:
      kind: Deployment
      name: testlookup-ollama

  # The API and worker pods pull through their own account: the deploy
  # script (``artifactory-pull``) and the offline-bundle procedure
  # (``local-registry``) link their pull secret to ``default`` only. A name
  # that does not exist in the namespace only logs a warning event.
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: testlookup-sa
      imagePullSecrets:
        - name: artifactory-pull
        - name: local-registry
    target:
      kind: ServiceAccount
      name: testlookup-sa

  # ── Redis password: every client reads its URLs from the Secret ───────────
  # The bundled Valkey (infra-redis.yaml) starts with --requirepass. The base
  # ConfigMap keeps the password-less URLs (the cloud overlays use them); here
  # an `env` entry from testlookup-secrets wins over the ConfigMap's `envFrom`
  # value. The deploy script generates the password and writes these three
  # keys (ensure_redis_credentials in deploy-openshift-artifactory.sh). The
  # keys are optional for the same reason as in infra-redis.yaml: a Secret
  # without them (an offline-bundle install not yet upgraded) keeps the
  # ConfigMap's URLs, which match a Valkey that has no password either. One
  # patch per container name: the API, the five workers, beat.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis-clients
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: REDIS_URL
                        optional: true
                  - name: CELERY_BROKER_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_BROKER_URL
                        optional: true
                  - name: CELERY_RESULT_BACKEND
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_RESULT_BACKEND
                        optional: true
    target:
      kind: Deployment
      name: testlookup-backend
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis-clients
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: REDIS_URL
                        optional: true
                  - name: CELERY_BROKER_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_BROKER_URL
                        optional: true
                  - name: CELERY_RESULT_BACKEND
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_RESULT_BACKEND
                        optional: true
    target:
      kind: Deployment
      name: testlookup-worker-.*
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis-clients
      spec:
        template:
          spec:
            containers:
              - name: beat
                env:
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: REDIS_URL
                        optional: true
                  - name: CELERY_BROKER_URL
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_BROKER_URL
                        optional: true
                  - name: CELERY_RESULT_BACKEND
                    valueFrom:
                      secretKeyRef:
                        name: testlookup-secrets
                        key: CELERY_RESULT_BACKEND
                        optional: true
    target:
      kind: Deployment
      name: testlookup-beat

  # ── Beat: write its schedule under /tmp (writable by the assigned uid) ────
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - celery
          - -A
          - app.worker.celery_app
          - beat
          - --loglevel=info
          - -s
          - /tmp/celerybeat-schedule
    target:
      kind: Deployment
      name: testlookup-beat

  # ── Cap HPAs so a fresh air-gapped cluster doesn't scale past its node
  #    budget before the operator has tuned it. Raise in your own overlay. ──
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler

  - patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 1
    target:
      kind: HorizontalPodAutoscaler
      name: testlookup-mcp-hpa

  # ── Environment: HTTPS public URLs + offline AI gate ──────────────────────
  # ROUTE_HOST_FRONTEND_PLACEHOLDER is substituted by the deploy script. The
  # backend honours AI_OFFLINE_MODE=true so it never reaches for a hosted LLM
  # (air-gapped — only the in-cluster Ollama is available). MINIO_USE_SSL stays
  # false: MinIO traffic is cluster-internal (testlookup-minio:9000), TLS is
  # terminated at the Route for external traffic only.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: testlookup-config
      data:
        APP_ENV: "production"
        LOG_LEVEL: "INFO"
        AI_OFFLINE_MODE: "true"
        STORAGE_BACKEND: "minio"
        ANALYSIS_MODE: "auto"
        DEEP_INVESTIGATION_ENABLED: "true"
        DEV_AUTO_LOGIN_ENABLED: "false"
        CORS_ORIGINS: "https://ROUTE_HOST_FRONTEND_PLACEHOLDER"
        PUBLIC_BASE_URL: "https://ROUTE_HOST_FRONTEND_PLACEHOLDER"
    target:
      kind: ConfigMap
      name: testlookup-config

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: testlookup-mcp
      spec:
        template:
          spec:
            containers:
              - name: mcp
                env:
                  - name: TESTLOOKUP_MCP_ALLOWED_HOSTS
                    value: "ROUTE_HOST_MCP_PLACEHOLDER"
    target:
      kind: Deployment
      name: testlookup-mcp

images:
  # ── App images (built locally, pushed to Artifactory) ─────────────────────
  # ARTIFACTORY_REGISTRY_PLACEHOLDER = the single registry base, e.g.
  #   artifactory.example.com/testlookup-docker
  # APP_TAG_PLACEHOLDER = the immutable build tag (build-YYYYMMDD-HHMMSS).
  - name: ghcr.io/test-intelligence/testlookup/backend
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/testlookup/backend
    newTag: APP_TAG_PLACEHOLDER
  - name: ghcr.io/test-intelligence/testlookup/frontend
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/testlookup/frontend
    newTag: APP_TAG_PLACEHOLDER
  - name: ghcr.io/test-intelligence/testlookup/mcp
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/testlookup/mcp
    newTag: APP_TAG_PLACEHOLDER

  # ── Third-party infra images (mirrored into the SAME Artifactory) ─────────
  # Tags are pinned to the exact versions the reference K3s install/base manifests use, so a
  # ``docker pull <upstream>; docker tag …; docker push <artifactory>`` mirror
  # round (see deploy script / mirror-images.sh) lands them at these paths.
  - name: postgres
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/postgres
    newTag: 16-alpine
  - name: valkey/valkey
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/valkey/valkey
    newTag: 8.1-alpine
  # MongoDB (SSPL-1.0) is an external prerequisite: it is not in the offline
  # bundle; mirror-images.sh / the deploy script copy it from upstream.
  - name: mongo
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/mongo
    newTag: "7"
  - name: ghcr.io/versity/versitygw
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/ghcr.io/versity/versitygw
    newTag: v1.8.0
  - name: chromadb/chroma
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/chromadb/chroma
    newTag: 1.5.9
  - name: ollama/ollama
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/ollama/ollama
    newTag: 0.40.10
  - name: busybox
    newName: ARTIFACTORY_REGISTRY_PLACEHOLDER/busybox
    newTag: "1.36"
