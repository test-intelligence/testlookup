# Valkey 8.1 (BSD-3-Clause, protocol-compatible with Redis) — durable broker
# and live-evidence store for air-gapped OpenShift, under the original
# testlookup-redis names. Valkey cannot load a Redis 7.4 AOF/RDB: see
# UPGRADING.md before replacing a running Redis.
#
# The live evidence Streams and Celery broker state are accepted work, not a
# disposable cache. AOF plus a PVC survives pod replacement; volatile-lru
# protects TTL-less evidence/broker keys while still allowing bounded caches
# with TTLs to be evicted under pressure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-redis
  namespace: testlookup
  labels:
    app: testlookup-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-redis
  template:
    metadata:
      labels:
        app: testlookup-redis
    spec:
      # No Kubernetes API calls here, so no service-account token in the pod
      # (OSS review 2026-11-12, L-8).
      automountServiceAccountToken: false
      # The stock image starts with its own UID: the only account with the
      # anyuid SCC (serviceaccount-anyuid.yaml).
      serviceAccountName: testlookup-anyuid
      containers:
        - name: redis
          image: valkey/valkey:8.1-alpine
          # Clients must authenticate when testlookup-secrets holds
          # REDIS_PASSWORD: Valkey then starts with --requirepass. The deploy
          # script (openshiftsetup/deploy-openshift-artifactory.sh) always
          # generates the key, together with the three URLs that carry it.
          #
          # The key is optional because the offline bundle renders this same
          # overlay for installs whose Secret was made by hand
          # (user-guide/air-gapped-install.md): without the key Valkey starts
          # exactly as it did before, instead of not starting at all. Such an
          # install is protected by its NetworkPolicy only until the four
          # keys are added to its Secret.
          #
          # `exec` keeps valkey-server as PID 1, so it still gets the stop signal.
          command:
            - sh
            - -c
            - >-
              exec valkey-server
              --appendonly yes
              --appendfsync everysec
              --maxmemory 512mb
              --maxmemory-policy volatile-lru
              ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: REDIS_PASSWORD
                  optional: true
            # valkey-cli reads this, so `oc exec ... valkey-cli` signs in
            # without a flag.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: testlookup-secrets
                  key: REDIS_PASSWORD
                  optional: true
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # The probes sign in and require the PONG: a bare `valkey-cli ping`
          # gets a "NOAUTH" error reply, and a probe that only looks at the
          # exit status could report a server nobody can use as healthy.
          readinessProbe:
            exec:
              command: ["sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then valkey-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping; else valkey-cli ping; fi | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then valkey-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping; else valkey-cli ping; fi | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: STORAGE_CLASS_PLACEHOLDER
  resources:
    requests:
      storage: 5Gi
