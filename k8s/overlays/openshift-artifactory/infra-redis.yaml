# Redis 7 — durable broker and live-evidence store for air-gapped OpenShift.
#
# The live evidence Streams and Celery broker state are accepted work, not a
# disposable cache. AOF plus a PVC survives pod replacement; volatile-lru
# protects TTL-less evidence/broker keys while still allowing bounded caches
# with TTLs to be evicted under pressure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlookup-redis
  namespace: testlookup
  labels:
    app: testlookup-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testlookup-redis
  template:
    metadata:
      labels:
        app: testlookup-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: testlookup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: STORAGE_CLASS_PLACEHOLDER
  resources:
    requests:
      storage: 5Gi
