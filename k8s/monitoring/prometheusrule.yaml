# GENERATED by scripts/render_prometheusrule.py from
# infra/monitoring/prometheus-rules/testlookup-alerts.yml. Do not edit by
# hand: edit the source and re-run the script.
#
# Needs the Prometheus Operator CRDs (monitoring.coreos.com/v1). Your
# Prometheus must select this rule: kube-prometheus-stack's default
# ruleSelector matches the label `release: <helm release name>`; add it
# with a kustomize patch, or set ruleSelectorNilUsesHelmValues=false.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: testlookup-alerts
  namespace: testlookup
  labels:
    app.kubernetes.io/name: testlookup
    app.kubernetes.io/part-of: testlookup
    role: alert-rules
spec:
  groups:
  - name: testlookup.telemetry
    interval: 30s
    rules:
    - alert: TestLookupTelemetryContractMissing
      expr: absent(testlookup:telemetry_expected_role)
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: The required telemetry inventory is not loaded
        description: 'No expected-role recording rules are evaluating. Load the inventory for this monitoring profile and verify its selection independently of the application PodMonitors. Missing inventory makes role-loss detection incomplete. Runbook: docs/operations/telemetry-contract.md.'
    - alert: TestLookupExpectedRoleUnavailable
      expr: '(testlookup:telemetry_expected_role == 1)

        unless on (cluster, namespace, job, telemetry_profile, telemetry_role)

        (up == 1)

        '
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: A required TestLookup telemetry role has no healthy target
        description: 'Profile {{ $labels.telemetry_profile }} role {{ $labels.telemetry_role }} has no healthy {{ $labels.job }} scrape target for five minutes. Check discovery, monitor selectors, port, scrape credentials and network policy; an entirely deleted monitor also triggers this alert. Runbook: docs/operations/telemetry-contract.md.'
    - record: testlookup:telemetry_required_collector
      expr: 'label_replace(up{job="testlookup-backend"} == 1, "collector", "queues", "job", ".*")

        or label_replace(up{job="testlookup-backend"} == 1, "collector", "agents", "job", ".*")

        or label_replace(up{job="testlookup-backend"} == 1, "collector", "downstream", "job", ".*")

        or label_replace(up{job="testlookup-backend"} == 1, "collector", "redis", "job", ".*")

        '
    - alert: TestLookupRequiredTelemetryMissing
      expr: "label_replace(\n  testlookup:telemetry_required_collector\n  unless on (cluster, namespace, job, instance, telemetry_profile, telemetry_role, collector)\n  testlookup_metric_collection_success,\n  \"signal\", \"collection_success\", \"job\", \".*\"\n)\nor\nlabel_replace(\n  testlookup:telemetry_required_collector\n  unless on (cluster, namespace, job, instance, telemetry_profile, telemetry_role, collector)\n  testlookup_metric_collection_last_success_timestamp_seconds,\n  \"signal\", \"collection_last_success\", \"job\", \".*\"\n)\nor\nlabel_replace(\n  (up{job=~\"testlookup-backend|testlookup-worker\"} == 1)\n  unless on (cluster, namespace, job, instance, telemetry_profile, telemetry_role)\n  testlookup_finalize_step_failures_total{step=\"suite_sync\"},\n  \"signal\", \"metric_registry\", \"job\", \".*\"\n)\n"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: A healthy scrape is missing required application telemetry
        description: 'Target {{ $labels.instance }} is up but required signal {{ $labels.signal }} (collector {{ $labels.collector }}) is absent. Check exporter initialization and metric relabel/drop filters. Zero is valid; lazy task histograms and optional collectors are deliberately excluded. Runbook: docs/operations/telemetry-contract.md.'
    - alert: TestLookupWatchdog
      expr: vector(1)
      labels:
        severity: none
        category: watchdog
      annotations:
        summary: TestLookup notification heartbeat
        description: 'Always firing. Route to an independently hosted authenticated dead-man receiver that alarms on missing heartbeats; do not page on normal receipt. Runbook: docs/operations/alert-routing.md.'
    - alert: TestLookupAlertmanagerDown
      expr: up{job="alertmanager"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: The configured Alertmanager scrape is failing
        description: Alert delivery may be unavailable. Check Alertmanager health and its scrape path, then use the independent heartbeat receiver to confirm notification-path recovery.
    - alert: TestLookupAlertmanagerNotificationsFailing
      expr: increase(alertmanager_notifications_failed_total{job="alertmanager"}[5m]) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: Alertmanager failed to deliver notifications
        description: A configured receiver has failed notification attempts in the last five minutes. Inspect receiver authorization, connectivity and rate limits; verify delivery through the independent receiver.
    - alert: TestLookupAlertmanagerConfigReloadFailed
      expr: alertmanager_config_last_reload_successful{job="alertmanager"} == 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: Alertmanager rejected its latest configuration reload
        description: The intended routing configuration is not active. Validate the configuration and confirm a successful reload before relying on new receiver routes.
  - name: testlookup.application
    interval: 30s
    rules:
    - alert: TestLookupBackendDown
      expr: up{job="testlookup-backend"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: TestLookup backend is down
        description: The FastAPI backend has been unreachable for more than 1 minute.
    - alert: TestLookupOperationalCollectionStale
      expr: 'testlookup_metric_collection_success == 0

        or

        (time() - testlookup_metric_collection_last_success_timestamp_seconds) > 120

        '
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: Operational metric collection failed or is stale
        description: Collector {{ $labels.collector }} cannot provide a fresh snapshot on this target. Scrape availability alone does not prove dependency health; inspect metric_collection_failed logs before trusting the retained gauges.
    - alert: TestLookupDownstreamOutboxFailed
      expr: "max by (cluster, namespace, operation) (\n  testlookup_downstream_outbox_entries{status=\"failed\"}\n  and on (cluster, namespace, job, instance)\n  (testlookup_metric_collection_success{collector=\"downstream\"} == 1)\n  and on (cluster, namespace, job, instance)\n  ((time() - testlookup_metric_collection_last_success_timestamp_seconds{collector=\"downstream\"}) <= 120)\n) > 0\n"
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: Durable downstream work exhausted retries
        description: Operation {{ $labels.operation }} has {{ $value }} terminal failed outbox rows. Empty broker queues and Celery SUCCESS do not imply business completion. Inspect durable outbox outcomes and use the authorized replay process after fixing the cause.
    - alert: TestLookupDownstreamOutboxOverdue
      expr: "max by (cluster, namespace, operation) (\n  testlookup_downstream_outbox_overdue_seconds{status=~\"waiting|pending|sending|published|processing\"}\n  and on (cluster, namespace, job, instance)\n  (testlookup_metric_collection_success{collector=\"downstream\"} == 1)\n  and on (cluster, namespace, job, instance)\n  ((time() - testlookup_metric_collection_last_success_timestamp_seconds{collector=\"downstream\"}) <= 120)\n) > 300\n"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Durable downstream work missed its retry or lease deadline
        description: Operation {{ $labels.operation }} is {{ $value }} seconds beyond its stored retry or execution lease deadline. The rule includes a five-minute margin and does not treat scheduled future retries as stuck. Inspect relay and worker health.
    - alert: TestLookupHighErrorRate
      expr: 'sum(rate(http_requests_total{job="testlookup-backend", status=~"5.."}[5m]))

        /

        sum(rate(http_requests_total{job="testlookup-backend"}[5m])) > 0.05

        '
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: High HTTP 5xx error rate
        description: More than 5% of HTTP requests are returning 5xx status codes.
    - alert: TestLookupSlowRequests
      expr: "histogram_quantile(0.95,\n  sum(rate(http_request_duration_seconds_bucket{job=\"testlookup-backend\"}[5m]))\n  by (le)\n) > 5\n"
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: 95th-percentile HTTP latency > 5s
        description: p95 response time has exceeded 5 seconds for 3 minutes.
    - alert: TestLookupAIPipelineFailures
      expr: 'sum(increase(testlookup_analyses_total{status="failure"}[10m])) > 5

        '
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: AI pipeline experiencing repeated failures
        description: More than 5 AI analysis pipeline failures in the last 10 minutes.
    - alert: TestLookupLLMCircuitBreakerOpen
      expr: increase(testlookup_llm_circuit_breaker_trips_total[5m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: LLM circuit breaker tripped
        description: The LLM circuit breaker has opened. AI analysis may be degraded.
    - alert: TestLookupCeleryWorkerDown
      expr: up{job="testlookup-worker"} == 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: Celery worker is unreachable
        description: Background task processing may be degraded.
    - alert: TestLookupTooManyActivePipelines
      expr: sum(testlookup_active_pipeline_runs) > 20
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Abnormally high number of active pipeline runs
        description: More than 20 pipeline runs are simultaneously active — possible stuck pipelines.
    - alert: TestLookupAgentPipelineOverdue
      expr: testlookup_agent_in_progress_overdue_seconds > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Agent pipeline exceeded its deadline and grace period
        description: The oldest in-progress agent run is {{ $value }} seconds beyond its configured deadline plus grace. Check worker leases and retry scheduling.
    - alert: TestLookupAgentDLQNotEmpty
      expr: testlookup_agent_dlq_depth > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: A TestLookup dead-letter store is not empty
        description: At least one exhausted task or live event awaits inspection at /api/v1/admin/dlq.
    - alert: TestLookupPendingReviewStale
      expr: testlookup_pending_review_oldest_age_seconds > 86400
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: An AI report has awaited review for more than 24 hours
        description: The oldest pending agent review is over 24 hours old. Check the review queue and reviewer coverage.
    - alert: TestLookupFinalizeStepFailing
      expr: 'sum by (step) (increase(testlookup_finalize_step_failures_total[30m])) > 0

        '
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Post-ingestion step {{ $labels.step }} is failing
        description: The {{ $labels.step }} finalize step failed at least once in the last 30 minutes. Runs still ingest, but whatever that step maintains may have stopped updating.
    - alert: TestLookupLiveEventArchiveFailing
      expr: 'sum(increase(testlookup_live_event_archive_failures_total[15m])) > 10

        '
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: Live events are not being written to the audit trail
        description: More than 10 live events in 15 minutes could not be archived to Mongo. Runs still ingest, but the operational audit trail has a gap for that window.
  - name: testlookup.infrastructure
    interval: 30s
    rules:
    - alert: TestLookupDBPoolExhausted
      expr: 'sqlalchemy_pool_utilization_ratio{job=~"testlookup-backend|testlookup-worker"} > 0.9

        '
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: A database connection pool is > 90% utilized
        description: At least one {{ $labels.role }} process has used over 90% of its PostgreSQL pool capacity, including configured overflow. Investigate held connections and slow transactions; check the fleet connection budget before increasing pool limits.
    - alert: TestLookupRedisMemoryHigh
      expr: "max by (cluster, namespace, store_role) (\n  (\n    testlookup_redis_memory_counted_for_evict_bytes{job=\"testlookup-backend\"}\n    / redis_memory_max_bytes{job=\"testlookup-backend\"}\n  )\n  and on (cluster, namespace, job, instance, store_role)\n    (redis_memory_max_bytes{job=\"testlookup-backend\"} > 0)\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{job=\"testlookup-backend\",collector=\"redis\"} == 1)\n  and on (cluster, namespace, job, instance)\n    ((time() - testlookup_metric_collection_last_success_timestamp_seconds{job=\"testlookup-backend\",collector=\"redis\"}) <= 120)\n) > 0.85\n"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Redis memory usage > 85%
        description: Configured {{ $labels.store_role }} Redis/Valkey memory counted for eviction exceeds 85% of maxmemory. Inspect capacity and key eviction policy; application and broker roles may share one physical server.
    - alert: TestLookupRedisMemoryLimitMissing
      expr: "max by (cluster, namespace, store_role) (\n  redis_memory_max_bytes{job=\"testlookup-backend\"}\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{job=\"testlookup-backend\",collector=\"redis\"} == 1)\n  and on (cluster, namespace, job, instance)\n    ((time() - testlookup_metric_collection_last_success_timestamp_seconds{job=\"testlookup-backend\",collector=\"redis\"}) <= 120)\n) == 0\n"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Redis has no configured dataset memory limit
        description: Configured {{ $labels.store_role }} Redis/Valkey reports maxmemory=0. Percentage saturation is undefined; define a supported capacity policy with headroom for process/container overhead or an explicit managed-service exception.
    - record: testlookup:celery_queue_pending
      expr: "max by (cluster, namespace, telemetry_profile, queue_name) (\n  celery_queue_length{job=\"testlookup-backend\"}\n  and on (cluster, namespace, telemetry_profile, job, instance, queue_name)\n    (testlookup_celery_queue_depth_observed_timestamp_seconds{job=\"testlookup-backend\"} > 0)\n  and on (cluster, namespace, telemetry_profile, job, instance, queue_name)\n    ((time() - testlookup_celery_queue_depth_observed_timestamp_seconds{job=\"testlookup-backend\"}) <= 60)\n  and on (cluster, namespace, telemetry_profile, job, instance, queue_name)\n    ((time() - testlookup_celery_queue_depth_observed_timestamp_seconds{job=\"testlookup-backend\"}) >= 0)\n  and on (cluster, namespace, telemetry_profile, job, instance)\n    (up{job=\"testlookup-backend\"} == 1)\n)\n"
    - alert: TestLookupCeleryQueueBacklog
      expr: testlookup:celery_queue_pending > 100
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Celery queue backlog > 100 tasks
        description: Queue {{ $labels.queue_name }} has more than 100 broker-pending tasks. Check consumer health, progress and capacity. Runbook at docs/operations/celery-queue-monitoring.md.
    - alert: TestLookupChildQueueNoHealthyTarget
      expr: "(\n  (testlookup:celery_queue_pending{queue_name=\"agent_children\"} > 0)\n  and on (cluster, namespace, telemetry_profile)\n    (testlookup:telemetry_expected_role{job=\"testlookup-worker\",telemetry_role=\"worker-children\"} == 1)\n)\nunless on (cluster, namespace, telemetry_profile)\n  (up{job=\"testlookup-worker\",telemetry_role=\"worker-children\"} == 1)\n"
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: Child tasks are pending and their worker targets are unavailable
        description: The broker has child tasks pending and the declared worker-children role has no healthy scrape target. Check the worker deployment and its monitoring path. Runbook at docs/operations/celery-queue-monitoring.md.
    - record: testlookup:celery_child_worker_progress_3m
      expr: "(\n  sum by (cluster, namespace, telemetry_profile) (\n    increase(celery_task_queue_wait_seconds_count{job=\"testlookup-worker\",telemetry_role=\"worker-children\",queue_name=\"agent_children\"}[3m])\n  ) > 0\n)\nor\n(\n  sum by (cluster, namespace, telemetry_profile) (\n    increase(celery_task_queue_wait_unavailable_total{job=\"testlookup-worker\",telemetry_role=\"worker-children\",queue_name=\"agent_children\"}[3m])\n  ) > 0\n)\nor\n(\n  sum by (cluster, namespace, telemetry_profile) (\n    increase(celery_task_runtime_seconds_count{job=\"testlookup-worker\",telemetry_role=\"worker-children\",queue_name=\"agent_children\"}[3m])\n  ) > 0\n)\n"
    - alert: TestLookupChildQueueNoProgress
      expr: "(\n  (testlookup:celery_queue_pending{queue_name=\"agent_children\"} > 0)\n  and on (cluster, namespace, telemetry_profile)\n    (testlookup:telemetry_expected_role{job=\"testlookup-worker\",telemetry_role=\"worker-children\"} == 1)\n  and on (cluster, namespace, telemetry_profile)\n    (up{job=\"testlookup-worker\",telemetry_role=\"worker-children\"} == 1)\n)\nunless on (cluster, namespace, telemetry_profile)\n  (testlookup:celery_child_worker_progress_3m > 0)\n"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Pending child tasks have no recent worker progress
        description: The child queue kept a broker backlog while a worker-children target was scrapeable. Recent starts and completed attempts were absent. Check routing, broker connectivity and worker capacity. Runbook at docs/operations/celery-queue-monitoring.md.
    - alert: TestLookupTaskLatencyHigh
      expr: "histogram_quantile(0.99,\n  sum(rate(celery_task_runtime_seconds_bucket[10m]))\n  by (le, task_name)\n) > 120\n"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Celery task P99 latency > 120s
        description: Task {{ $labels.task_name }} p99 execution time exceeds 2 minutes.
    - alert: TestLookupDiskSpaceLow
      expr: '(node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10

        '
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Disk space < 10% remaining
        description: Root filesystem has less than 10% free space. Data loss risk.
    - alert: TestLookupOOMKillDetected
      expr: increase(node_vmstat_oom_kill[5m]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: OOM kill detected on host
        description: The kernel OOM killer terminated a process. Check container resource limits.
  - name: testlookup.slo
    interval: 30s
    rules:
    - alert: TestLookupSLOProjectListSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/projects\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.2\n"
      for: 5m
      labels:
        severity: warning
        slo: project_list
      annotations:
        summary: Project list p95 > 200ms
        description: GET /api/v1/projects p95 has been over the 200ms budget for 5 minutes. Check pg pool saturation and the get_accessible_project_ids cache.
    - alert: TestLookupSLORunListSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/runs\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.25\n"
      for: 5m
      labels:
        severity: warning
        slo: run_list
      annotations:
        summary: Run list p95 > 250ms
        description: GET /api/v1/runs p95 has been over budget for 5 minutes. Pre-load-test wave the same query took 735ms p95 under concurrency — if this fires, check whether the LEFT JOIN optimization in list_project_runs got reverted or whether the pg_trgm/composite indexes are missing.
    - alert: TestLookupSLORunDetailSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/runs/{run_id}\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.25\n"
      for: 5m
      labels:
        severity: warning
        slo: run_scoped_guard
      annotations:
        summary: Run detail p95 > 250ms
        description: GET /api/v1/runs/{run_id} p95 has been over the 250ms budget for 5 minutes. Includes require_run_access guard overhead — if elevated, investigate ProjectMember query latency.
    - alert: TestLookupSLORunIntelligenceSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/runs/{run_id}/intelligence\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.8\n"
      for: 5m
      labels:
        severity: warning
        slo: run_intelligence
      annotations:
        summary: Run intelligence p95 > 800ms
        description: 'GET /api/v1/runs/{run_id}/intelligence p95 has been over the 800ms budget for 5 minutes. Likely a cache invalidation churn or a slow defect-candidate cache populate (item #4).'
    - alert: TestLookupSLOSearchSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/search\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.3\n"
      for: 5m
      labels:
        severity: warning
        slo: keyword_search
      annotations:
        summary: Search p95 > 300ms
        description: GET /api/v1/search p95 has been over budget for 5 minutes. Check the pg_trgm GIN indexes (ix_test_cases_name_trgm, suite_trgm, error_trgm) and the project-scoped fingerprint join in search_service.py.
    - alert: TestLookupSLOFlakyCoachSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/projects/{project_id}/flaky-coach\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.6\n"
      for: 5m
      labels:
        severity: warning
        slo: flaky_coach
      annotations:
        summary: Flaky coach p95 > 600ms
        description: GET /api/v1/projects/{project_id}/flaky-coach p95 has been over the 600ms budget for 5 minutes. The dedicated-write-session cache populate may be running on every request — check the FlakyCoachResult cache.
    - alert: TestLookupSLOHealthDetailsSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/health/details\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 2.5\n"
      for: 5m
      labels:
        severity: warning
        slo: health_details
      annotations:
        summary: /health/details p95 > 2.5s
        description: Each non-critical probe is supposed to be capped at 1.5s via httpx.Timeout. If this alert fires, either the probe budget regressed or pg/mongo/redis (which are not budget-wrapped) are themselves slow.
    - alert: TestLookupSLOChartDataSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/analytics/chart-data\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 1.5\n"
      for: 5m
      labels:
        severity: warning
        slo: chart_data
      annotations:
        summary: Chart data p95 > 1.5s
        description: GET /api/v1/analytics/chart-data p95 has been over the 1.5s budget for 5 minutes. Check the Analytics & charts dashboard row (cache hit ratio, miss p95 by route, timeouts & errors) and pg pool saturation — under load, reads start queueing past ~4 concurrent cold 90-day readers per pod.
    - alert: TestLookupSLOAnalyticsHeatmapSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/analytics/heatmap\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.8\n"
      for: 5m
      labels:
        severity: warning
        slo: analytics_heatmap
      annotations:
        summary: Analytics heatmap p95 > 800ms
        description: GET /api/v1/analytics/heatmap p95 has been over the 800ms budget for 5 minutes. suite_day and suite_release over 90 days are the heavy kinds; check the analytics cache hit ratio and miss p95 by route, and pg pool saturation.
    - alert: TestLookupSLOChartRowsSlow
      expr: "histogram_quantile(0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{\n      job=\"testlookup-backend\",\n      handler=\"/api/v1/analytics/chart-data/rows\",\n      method=\"GET\"\n    }[5m])\n  )\n) > 0.3\n"
      for: 5m
      labels:
        severity: warning
        slo: chart_rows
      annotations:
        summary: Chart rows p95 > 300ms
        description: GET /api/v1/analytics/chart-data/rows p95 has been over the 300ms budget for 5 minutes. A single-user page-1 read measures ~10ms server-side, so a sustained breach is queueing behind heavy chart reads or a lost index on the rows query.
  - name: testlookup.tier_0_2
    interval: 30s
    rules:
    - alert: TestLookupWebhookDeliveryFailureRate
      expr: "(\n  sum by (cluster, namespace) (rate(testlookup_webhook_delivery_attempts_total{result=\"failure\"}[15m]))\n  /\n  sum by (cluster, namespace) (rate(testlookup_webhook_delivery_attempts_total[15m]))\n) > 0.05\nand on (cluster, namespace)\nsum by (cluster, namespace) (rate(testlookup_webhook_delivery_attempts_total[15m])) > 0\n"
      for: 15m
      labels:
        severity: warning
        tier: 2-6
        feature: outbound_webhooks
      annotations:
        summary: Outbound webhook delivery failure rate > 5% for 15 min
        description: More than 5% of webhook delivery attempts are terminal failures over the last 15 minutes. Check the Webhook Deliveries panel in /settings/webhooks for the DLQ rows and the most recent error text, and consider quarantining the offending subscription until the receiver is fixed.
    - alert: TestLookupFlakyQuarantineMaintenanceFailing
      expr: "max by (cluster, namespace, schedule) (\n  testlookup_nightly_job_overdue{job=\"testlookup-backend\",schedule=\"quarantine_maintenance\"}\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{job=\"testlookup-backend\",collector=\"nightly\"} == 1)\n  and on (cluster, namespace, job, instance)\n    ((time() - testlookup_metric_collection_last_success_timestamp_seconds{job=\"testlookup-backend\",collector=\"nightly\"}) <= 120)\n) == 1\n"
      for: 5m
      labels:
        severity: warning
        tier: 1-3
        feature: flaky_auto_quarantine
      annotations:
        summary: Flaky quarantine maintenance missed its completion deadline
        description: The enabled nightly quarantine slot has no durable success after its one-hour completion margin. Compare the schedule's last attempt and success to distinguish missing dispatch from incomplete work, then inspect worker and Beat health.
    - alert: TestLookupWeeklyDigestDeliveryOverdue
      expr: "max by (cluster, namespace, schedule) (\n  testlookup_weekly_digest_oldest_overdue_seconds{job=\"testlookup-backend\"}\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{job=\"testlookup-backend\",collector=\"digests\"} == 1)\n  and on (cluster, namespace, job, instance)\n    ((time() - testlookup_metric_collection_last_success_timestamp_seconds{job=\"testlookup-backend\",collector=\"digests\"}) <= 120)\n) > 0\n"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Weekly digest delivery has overdue work
        description: An enabled {{ $labels.schedule }} subscription has an unresolved due slot beyond the normal daily dispatch interval and processing grace. Content generation is not provider delivery. Inspect durable attempt outcomes and provider logs before replaying any ambiguous send.
    - alert: TestLookupWeeklyDigestScheduleMissing
      expr: "max by (cluster, namespace, schedule) (\n  testlookup_weekly_digest_subscriptions{job=\"testlookup-backend\",state=\"missing_schedule\"}\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{job=\"testlookup-backend\",collector=\"digests\"} == 1)\n  and on (cluster, namespace, job, instance)\n    ((time() - testlookup_metric_collection_last_success_timestamp_seconds{job=\"testlookup-backend\",collector=\"digests\"}) <= 120)\n) > 0\n"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Enabled weekly digest has no due schedule
        description: An enabled {{ $labels.schedule }} subscription has neither a next delivery time nor an unresolved claimed slot. Inspect its durable schedule; absence of a due date is not successful delivery.
    - alert: TestLookupPerfBaselineRefreshFailing
      expr: "max by (cluster, namespace, schedule) (\n  testlookup_nightly_job_overdue{job=\"testlookup-backend\",schedule=\"perf_baseline_refresh\"}\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{job=\"testlookup-backend\",collector=\"nightly\"} == 1)\n  and on (cluster, namespace, job, instance)\n    ((time() - testlookup_metric_collection_last_success_timestamp_seconds{job=\"testlookup-backend\",collector=\"nightly\"}) <= 120)\n) == 1\n"
      for: 5m
      labels:
        severity: warning
        tier: 2-10
        feature: perf_regression_detection
      annotations:
        summary: Performance baseline refresh missed its completion deadline
        description: The enabled nightly baseline refresh has no durable success after its one-hour completion margin. Check the schedule's last attempt and success, Beat dispatch and worker logs. Release gating may use stale baselines.
    - alert: TestLookupCompliancePackGenerationErrors
      expr: "increase(\n  testlookup_compliance_pack_generated_total{result=\"error\"}[1h]\n) > 3\n"
      for: 0m
      labels:
        severity: warning
        tier: 1-4
        feature: release_compliance_pack
      annotations:
        summary: Compliance pack generation errors in the last hour
        description: More than 3 compliance_pack_generated_total{result="error"} increments in the last hour. This is the service's error branch — not the 'release has no linked run' or 'feature disabled' branches. Likely MinIO write failure, a missing policy snapshot, or a collection helper raising. Check structlog for `compliance_pack_generated` events and the worker logs.
  - name: testlookup.backup
    interval: 60s
    rules:
    - alert: TestLookupBackupJobFailed
      expr: "max by (namespace, job_name) (\n  kube_job_status_condition{condition=\"Failed\", status=\"true\"}\n  and on (namespace, job_name)\n  (\n    kube_job_owner{owner_kind=\"CronJob\", owner_name=\"testlookup-backup\"}\n    or kube_job_info{job_name=~\"testlookup-backup-.*\"}\n  )\n) == 1\n"
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: A TestLookup backup Job failed
        description: 'Backup Job {{ $labels.job_name }} failed: no new archive was written. Read `kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }} --all-containers`, fix the cause, then delete the failed Job. Runbook: k8s/components/backup/README.md.'
    - alert: TestLookupBackupStale
      expr: "(time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=\"testlookup-backup\"})) > 26 * 3600\nor\n(max by (namespace, cronjob) (kube_cronjob_created{cronjob=\"testlookup-backup\"}) < time() - 26 * 3600\n  unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{cronjob=\"testlookup-backup\"})\n"
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: No successful TestLookup backup in 26 hours
        description: 'The testlookup-backup CronJob has not completed successfully for more than 26h (failing, suspended, or never run). The newest restorable archive is older than a day. Runbook: k8s/components/backup/README.md.'
  - name: testlookup.pipeline_event_delivery
    interval: 30s
    rules:
    - alert: TestLookupPipelineEventDeliveryFailed
      expr: "max by (cluster, namespace) (\n  testlookup_pipeline_event_outbox_entries{job=\"testlookup-backend\",status=\"failed\"}\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{collector=\"pipeline_events\"} == 1)\n  and on (cluster, namespace, job, instance)\n    (time() - testlookup_metric_collection_last_success_timestamp_seconds{collector=\"pipeline_events\"} < 120)\n) > 0\n"
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Pipeline event delivery requires recovery
        description: Automatic event materialization exhausted retries or found an immutable identity conflict. SQL retains the unresolved evidence; inspect scoped event-log health before explicit delivery requeue. This does not re-execute a pipeline or prove Mongo evidence was lost.
        runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/pipeline-event-delivery.md
    - alert: TestLookupPipelineEventBacklogStale
      expr: "max by (cluster, namespace) (\n  testlookup_pipeline_event_outbox_oldest_age_seconds{job=\"testlookup-backend\",status=~\"pending|sending\"}\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{collector=\"pipeline_events\"} == 1)\n  and on (cluster, namespace, job, instance)\n    (time() - testlookup_metric_collection_last_success_timestamp_seconds{collector=\"pipeline_events\"} < 120)\n) > 300\n"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Pipeline event materialization is falling behind
        description: A durable pending or leased event is older than five minutes. Verify the relay schedule, default-queue consumer, Mongo connectivity and expired leases. Retained intent age is not the age of a missing business operation.
        runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/pipeline-event-delivery.md
    - alert: TestLookupPipelineEventCapacityHigh
      expr: "max by (cluster, namespace) (\n  (sum without (status) (testlookup_pipeline_event_outbox_entries{job=\"testlookup-backend\"})\n    / testlookup_pipeline_event_outbox_capacity{job=\"testlookup-backend\"})\n  and on (cluster, namespace, job, instance)\n    (testlookup_metric_collection_success{collector=\"pipeline_events\"} == 1)\n  and on (cluster, namespace, job, instance)\n    (time() - testlookup_metric_collection_last_success_timestamp_seconds{collector=\"pipeline_events\"} < 120)\n) > 0.85\n"
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Shared pipeline event admission is near its row limit
        description: Retained intents and acknowledged receipts exceed 85% of the installation row limit. Restore relay delivery; only acknowledged receipts may be pressure-pruned. Never delete pending or failed evidence to make room.
        runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/pipeline-event-delivery.md
    - alert: TestLookupPipelineEventAdmissionRefused
      expr: sum by (cluster, namespace, reason) (increase(testlookup_pipeline_event_admission_failures_total[5m])) > 0
      labels:
        severity: critical
      annotations:
        summary: A pipeline event was not durably admitted
        description: At least one source event could not enter the SQL delivery boundary. Accepted backlog recovery cannot reconstruct an event that was never admitted; inspect the bounded reason and source failure handling.
        runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/pipeline-event-delivery.md
