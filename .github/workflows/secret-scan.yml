name: Secret scan

# gitleaks over the commits a pull request or a push to main adds (2026-11-12
# open-source review M-9). GitHub push protection blocks known provider tokens;
# a K3s node token, a Cloudflare tunnel token, a TestLookup qai_ key or a plain
# password went through. Rules: .gitleaks.toml (gitleaks' defaults plus those
# three). scripts/push_check.py runs the same scan before a push.
#
# Its own workflow, not a ci.yml job: ci.yml skips Markdown-only changes, and a
# token pasted into a README or a runbook is exactly what this is for.
#
# Only added lines are scanned, so the fake tokens in existing redaction tests
# do not fire. A new deliberate fake value: make it obviously fake, or end the
# line with a `gitleaks:allow` comment and say why in the PR. A real secret
# that reached a pushed commit is public: rotate it, then remove it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Security — Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan walks the commit range, so it needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified gitleaks 8.30.1
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_ARCHIVE_SHA256  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz

      - name: Scan the added commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_opts="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BASE_SHA" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "$PUSH_BASE_SHA^{commit}" 2>/dev/null; then
            log_opts="$PUSH_BASE_SHA..$GITHUB_SHA"
          else
            # A new branch, or a force push whose old tip is gone: scan the tip.
            log_opts="-1 $GITHUB_SHA"
          fi
          echo "Scanning: git log $log_opts"
          gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="$log_opts" .
