name: Promote verified release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  actions: read
  contents: read

jobs:
  resolve-tag:
    name: Resolve release tag to its commit
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: resolve
        name: Resolve and validate tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          git fetch origin main
          source_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be strict semver" >&2; exit 1; }
          git merge-base --is-ancestor "$source_sha" origin/main || { echo "Release tag must target a commit reachable from origin/main" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$(tr -d '[:space:]' < VERSION)" == "$version" ]] || { echo "Release tag and VERSION must match" >&2; exit 1; }
          printf 'source_sha=%s\nversion=%s\n' "$source_sha" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve-tag
    uses: ./.github/workflows/require-verified-sha.yml
    with:
      source_sha: ${{ needs.resolve-tag.outputs.source_sha }}

  scan-verified-images:
    name: Scan verified release image digests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-tag, verify]
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download and validate the SHA-bound image manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.verify.outputs.ci_run_id }}" --name "${{ needs.verify.outputs.artifact_name }}" --dir verified-images
          python3 scripts/release/release_manifest.py validate --manifest verified-images/release-manifest.json --expected-source-sha "${{ needs.verify.outputs.source_sha }}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install checksum-verified Trivy 0.74.0
        env:
          TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          curl -fsSLo trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "$TRIVY_ARCHIVE_SHA256  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Scan exact release digests and generate SBOM evidence
        run: python3 scripts/release/scan_release_images.py --manifest verified-images/release-manifest.json --output-dir release-security
      - name: Retain release security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-security-${{ needs.resolve-tag.outputs.source_sha }}
          path: release-security/
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Promote verified digest set to release aliases
    runs-on: ubuntu-latest
    needs: [resolve-tag, verify, scan-verified-images]
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download and validate the SHA-bound image manifest
        # Artifact name is verified-images-${{ needs.resolve-tag.outputs.source_sha }}.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.verify.outputs.ci_run_id }}" --name "${{ needs.verify.outputs.artifact_name }}" --dir verified-images
          python3 scripts/release/release_manifest.py validate --manifest verified-images/release-manifest.json --expected-source-sha "${{ needs.verify.outputs.source_sha }}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned crane
        run: |
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo install crane /usr/local/bin/crane
      - name: Promote immutable digests without rebuilding
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          for component in backend frontend mcp; do
            source_ref="$(jq -r ".images.$component.source_ref" verified-images/release-manifest.json)"
            repository="${source_ref%@*}"
            if existing="$(crane digest "$repository:$VERSION" 2>/dev/null)"; then
              [[ "$existing" == "${source_ref##*@}" ]] || { echo "immutable release tag collision for $repository:$VERSION" >&2; exit 1; }
              continue
            fi
            crane tag "$source_ref" "$VERSION"
          done
