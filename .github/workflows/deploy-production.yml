name: Deploy to Production (GKE)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy'
        required: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  GCR_HOSTNAME: gcr.io
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    name: Build & Tag Production Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build & Push Backend (versioned + latest)
        run: |
          docker build -t $GCR_HOSTNAME/$PROJECT_ID/testlookup-backend:$IMAGE_TAG \
                       -t $GCR_HOSTNAME/$PROJECT_ID/testlookup-backend:latest ./backend
          docker push $GCR_HOSTNAME/$PROJECT_ID/testlookup-backend:$IMAGE_TAG
          docker push $GCR_HOSTNAME/$PROJECT_ID/testlookup-backend:latest

      - name: Build & Push Frontend (versioned + latest)
        run: |
          docker build -t $GCR_HOSTNAME/$PROJECT_ID/testlookup-frontend:$IMAGE_TAG \
                       -t $GCR_HOSTNAME/$PROJECT_ID/testlookup-frontend:latest ./frontend
          docker push $GCR_HOSTNAME/$PROJECT_ID/testlookup-frontend:$IMAGE_TAG
          docker push $GCR_HOSTNAME/$PROJECT_ID/testlookup-frontend:latest

  deploy-production:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Update K8s Image Tags
        run: |
          kubectl set image deployment/backend \
            backend=$GCR_HOSTNAME/$PROJECT_ID/testlookup-backend:$IMAGE_TAG -n production
          kubectl set image deployment/frontend \
            frontend=$GCR_HOSTNAME/$PROJECT_ID/testlookup-frontend:$IMAGE_TAG -n production

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/backend -n production --timeout=5m
          kubectl rollout status deployment/frontend -n production --timeout=5m

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed — initiating rollback..."
          kubectl rollout undo deployment/backend -n production
          kubectl rollout undo deployment/frontend -n production
          kubectl rollout status deployment/backend -n production --timeout=3m
          kubectl rollout status deployment/frontend -n production --timeout=3m
          echo "🔁 Rollback complete."

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Production deployment successful! Version: ${{ env.IMAGE_TAG }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Production deployment FAILED for tag ${{ env.IMAGE_TAG }}"
