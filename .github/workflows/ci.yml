name: TestLookup — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual escape hatch. On 2026-08-06 GitHub silently dispatched NO workflow
  # runs for PR #456 — Actions enabled, no queue, other branches running
  # normally, correct triggers, and neither reopening the PR nor pushing a new
  # commit fired anything. Without a manual trigger there is no way to get a
  # branch verified when event delivery fails, and the only alternatives are
  # merging unverified or waiting indefinitely.
  # Dispatch against any ref: gh workflow run ci.yml --ref <branch>
  # (GitHub requires this trigger on the default branch for the workflow to be
  # dispatchable, and the chosen ref must carry it too.)
  workflow_dispatch:

# Default to least-privilege — every job must opt in to any write scope it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 0: Guard against floating image tags in k8s manifests
  # ─────────────────────────────────────────────────────────────
  k8s-image-pin-check:
    name: K8s — Forbid :latest image tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on :latest image tags in k8s/**
        run: |
          set -euo pipefail
          # Match two patterns:
          #   image: foo/bar:latest             (any image: line ending in :latest)
          #   newTag: latest                    (any kustomize override pinning :latest)
          # The BUILD_TAG_PLACEHOLDER literal in homelab/kustomization.yaml is
          # intentional: it's substituted in-place by deploy-homelab.sh and is
          # designed to fail at ImagePull if anyone bypasses the deploy script.
          violations=$(grep -rnE '(image:[[:space:]]*[^[:space:]]+:latest$|^[[:space:]]*newTag:[[:space:]]*latest$)' \
            k8s/ || true)
          if [ -n "$violations" ]; then
            echo "::error::Floating :latest tags found in k8s manifests:"
            echo "$violations"
            echo
            echo "Pin to an exact version, or use the BUILD_TAG mechanism in"
            echo "homelabsetup/deploy-homelab.sh."
            exit 1
          fi
          echo "All k8s image tags pinned. ✓"

      # Same rule, widened to Compose. `docker-compose.dev-lite.yml` shipped
      # minio/minio:latest + minio/mc:latest for a long time because the grep
      # above only ever looked at k8s/ — and an unpinned tag makes an offline
      # bundle unreproducible (whatever was on Docker Hub the day it was built
      # is what the customer runs forever, with no record of which version).
      # Delegated to the Python checker so :latest has ONE implementation;
      # interpolated tags (`:${TESTLOOKUP_VERSION:-latest}`) are a deploy-time
      # choice and are not flagged.
      - name: Fail on :latest / untagged images in compose files
        run: python3 scripts/release/check_image_drift.py --only latest

  # ─────────────────────────────────────────────────────────────
  # JOB 0a2: Container images agree with deploy/images.manifest.txt
  # The offline install bundle (US-13.1, `make offline-bundle`) is
  # built FROM that manifest. If compose / k8s / the OpenShift
  # overlay / the mirror scripts drift from it, the bundle ships
  # without an image the deployment needs and the failure only
  # appears on a customer's air-gapped cluster.
  # Stdlib-only, like the quality-gate job — installs nothing.
  # ─────────────────────────────────────────────────────────────
  image-manifest-drift:
    name: Images — Manifest drift (compose / k8s / air-gap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Every surface matches deploy/images.manifest.txt
        run: python scripts/release/check_image_drift.py

      - name: Install pytest for the guard's own tests
        run: pip install pytest

      - name: Self-test the drift guard
        # Pins that the guard actually FAILS on drift — a guard that can only
        # pass is a guard that silently rots.
        run: python -m pytest scripts/release/test_image_drift.py -v

      - name: Shell syntax check — release scripts
        run: |
          set -euo pipefail
          for f in scripts/release/*.sh openshiftsetup/*.sh; do
            bash -n "$f"
            echo "syntax OK: $f"
          done

  # ─────────────────────────────────────────────────────────────
  # JOB 0b: Cross-cutting invariant guards
  # Runs scripts/quality_gate.py which codifies the rules from
  # CLAUDE.md as a ratchet: existing violations are baselined in
  # scripts/quality-gate-baselines/, only NEW violations fail.
  # No backend / frontend / DB deps required — file IO plus `git
  # check-ignore` / `git ls-files` for the repo.no-gitignored-source
  # guard, both of which work on the default shallow checkout.
  # ─────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gates — Cross-cutting invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Run cross-cutting quality gates
        run: python scripts/quality_gate.py

      - name: Install pytest for the self-test
        # The gate itself is pure stdlib file IO, but scripts/test_quality_gate.py
        # is a pytest module. This job installs nothing else, so pytest must be
        # added explicitly here (the backend test job has its own deps).
        run: pip install pytest

      - name: Self-test the quality-gate script
        # Pins the ratchet semantics so a careless edit to quality_gate.py
        # can't accidentally turn the gate into a no-op.
        run: |
          cd scripts
          python -m pytest test_quality_gate.py -v

  # ─────────────────────────────────────────────────────────────
  # JOB 0c: Validate Mermaid diagrams in markdown
  # Parses every ```mermaid block in tracked *.md with the Mermaid
  # grammar (the same parse GitHub runs before rendering). A broken
  # diagram fails here instead of silently shipping an "Unable to
  # render rich display" box. Node-only, no app deps.
  # ─────────────────────────────────────────────────────────────
  mermaid-check:
    name: Docs — Mermaid diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/mermaid-check/package-lock.json

      - name: Install validator dependencies
        working-directory: ./scripts/mermaid-check
        run: npm ci

      - name: Validate Mermaid diagrams render
        working-directory: ./scripts/mermaid-check
        run: node validate.mjs

  # ─────────────────────────────────────────────────────────────
  # JOB 0d: The guide's diagrams actually DRAW, and are legible
  # mermaid-check above proves the diagrams PARSE. It cannot see how
  # they look: it runs under jsdom, which has no layout engine, so
  # scrollWidth is always 0 and a clipped label is invisible.
  #
  # This renders the real DocsPage in a real browser and compares each
  # label's required width against the box Mermaid drew for it. The
  # defect it exists for shipped once: every label cut off ("Backend
  # AP", "MCP serve") because Mermaid measured labels in the body font
  # while the SVG rendered in the monospace it inherits from <pre>.
  # Every text assertion passed — textContent holds the whole label when
  # it is visually clipped.
  #
  # No backend, no deployment, no credentials: it serves a harness page
  # with `vite dev`, which is why it can run on every push while the
  # equivalent live probe cannot.
  # ─────────────────────────────────────────────────────────────
  docs-diagram-render:
    name: Docs — Diagrams draw and fit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      # Node 22 to match the frontend job: jsdom 30 pulls undici 8, which
      # needs >= 22.19.
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Diagrams draw, and no label is clipped
        run: npx playwright test --config playwright.docs.config.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-diagram-trace
          path: frontend/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend tests and linting
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testlookup_test
          POSTGRES_USER: testlookup_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true     # Non-blocking in early phases

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://testlookup_user:test_password@localhost:5432/testlookup_test
          MONGO_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          LLM_PROVIDER: ollama
          LLM_MODEL: qwen2.5:7b
          AI_OFFLINE_MODE: "true"
          APP_SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-key-for-ci
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junit-xml=test-results.xml

      - name: Verify late-ack broker redelivery
        env:
          # DATABASE_URL/MONGO_URI are required even though this probe touches
          # neither: the disposable worker imports app.worker.celery_app, and
          # app/db/postgres.py builds its engine at IMPORT time. Without them
          # the worker subprocess dies instantly and the probe just waits out
          # its timeout on a process that already exited.
          DATABASE_URL: postgresql+asyncpg://testlookup_user:test_password@localhost:5432/testlookup_test
          MONGO_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          TESTLOOKUP_RUN_CELERY_VISIBILITY: "1"
          AI_OFFLINE_MODE: "true"
          APP_SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-key-for-ci
        run: pytest tests/regression/test_celery_visibility_redelivery.py -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./backend/coverage.xml
          flags: backend

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ─────────────────────────────────────────────────────────────
  # JOB 1a: Protected PostgreSQL/Mongo race, rollback, and publication coverage
  # The normal backend job keeps most tests hermetic. Phase 3 claim, outbox,
  # retention, evidence, and report-supersession tests are opt-in and skip
  # unless TESTLOOKUP_POSTGRES_TEST_DSN is present. Keep this separate so a
  # clean migrated database is authoritative and skipped coverage is visible.
  # ─────────────────────────────────────────────────────────────
  postgres-integration:
    name: Backend — PostgreSQL/Mongo integration and rollback
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testlookup_test
          POSTGRES_USER: testlookup_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to the clean integration database
        env:
          DATABASE_URL: postgresql+asyncpg://testlookup_user:test_password@localhost:5432/testlookup_test
          APP_SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-key-for-ci
        run: alembic upgrade head

      - name: Seed disposable authority rows for integration fixtures
        env:
          TESTLOOKUP_POSTGRES_TEST_DSN: postgresql+asyncpg://testlookup_user:test_password@localhost:5432/testlookup_test
        run: |
          python - <<'PY'
          import asyncio
          import os
          import uuid

          import asyncpg

          dsn = os.environ["TESTLOOKUP_POSTGRES_TEST_DSN"].replace(
              "+asyncpg", ""
          )
          project_id = uuid.uuid4()
          run_id = uuid.uuid4()
          test_case_id = uuid.uuid4()
          parent_pipeline_id = uuid.uuid4()
          cluster_row_id = uuid.uuid4()

          async def seed():
              conn = await asyncpg.connect(dsn)
              try:
                  await conn.execute(
                      """
                      INSERT INTO projects (id, name, slug, is_active)
                      VALUES ($1, 'CI PostgreSQL Integration', $2, true)
                      """,
                      project_id,
                      f"ci-postgres-{project_id.hex}",
                  )
                  await conn.execute(
                      """
                      INSERT INTO test_runs
                        (id, project_id, build_number, jenkins_job, status,
                         ingestion_source, failed_tests, total_tests)
                      VALUES ($1, $2, $3, 'ci-postgres-integration',
                              'FAILED', 'unknown', 1, 1)
                      """,
                      run_id,
                      project_id,
                      f"ci-{run_id.hex}",
                  )
                  await conn.execute(
                      """
                      INSERT INTO test_cases
                        (id, test_run_id, test_fingerprint, test_name,
                         suite_name, class_name, status, error_message)
                      VALUES ($1, $2, $3, 'ci_seed_failed_test',
                              'ci-integration', 'CIIntegration', 'FAILED',
                              'seeded integration failure')
                      """,
                      test_case_id,
                      run_id,
                      uuid.uuid4().hex[:64].ljust(64, "0"),
                  )
                  await conn.execute(
                      """
                      INSERT INTO agent_pipeline_runs
                        (id, test_run_id, workflow_type, status,
                         execution_metadata)
                      VALUES ($1, $2, 'deep', 'completed', '{}'::jsonb)
                      """,
                      parent_pipeline_id,
                      run_id,
                  )
                  await conn.execute(
                      """
                      INSERT INTO failure_clusters
                        (id, test_run_id, pipeline_run_id, cluster_id, label,
                         member_test_ids, size)
                      VALUES ($1, $2, $3, 'ci_seed_cluster',
                              'CI seeded failure cluster', $4::jsonb, 1)
                      """,
                      cluster_row_id,
                      run_id,
                      parent_pipeline_id,
                      '["' + str(test_case_id) + '"]',
                  )
              finally:
                  await conn.close()

          asyncio.run(seed())
          PY

      - name: Run protected PostgreSQL integration suite
        env:
          DATABASE_URL: postgresql+asyncpg://testlookup_user:test_password@localhost:5432/testlookup_test
          TESTLOOKUP_POSTGRES_TEST_DSN: postgresql+asyncpg://testlookup_user:test_password@localhost:5432/testlookup_test
          MONGO_URI: mongodb://localhost:27017
          APP_SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-key-for-ci
          AI_OFFLINE_MODE: "true"
          LLM_PROVIDER: ollama
          LLM_MODEL: qwen2.5:7b
        run: >-
          pytest -m integration -v --tb=short
          tests/integration/test_agent_action_ledger_postgres.py
          tests/integration/test_agent_memory_lifecycle_postgres.py
          tests/integration/test_change_ownership_postgres.py
          tests/integration/test_cluster_child_cancellation_postgres.py
          tests/integration/test_cluster_child_outbox_postgres.py
          tests/integration/test_cluster_child_retention_postgres.py
          tests/integration/test_evidence_artifact_authority_postgres.py
          tests/integration/test_investigator_budget_postgres.py
          tests/integration/test_investigator_claim_provider_postgres.py
          tests/integration/test_investigator_resume_postgres.py
          tests/integration/test_pipeline_resume_postgres.py
          tests/integration/test_report_eval_cycle_postgres.py
          tests/integration/test_dead_search_vector_removed_postgres.py
          tests/integration/test_search_step_index_postgres.py
          tests/integration/test_search_step_scope_postgres.py
          tests/integration/test_search_statement_cache_postgres.py
          tests/integration/test_search_count_shortcut_postgres.py
          tests/integration/test_decision_report_supersession_postgres_mongo.py
          tests/regression/test_notification_history_schema.py

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Frontend tests and type check
  # ─────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — Test & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      # jsdom 30 (the test DOM, pulled in by #629) requires Node >= 22.19 via
      # its undici 8 dependency; on Node 20 vitest workers crash at startup with
      # "webidl.util.markAsUncloneable is not a function". Run this job on 22.
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Save lockfile to workspace (for caching future runs)
        run: |
          if [ -f package-lock.json ]; then
            echo "✓ package-lock.json present"
          else
            echo "⚠ package-lock.json not found — run 'npm install' locally and commit it"
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check
        continue-on-error: true   # Non-blocking during iterative development phases

      - name: Run tests
        run: npm run test
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      # Guards what index.html makes the browser fetch before first render on
      # every route. A chunk being split out is not the same as a chunk being
      # deferred, and that difference is invisible in a chunk listing.
      - name: Bundle budget (eager critical path)
        run: npm run check:bundle

      # Status hues must stay unified across themes, fonts must stay system,
      # and the picker swatches must keep matching the tokens they advertise.
      - name: Theme tokens (normalization invariants)
        run: npm run check:theme

  # ─────────────────────────────────────────────────────────────
  # JOB 3: MCP server lint and syntax validation
  # ─────────────────────────────────────────────────────────────
  mcp-test:
    name: MCP Server — Lint & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mcp

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, sys, os
          errors = []
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, encoding='utf-8') as fh:
                              ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append(f'{path}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors: print(e)
              sys.exit(1)
          print(f'All Python files OK')
          "

      - name: Validate module imports (dry-run without MCP connection)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from config import settings
          print('config OK')
          import client
          print('client OK')
          from tools import auth, projects, runs, metrics, analytics, analysis, release
          print('tools OK')
          from resources import registry
          print('resources OK')
          from prompts import templates
          print('prompts OK')
          print('All imports validated successfully')
          "
        env:
          TESTLOOKUP_API_URL: http://localhost:8000
          TESTLOOKUP_USERNAME: ""
          TESTLOOKUP_PASSWORD: ""

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Build & push Docker images (only on main branch)
  # ─────────────────────────────────────────────────────────────
  sdk-cli-test:
    name: SDK & CLI — Test
    runs-on: ubuntu-latest
    # The Python SDK (client/) and CLI (cli/) have their own test suites that
    # NOTHING ran until now: backend/pytest.ini sets `testpaths = tests` and the
    # backend job runs pytest from ./backend, so client/tests and cli/tests were
    # never collected. The commit-range collector added 165 tests that would
    # have been decorative without this job.
    steps:
      - uses: actions/checkout@v7
        with:
          # Commit-range tests build real git repos, and some assert behaviour
          # against a genuine shallow clone — a depth-1 checkout here would
          # confuse "the repo under test" with "the repo being tested from".
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SDK + CLI with their real dependencies
        # Install both packages rather than hand-picking imports: the reporter
        # needs httpx and the CLI needs typer/rich/pydantic. Pinning that list
        # here would silently rot the moment either pyproject.toml changes.
        # Non-editable on purpose: it exercises the same wheel build a user
        # gets from `pip install ./cli`, and hatchling's editable (PEP 660)
        # hook is not available on every pinned version.
        run: |
          pip install pytest
          pip install ./client
          pip install ./cli

      - name: Configure git identity (tests create real repos)
        run: |
          git config --global user.email "ci@testlookup.invalid"
          git config --global user.name "TestLookup CI"
          git config --global init.defaultBranch main

      - name: Run SDK + CLI tests
        run: python -m pytest client/tests cli/tests -q

  # ─────────────────────────────────────────────────────────────
  java-sdk-test:
    name: Java SDK — Test
    runs-on: ubuntu-latest
    # The Java client had 29 passing unit tests and NOTHING ran them — the
    # sdk-cli-test job above covers only the Python SDK and CLI. That gap let a
    # real defect ship: `login()` used HttpClient.newHttpClient(), which
    # defaults to HTTP/2 and attempts an h2c upgrade over plain http://. Traefik
    # rejects it with a bare "400 Invalid HTTP request received.", so the
    # documented entry point could not authenticate behind a reverse proxy,
    # while every other call in the class already pinned HTTP/1.1.
    #
    # Without this job the regression test guarding that fix would be
    # decorative, which is the same trap called out in sdk-cli-test.
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          # The pom targets Java 11; 17 is the oldest current LTS that builds it
          # and is closer to what a consumer runs than the newest JDK.
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and test the Java SDK
        working-directory: client/java
        run: mvn --batch-mode --no-transfer-progress test

  go-sdk-test:
    name: Go SDK — Test
    runs-on: ubuntu-latest
    # client/go shipped a test file that nothing ran. The Java SDK had the same
    # gap (see java-sdk-test) and it let a real defect reach a release, so the
    # rule here is the same: a regression test nobody executes is decoration.
    #
    # `go vet` runs alongside `go test` deliberately — the module is pure
    # stdlib, so vet is the only static check available and it costs seconds.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod declares 1.21; build on that rather than newest, so a
          # consumer pinned to the declared minimum is what CI proves.
          go-version: "1.21"
          # No go.sum: the module has zero external dependencies, so there is
          # nothing to cache and setup-go's default lookup would fail.
          cache: false

      - name: Vet and test the Go SDK
        working-directory: client/go
        run: |
          go vet ./...
          go test ./...

  js-sdk-test:
    name: JS SDK — Type-check & Build
    runs-on: ubuntu-latest
    # client/js has NO test files, so this job does not claim to test it — it
    # type-checks and builds. That is still worth running: the package ships
    # `dist/` compiled from `src/`, so a type error or a broken build reaches
    # consumers directly.
    #
    # `npm run lint` is deliberately NOT run: the script existed but eslint was
    # in neither devDependencies nor any config file, so it could never have
    # executed. The dead script is removed in this change rather than wired up
    # here, which would have turned an inert script into a red pipeline.
    defaults:
      run:
        working-directory: ./client/js
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          # package.json declares engines node >= 18; 20 is the current LTS and
          # matches the repo's other Node jobs.
          node-version: "20"
          cache: npm
          cache-dependency-path: client/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    # The docs jobs gate this too. They are cheap and they guard something a
    # test suite cannot see: `mermaid-check` that every diagram parses, and
    # `docs-diagram-render` that the diagrams actually DRAW and their labels
    # are not clipped. An image that ships unreadable documentation is a
    # broken image, and both defects reached the deployment before this line
    # existed.
    needs:
      [
        quality-gate,
        backend-test,
        postgres-integration,
        frontend-test,
        mcp-test,
        mermaid-check,
        docs-diagram-render,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      # Generate package-lock.json before Docker build so npm ci works inside the image.
      # This avoids needing to commit a lockfile while still getting reproducible installs.
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Generate frontend package-lock.json
        working-directory: ./frontend
        run: npm install --package-lock-only

      - name: Log in to Docker Hub (avoids pull rate limits on base images and buildkit)
        uses: docker/login-action@v4.6.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # Stage client SDKs into the backend build context so the production
      # Dockerfile can bake them into the image at /app/client_sdks (the
      # ``/api/v1/sdk/{lang}`` download endpoint reads from there). Mirrors
      # the staging step in homelabsetup/deploy-homelab.sh — without it the
      # `COPY --from=builder /app/__client_sdks_staged ./client_sdks` line
      # in backend/Dockerfile fails with "/app/__client_sdks_staged: not
      # found" during the production build.
      - name: Stage client SDKs into backend context
        run: |
          set -euo pipefail
          STAGED_SDK="./backend/__client_sdks_staged"
          rm -rf "$STAGED_SDK"
          mkdir -p "$STAGED_SDK"
          rsync -a \
            --exclude='.pytest_cache' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='node_modules' \
            --exclude='.tox' \
            --exclude='.mypy_cache' \
            --exclude='.ruff_cache' \
            --exclude='target' \
            --exclude='build' \
            --exclude='*.egg-info' \
            --exclude='.coverage' \
            --exclude='htmlcov' \
            --exclude='.DS_Store' \
            ./client/ "$STAGED_SDK/"
          ls -la "$STAGED_SDK" | head -20

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build & push MCP server
        uses: docker/build-push-action@v7
        with:
          context: ./mcp
          file: ./mcp/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Deploy to dev (only on main branch, after images built)
  # Requires KUBE_CONFIG_DEV secret set in GitHub → Settings →
  # Environments → development → Secrets.
  # Value: base64-encoded kubeconfig file
  #   Linux/Mac: base64 -w0 ~/.kube/config
  #   Windows:   [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.kube\config"))
  # ─────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    environment: development

    steps:
      - uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.4.2"

      - name: Validate kubeconfig secret is set
        id: check-secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_DEV }}" ]; then
            echo "⚠️  KUBE_CONFIG_DEV secret is not set in GitHub Environment 'development'."
            echo "   Skipping deploy. Add the secret to enable automatic deployments."
            echo "   See: https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure kubeconfig
        if: steps.check-secret.outputs.skip != 'true'
        run: |
          mkdir -p /tmp
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > /tmp/kubeconfig
          # Verify the decoded file is valid YAML with a server entry
          if ! grep -q "server:" /tmp/kubeconfig; then
            echo "ERROR: Decoded kubeconfig does not contain a 'server:' entry."
            echo "       Ensure KUBE_CONFIG_DEV is a valid base64-encoded kubeconfig."
            exit 1
          fi
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
          echo "✓ kubeconfig configured"

      - name: Verify cluster connectivity
        if: steps.check-secret.outputs.skip != 'true'
        run: |
          kubectl cluster-info
          kubectl get nodes --request-timeout=10s

      - name: Update image tags in kustomization
        if: steps.check-secret.outputs.skip != 'true'
        run: |
          cd k8s/overlays/dev
          kustomize edit set image \
            testlookup/backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }} \
            testlookup/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            testlookup/mcp=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp:${{ github.sha }}

      - name: Apply manifests
        if: steps.check-secret.outputs.skip != 'true'
        run: |
          # --validate=false skips server-side schema validation (safe for apply operations)
          # Remove this flag once the cluster API server is reachable for openapi schema download
          kubectl apply -k k8s/overlays/dev --validate=false

      - name: Wait for rollout
        if: steps.check-secret.outputs.skip != 'true'
        run: |
          kubectl rollout status deployment/testlookup-backend -n testlookup-dev --timeout=120s
          kubectl rollout status deployment/testlookup-frontend -n testlookup-dev --timeout=60s

      - name: Run DB migrations
        if: steps.check-secret.outputs.skip != 'true'
        run: |
          kubectl exec -n testlookup-dev \
            deployment/testlookup-backend \
            -- alembic upgrade head

      - name: Deploy skipped — add KUBE_CONFIG_DEV to enable
        if: steps.check-secret.outputs.skip == 'true'
        run: |
          echo "ℹ️  Deploy skipped. Images were built and pushed successfully."
          echo "   To enable auto-deploy, add KUBE_CONFIG_DEV to the 'development' GitHub Environment."
# no-op to retrigger CI
