name: Deploy verified release to GKE
on:
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
permissions: {actions: read, contents: read, id-token: write}
jobs:
  verify:
    uses: ./.github/workflows/require-verified-sha.yml
    with:
      source_sha: ${{ inputs.source_sha }}
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_LOCATION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Download and validate verified manifest
        # Artifact name is verified-images-${{ needs.verify.outputs.source_sha }}.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.verify.outputs.ci_run_id }}" --name "${{ needs.verify.outputs.artifact_name }}" --dir verified-images
          python3 scripts/release/release_manifest.py validate --manifest verified-images/release-manifest.json --expected-source-sha "${{ needs.verify.outputs.source_sha }}"
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo install crane /usr/local/bin/crane
          gcloud auth configure-docker "${{ secrets.GCP_AR_LOCATION }}-docker.pkg.dev" --quiet
          for component in backend frontend mcp; do crane copy "$(jq -r ".images.$component.source_ref" verified-images/release-manifest.json)" "${{ secrets.GCP_AR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/testlookup/$component@$(jq -r ".images.$component.source_ref" verified-images/release-manifest.json | cut -d@ -f2)"; done
          python3 scripts/release/release_manifest.py materialize --manifest verified-images/release-manifest.json --destination-prefix "${{ secrets.GCP_AR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}" --output verified-images/deployment-manifest.json
      - name: Deploy digest-pinned release
        run: bash scripts/deploy-k8s.sh --cloud=gcp --release-manifest=verified-images/deployment-manifest.json
