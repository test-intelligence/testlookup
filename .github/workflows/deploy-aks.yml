name: Deploy verified release to AKS
on:
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
permissions: {actions: read, contents: read, id-token: write}
jobs:
  verify:
    uses: ./.github/workflows/require-verified-sha.yml
    with:
      source_sha: ${{ inputs.source_sha }}
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure cluster access
        run: az aks get-credentials --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "${{ secrets.AKS_CLUSTER_NAME }}" --overwrite-existing
      - name: Download and validate verified manifest
        # Artifact name is verified-images-${{ needs.verify.outputs.source_sha }}.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.verify.outputs.ci_run_id }}" --name "${{ needs.verify.outputs.artifact_name }}" --dir verified-images
          python3 scripts/release/release_manifest.py validate --manifest verified-images/release-manifest.json --expected-source-sha "${{ needs.verify.outputs.source_sha }}"
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo install crane /usr/local/bin/crane
          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"
          for component in backend frontend mcp; do crane copy "$(jq -r ".images.$component.source_ref" verified-images/release-manifest.json)" "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/testlookup/$component@$(jq -r ".images.$component.source_ref" verified-images/release-manifest.json | cut -d@ -f2)"; done
          python3 scripts/release/release_manifest.py materialize --manifest verified-images/release-manifest.json --destination-prefix "${{ secrets.AZURE_ACR_NAME }}.azurecr.io" --output verified-images/deployment-manifest.json
      - name: Deploy digest-pinned release
        run: scripts/deploy-k8s.sh --cloud=azure --release-manifest=verified-images/deployment-manifest.json
