name: Deploy verified release to AWS EKS

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Verified 40-character commit SHA to deploy.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/require-verified-sha.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure cluster access
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}" --alias testlookup-eks
      - name: Download, validate, and materialize the verified digest set
        # Artifact name is verified-images-${{ needs.verify.outputs.source_sha }}.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.verify.outputs.ci_run_id }}" --name "${{ needs.verify.outputs.artifact_name }}" --dir verified-images
          python3 scripts/release/release_manifest.py validate --manifest verified-images/release-manifest.json --expected-source-sha "${{ needs.verify.outputs.source_sha }}"
          python3 scripts/release/release_manifest.py materialize --manifest verified-images/release-manifest.json --destination-prefix "ghcr.io/${GITHUB_REPOSITORY}" --output verified-images/deployment-manifest.json
      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.4.2"
      - name: Apply only digest-pinned images
        run: |
          set -euo pipefail
          cd k8s/overlays/aws-eks
          kustomize edit set image testlookup/backend="$(jq -r '.destination_refs.backend' ../../../verified-images/deployment-manifest.json)" testlookup/frontend="$(jq -r '.destination_refs.frontend' ../../../verified-images/deployment-manifest.json)" testlookup/mcp="$(jq -r '.destination_refs.mcp' ../../../verified-images/deployment-manifest.json)"
          kubectl apply -k .
          kubectl -n testlookup rollout status deployment/testlookup-backend --timeout=300s
          kubectl -n testlookup rollout status deployment/testlookup-mcp --timeout=300s
          kubectl -n testlookup rollout status deployment/testlookup-frontend --timeout=180s
