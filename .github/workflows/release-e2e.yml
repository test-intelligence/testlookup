name: Release functional verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full upstream main commit with a verified image manifest
        required: true
        type: string
      tier:
        description: Test tier
        required: true
        default: regression
        type: choice
        options: [smoke, regression, full]
      verify_signals:
        description: Verify a candidate that includes the disposable monitored profile
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      tier:
        type: string
        default: regression
      verify_signals:
        type: boolean
        default: false
    outputs:
      manifest_sha256:
        value: ${{ jobs.regression.outputs.manifest_sha256 }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  verified:
    uses: ./.github/workflows/require-verified-sha.yml
    with:
      source_sha: ${{ inputs.source_sha }}
  regression:
    needs: verified
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.tier == 'full' && 300 || 180 }}
    outputs:
      manifest_sha256: ${{ steps.attest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve verified manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ needs.verified.outputs.ci_run_id }}
          ARTIFACT: ${{ needs.verified.outputs.artifact_name }}
          SOURCE_SHA: ${{ needs.verified.outputs.source_sha }}
        run: |
          gh run download "$CI_RUN" --name "$ARTIFACT" --dir verified
          python3 scripts/release/release_manifest.py validate --manifest verified/release-manifest.json --expected-source-sha "$SOURCE_SHA"
      - name: Verify release journeys and previous-build upgrade on Podman
        env:
          TIER: ${{ inputs.tier }}
          VERIFY_SIGNALS: ${{ inputs.verify_signals }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The hosted image installs Compose as a CLI plugin. Select that
          # provider explicitly and connect it to the rootless Podman engine.
          for provider in /usr/libexec/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose "$(command -v docker-compose || true)"; do
            if [[ -x "$provider" ]]; then export PODMAN_COMPOSE_PROVIDER="$provider"; break; fi
          done
          test -x "$PODMAN_COMPOSE_PROVIDER"
          if ! systemctl --user start podman.socket; then
            podman system service --time=0 &
            service_pid=$!
            trap 'kill "$service_pid" 2>/dev/null || true' EXIT
            for attempt in {1..30}; do
              [[ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ]] && break
              sleep 1
            done
            test -S "$XDG_RUNTIME_DIR/podman/podman.sock"
          fi
          podman compose version
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 -m venv "$RUNNER_TEMP/tl-e2e"
          # The release runner's own hashed lock (it holds PyYAML, which the
          # campaign needs); a bare `pip install PyYAML==6.0.3` pinned the
          # version but accepted any file the index served under it.
          "$RUNNER_TEMP/tl-e2e/bin/pip" install --require-hashes -r e2e-runner/requirements-lock.txt
          "$RUNNER_TEMP/tl-e2e/bin/python" e2e-runner/release_campaign.py --repository "$REPOSITORY" \
            --manifest verified/release-manifest.json --tier "$TIER" --out release-results
          if [[ "$VERIFY_SIGNALS" == "true" ]]; then
            # The runtime proof resolves OCI descriptors with Buildx, which
            # reads Docker's registry credentials.
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            "$RUNNER_TEMP/tl-e2e/bin/python" e2e-runner/monitored_ephemeral.py --engine podman \
              --manifest verified/release-manifest.json --out release-results/signal-gate.json
          fi
      - name: Show release decision
        if: always() && hashFiles('release-results/summary.md') != ''
        run: cat release-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Bind the passing decision to the tested artifact
        id: attest
        env:
          VERIFY_SIGNALS: ${{ inputs.verify_signals }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          digest = hashlib.sha256(Path("verified/release-manifest.json").read_bytes()).hexdigest()
          result = json.loads(Path("release-results/results.json").read_bytes())
          manifest = json.loads(Path("verified/release-manifest.json").read_bytes())
          if (result["verdict"] != "GO" or result["manifest_hash"] != digest
                  or result["observed_build"]["revision"] != manifest["source_sha"]):
              raise SystemExit("Candidate and functional decision do not match")
          if os.environ["VERIFY_SIGNALS"] == "true":
              signal = json.loads(Path("release-results/signal-gate.json").read_bytes())
              if (signal.get("status") != "passed" or signal.get("cleanup") != "completed"
                      or signal.get("profile") != "compose" or signal.get("source_sha") != manifest["source_sha"]
                      or signal.get("manifest_sha256") != digest):
                  raise SystemExit("Candidate and disposable signal evidence do not match")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("manifest_sha256=" + digest, file=output)
          PY
      - name: Retain public release report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-functional-evidence
          if-no-files-found: error
          path: |
            release-results/index.html
            release-results/summary.md
            release-results/results.json
            release-results/release-junit.xml
            release-results/signal-gate.json
            release-results/signal-gate-evidence/
