name: OpenSSF Scorecard

# Scores the repository's supply-chain practices (branch protection, pinned
# dependencies, token permissions, signed releases, ...) with the OpenSSF
# Scorecard (https://scorecard.dev). Runs on main and weekly, publishes the
# result to the public Scorecard API (the README badge reads it) and uploads
# the findings to the Security tab as SARIF.
#
# publish_results only works under the restrictions Scorecard sets for the
# job: read-only workflow permissions, no top-level env or defaults, a GitHub-
# hosted runner, and only the actions used below. Keep them when you edit it.
# Pull requests that change this file run it without publishing, as a check.
# Actions are pinned by commit SHA (Dependabot's github-actions entry keeps
# them current).
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/scorecard.yml"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Forks have nothing to publish.
    if: github.repository == 'test-intelligence/testlookup'
    permissions:
      contents: read
      actions: read
      # Upload the SARIF findings to code scanning.
      security-events: write
      # Sign the published result (OIDC).
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Keep the SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
