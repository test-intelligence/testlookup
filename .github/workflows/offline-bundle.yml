name: TestLookup — Offline bundle (air-gapped install)

# ============================================================================
# US-13.1 — proves `make offline-bundle` produces a bundle that can be
# imported with NO network access.
#
# TWO JOBS, deliberately:
#   1. build-bundle   — has network. Builds the app images, pulls the
#                       third-party images, assembles the tarball.
#   2. verify-offline — downloads that tarball and does every import step
#                       inside `docker run --network none --pull=never`
#                       containers, so a step that secretly needed the
#                       internet FAILS instead of quietly succeeding.
#
# WHAT THIS PROVES: bundle integrity (checksums), that `docker load` works
# from the tarball alone, that the images are self-contained enough for the
# backend application module to import with the network switched off, and
# that MANIFEST.json's SBOM status is internally consistent.
#
# WHAT THIS DOES NOT PROVE: it is NOT a full-stack end-to-end run. Nothing
# here boots Postgres/Mongo/Redis/MinIO or exercises the app against them —
# that is the job of ci.yml's `backend-test`. Do not read a green
# tick here as "the air-gapped deployment works", only as "the bundle is
# intact and importable offline".
#
# Not reusing ci.yml's `backend-test`: that job runs `services:` containers
# which GitHub starts by PULLING from Docker Hub — the exact thing an
# offline verifier must not do.
# ============================================================================

on:
  push:
    branches: [main]
    paths:
      - "deploy/images.manifest.txt"
      - "scripts/release/**"
      - "docker-compose*.yml"
      - "k8s/**"
      - "openshiftsetup/**"
      - "Makefile"
      - ".github/workflows/offline-bundle.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/images.manifest.txt"
      - "scripts/release/**"
      - "docker-compose*.yml"
      - "k8s/**"
      - "openshiftsetup/**"
      - "Makefile"
      - ".github/workflows/offline-bundle.yml"
  workflow_dispatch:
    inputs:
      with_llm:
        description: "Also bundle Ollama + ChromaDB (adds ~4 GB)"
        type: boolean
        default: false
      with_telemetry:
        description: "Include durable Compose telemetry configuration and redistributable images"
        type: boolean
        default: false
      version:
        description: "Release version without the v (for example 0.1.0): bundle the images that release promoted instead of building them. Leave empty for a CI check build."
        type: string
        default: ""

permissions:
  contents: read

# A release run (dispatched with `version`) checks out tag v<version> and
# bundles the exact image digests "Promote verified release" tagged; nothing
# is rebuilt. Every other run builds the images from this commit as ci-<sha>.
env:
  BUNDLE_VERSION: ${{ inputs.version || format('ci-{0}', github.sha) }}
  RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
  WITH_LLM: ${{ inputs.with_llm || false }}
  WITH_TELEMETRY: ${{ inputs.with_telemetry || false }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # PHASE 1 — build (network available)
  # ───────────────────────────────────────────────────────────────
  build-bundle:
    name: Build bundle (online)
    runs-on: ubuntu-latest
    # id-token, attestations and artifact-metadata are for the signed build
    # provenance of a release run's files (the attest step runs only when
    # `version` is given AND the run was dispatched from main); everything else
    # stays read-only.
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check the release version
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          [[ "$BUNDLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::version must look like 0.1.0 (no v), got '$BUNDLE_VERSION'"; exit 1; }

      # An empty ref keeps checkout's default (this commit); a release run
      # checks out the release tag, so the compose files, manifests and
      # scripts in the bundle are the released ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || '' }}

      # The :vX.Y.Z alias is only ever created by release.yml, after its
      # verified-CI, Trivy and functional gates, and it must still point at the
      # image CI built for the tagged commit (:<sha>). Pull by that digest and
      # name it the way the bundle expects (testlookup/<name>:<version>), so
      # offline-bundle.sh --skip-build saves those exact images.
      - name: Pull the release's verified images
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(tr -d '[:space:]' < VERSION)" = "$BUNDLE_VERSION" ] \
            || { echo "::error::VERSION at $RELEASE_TAG is not $BUNDLE_VERSION"; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          artifact_name="verified-images-$source_sha"
          artifact_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100")"
          mapfile -t candidates < <(jq -r '.artifacts[] | select(.expired == false) | .workflow_run.id' <<<"$artifact_json" | sort -u)
          matches=()
          for candidate in "${candidates[@]}"; do
            run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate")"
            if [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$source_sha" && "$(jq -r '.conclusion' <<<"$run_json")" == "success" && "$(jq -r '.event' <<<"$run_json")" == "push" && "$(jq -r '.head_branch' <<<"$run_json")" == "main" && "$(jq -r '.path' <<<"$run_json")" == ".github/workflows/ci.yml" ]]; then matches+=("$candidate"); fi
          done
          [[ "${#matches[@]}" -eq 1 ]] \
            || { echo "::error::expected exactly one successful main ci.yml image manifest for $source_sha"; exit 1; }
          gh run download "${matches[0]}" --name "$artifact_name" --dir verified-images
          python3 scripts/release/release_manifest.py validate \
            --manifest verified-images/release-manifest.json \
            --expected-source-sha "$source_sha"
          [ "$(jq -r '.version' verified-images/release-manifest.json)" = "$RELEASE_TAG" ] \
            || { echo "::error::CI image manifest version does not match $RELEASE_TAG"; exit 1; }
          registry="ghcr.io/test-intelligence/testlookup"
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest'; }
          : > release-images.txt
          for component in backend frontend mcp; do
            manifest_ref="$(jq -r ".images.$component.source_ref" verified-images/release-manifest.json)"
            manifest_digest="${manifest_ref##*@}"
            release_digest="$(digest_of "$registry/$component:$RELEASE_TAG" || true)"
            commit_digest="$(digest_of "$registry/$component:$source_sha" || true)"
            [[ "$release_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::$registry/$component:$RELEASE_TAG does not exist; run Promote verified release first"; exit 1; }
            [ "$release_digest" = "$commit_digest" ] && [ "$release_digest" = "$manifest_digest" ] \
              || { echo "::error::$registry/$component:$RELEASE_TAG ($release_digest) is not CI's verified digest ($manifest_digest) for $source_sha ($commit_digest)"; exit 1; }
            gh attestation verify "oci://$manifest_ref" \
              --repo test-intelligence/testlookup \
              --signer-workflow test-intelligence/testlookup/.github/workflows/ci.yml \
              --source-ref refs/heads/main \
              --source-digest "$source_sha"
            docker pull "$manifest_ref"
            docker tag "$manifest_ref" "testlookup/$component:$BUNDLE_VERSION"
            printf '%s\t%s\n' "$component" "$manifest_ref" >> release-images.txt
          done
          source scripts/release/image-manifest.sh
          infra_filter=core
          if [ "$WITH_LLM" = true ]; then infra_filter=core,llm; fi
          while IFS= read -r tagged_ref; do
            component="$(manifest_ref_component "$tagged_ref")"
            manifest_ref="$(jq -r ".images.$component.source_ref" verified-images/release-manifest.json)"
            [ "${manifest_ref%@sha256:*}" = "$tagged_ref" ] \
              || { echo "::error::signed $component ref '$manifest_ref' does not lock catalogue ref '$tagged_ref'"; exit 1; }
            [[ "${manifest_ref##*@sha256:}" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::signed $component ref is not digest-addressed"; exit 1; }
            docker pull "$manifest_ref"
            docker tag "$manifest_ref" "$tagged_ref"
          done < <(manifest_refs any infra "$infra_filter")
          if [ "$WITH_TELEMETRY" = true ]; then
            # These optional rows are already immutable in the catalogue and
            # are not part of the production release manifest. A tagged bundle
            # uses --skip-pull below, so preload them on a fresh runner now.
            # The helper selects only `telemetry`, never the AGPL
            # `telemetry-external` prerequisites.
            bash scripts/release/pull-offline-telemetry-images.sh
          fi
          cat release-images.txt

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: "5.4.2"

      # created_at is derived from the COMMIT timestamp, not the wall clock, so
      # rebuilding the same commit produces the same bundle metadata. Verified
      # locally: two builds of the same images with the same --created-at are
      # byte-identical in every file.
      - name: Derive a deterministic created_at from the commit
        id: meta
        run: |
          set -euo pipefail
          commit_iso="$(git show -s --format=%cI HEAD)"
          echo "created_at=$(date -u -d "$commit_iso" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Show the bundle plan
        run: |
          set -euo pipefail
          args=(--dry-run --version "$BUNDLE_VERSION" --created-at "${{ steps.meta.outputs.created_at }}")
          if [ "$WITH_LLM" = true ]; then args+=(--with-llm); fi
          if [ "$WITH_TELEMETRY" = true ]; then args+=(--with-telemetry); fi
          bash scripts/release/offline-bundle.sh "${args[@]}"

      # syft is intentionally NOT installed here: the released images carry
      # BuildKit SBOM attestations in the registry, which `docker save` cannot
      # carry into a tarball. This job therefore exercises the honest
      # "unavailable" path, and verify-offline asserts MANIFEST.json says so
      # explicitly rather than implying an SBOM exists. Release engineers who
      # need SBOMs in the bundle install syft on the build host first — see
      # user-guide/air-gapped-install.md.
      - name: Build the offline bundle
        run: |
          set -euo pipefail
          args=(--version "$BUNDLE_VERSION" --created-at "${{ steps.meta.outputs.created_at }}")
          if [ "$WITH_LLM" = true ]; then args+=(--with-llm); fi
          if [ "$WITH_TELEMETRY" = true ]; then args+=(--with-telemetry); fi
          if [ -n "$RELEASE_TAG" ]; then args+=(--skip-build --skip-pull); fi
          bash scripts/release/offline-bundle.sh "${args[@]}"

      # The bundle must carry the pulled digests, not a local build:
      # MANIFEST.json records each app image's registry digest.
      - name: Check the bundle carries the release's images
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          tar -xzOf "dist/testlookup-offline-${BUNDLE_VERSION}.tar.gz" "testlookup-offline-${BUNDLE_VERSION}/MANIFEST.json" > bundle-manifest.json
          # repo_digest is RepoDigests[0], which Docker may name after the
          # local tag (testlookup/<name>@sha256:...); compare the digest only.
          while IFS=$'\t' read -r component expected; do
            recorded="$(jq -r --arg ref "testlookup/$component:$BUNDLE_VERSION" '.images[] | select(.ref == $ref) | .repo_digest' bundle-manifest.json)"
            [[ "$recorded" == *@sha256:* && "${recorded##*@}" == "${expected##*@}" ]] \
              || { echo "::error::bundle records $component as '$recorded', expected digest ${expected##*@}"; exit 1; }
            echo "$component: ${recorded##*@}"
          done < release-images.txt

      # The online installer consumes the same immutable refs as the offline
      # bundle. The step above downloaded these exact bytes from the unique
      # successful main CI run and matched every promoted alias to them; sign
      # that original manifest with the other release assets below.
      - name: Publish the verified image manifest for online installs
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          cp verified-images/release-manifest.json dist/release-manifest.json
          test "$(sha256sum verified-images/release-manifest.json | cut -d' ' -f1)" = \
            "$(sha256sum dist/release-manifest.json | cut -d' ' -f1)"

      # M-14: checksums of install.sh and every file it downloads, from the
      # git blobs raw.githubusercontent.com serves for this ref.
      - name: Installer checksums
        run: |
          set -euo pipefail
          for path in install.sh docker-compose.release.yml .env.example scripts/gen-dev-env.sh scripts/init-db.sql; do
            printf '%s  %s\n' "$(git show "HEAD:$path" | sha256sum | cut -d' ' -f1)" "$path"
          done > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # Signed SLSA build provenance for the four release files, recorded in
      # Sigstore's public log and this repository's attestations. The bundle is
      # also kept as testlookup-offline-<version>.intoto.jsonl so it can be
      # attached to the GitHub release with the files it covers: OpenSSF
      # Scorecard's Signed-Releases check reads the release assets, and a user
      # can verify a download with
      #   gh attestation verify testlookup-offline-<version>.tar.gz \
      #     --repo test-intelligence/testlookup \
      #     --signer-workflow test-intelligence/testlookup/.github/workflows/offline-bundle.yml \
      #     --source-ref refs/heads/main \
      #     --bundle testlookup-offline-<version>.intoto.jsonl
      # --repo alone accepts a signature from any workflow run in the repository;
      # the two extra flags bind it to this workflow file as it is on main.
      # Releases are immutable once published, so it must go on the draft.
      #
      # Signed only on a release run: dispatched by hand, from main, with a
      # version (`gh workflow run offline-bundle.yml -f version=X.Y.Z` starts on
      # main). A run dispatched from another branch can carry a changed copy of
      # this file, so it still builds and checks the bundle but signs nothing.
      - name: Attest the release files' build provenance
        id: attest
        if: env.RELEASE_TAG != '' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/testlookup-offline-${{ env.BUNDLE_VERSION }}.tar.gz
            dist/testlookup-offline-${{ env.BUNDLE_VERSION }}.tar.gz.sha256
            dist/SHA256SUMS
            dist/release-manifest.json

      - name: Keep the provenance bundle with the release files
        if: env.RELEASE_TAG != '' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "dist/testlookup-offline-${BUNDLE_VERSION}.intoto.jsonl"

      - name: Bundle summary
        run: |
          set -euo pipefail
          ls -lh dist/
          {
            echo "## Offline bundle"
            echo ""
            echo "\`\`\`"
            cat "dist/testlookup-offline-${BUNDLE_VERSION}.tar.gz.sha256"
            echo "\`\`\`"
            if [ -n "$RELEASE_TAG" ]; then
              echo ""
              echo "Release $RELEASE_TAG, images pulled by digest (not rebuilt):"
              echo ""
              echo "\`\`\`"
              cat release-images.txt
              echo "\`\`\`"
            fi
            echo ""
            echo "Installer checksums (SHA256SUMS):"
            echo ""
            echo "\`\`\`"
            cat dist/SHA256SUMS
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A release run keeps the files 30 days so they can be attached to the
      # GitHub release (with the .intoto.jsonl provenance, which only a
      # release run dispatched from main writes); a CI check build keeps them 5.
      - name: Upload bundle for the offline verifier
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-bundle
          path: |
            dist/testlookup-offline-${{ env.BUNDLE_VERSION }}.tar.gz
            dist/testlookup-offline-${{ env.BUNDLE_VERSION }}.tar.gz.sha256
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/*.intoto.jsonl
          retention-days: ${{ env.RELEASE_TAG && 30 || 5 }}
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # PHASE 2 — verify with the network switched off
  # ───────────────────────────────────────────────────────────────
  verify-offline:
    name: Verify bundle import (network-blocked)
    runs-on: ubuntu-latest
    needs: [build-bundle]
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-bundle
          path: incoming

      # From here on, every command that touches the bundle either runs inside
      # a `--network none` container or is a purely local daemon operation
      # (`docker load` never contacts a registry).
      - name: Verify the transfer checksum
        working-directory: incoming
        run: sha256sum -c "testlookup-offline-${BUNDLE_VERSION}.tar.gz.sha256"

      - name: Unpack
        run: tar xzf "incoming/testlookup-offline-${BUNDLE_VERSION}.tar.gz"

      # busybox comes OUT OF THE BUNDLE — nothing is pulled. It then becomes
      # the network-isolated verifier for everything else.
      - name: Load busybox from the bundle
        run: |
          set -euo pipefail
          cd "testlookup-offline-${BUNDLE_VERSION}"
          tar_rel="$(awk -F'\t' '$2 ~ /^busybox:/ {print $1; exit}' images.list)"
          test -n "$tar_rel"
          docker load -i "$tar_rel"

      - name: Prove the verifier container really has no network
        run: |
          set -euo pipefail
          if docker run --rm --network none --pull=never busybox:1.36 \
               sh -c 'wget -T 3 -q -O- http://example.com >/dev/null 2>&1'; then
            echo "::error::the --network none container reached the internet — this verification is meaningless"
            exit 1
          fi
          echo "Network isolation confirmed. ✓"

      - name: Verify every bundle checksum (inside --network none)
        run: |
          set -euo pipefail
          docker run --rm --network none --pull=never \
            -v "${PWD}/testlookup-offline-${BUNDLE_VERSION}:/bundle" -w /bundle \
            busybox:1.36 sha256sum -c checksums.sha256

      - name: Import the bundle (docker load + retag, no registry contact)
        run: |
          set -euo pipefail
          cd "testlookup-offline-${BUNDLE_VERSION}"
          # A real air-gapped site would add --push; there is no registry here,
          # so we stop at retag. Everything up to that point is identical.
          ./import-bundle.sh --registry ci.invalid \
                             --storage-class ci-storage \
                             --apps-domain apps.ci.invalid

      - name: Backend image starts with the network switched off
        run: |
          set -euo pipefail
          # --pull=never guarantees this image came from the tarball and was
          # not silently fetched from a registry.
          # app/db/postgres.py builds the SQLAlchemy engine at IMPORT time, so
          # `import app.main` needs a parseable DATABASE_URL even though nothing
          # here connects to anything (the network is off). These values are
          # syntactically valid and point nowhere on purpose — same contract the
          # backend test suite runs under (backend/tests/conftest.py defaults
          # DATABASE_URL to a host that never resolves).
          docker run --rm --network none --pull=never \
            -e APP_ENV=production -e AI_OFFLINE_MODE=true \
            -e DATABASE_URL="postgresql+asyncpg://offline:offline@127.0.0.1:5432/offline" \
            -e MONGODB_URL="mongodb://127.0.0.1:27017" \
            -e REDIS_URL="redis://127.0.0.1:6379/0" \
            -e JWT_SECRET_KEY="offline-verify-not-a-real-secret" \
            -e STORAGE_BACKEND=local \
            "ci.invalid/testlookup/backend:${BUNDLE_VERSION}" \
            python -c "import fastapi, uvicorn, sqlalchemy, celery, alembic; import app.main; print('backend app module imported offline OK')"

      - name: MCP image imports with the network switched off
        run: |
          set -euo pipefail
          # Import the exact symbols server.py depends on, not just `mcp`:
          # `import mcp` succeeds on any release, but an SDK major can move a
          # symbol (mcp 2.x dropped mcp.server.fastmcp, which once crash-looped
          # the pod in production). Since W46 the server is on mcp 2 (MCPServer);
          # mcp/tests keeps this line in step with the server's mcp imports.
          docker run --rm --network none --pull=never \
            "ci.invalid/testlookup/mcp:${BUNDLE_VERSION}" \
            python -c "from mcp.server.mcpserver import MCPServer; from mcp.server.transport_security import TransportSecuritySettings; from mcp.server.auth.provider import AccessToken; from mcp.server.auth.settings import AuthSettings; import mcp; print('mcp runtime present offline OK')"

      - name: MANIFEST.json is internally consistent and honest about SBOMs
        run: |
          set -euo pipefail
          cd "testlookup-offline-${BUNDLE_VERSION}"
          python3 - <<'PY'
          import json, pathlib, sys

          m = json.load(open("MANIFEST.json"))
          errors = []

          listed = {line.split("\t")[1].strip()
                    for line in open("images.list") if line.strip()}
          manifest_refs = {i["ref"] for i in m["images"]}
          if listed != manifest_refs:
              errors.append(f"images.list {listed} != MANIFEST.json {manifest_refs}")

          for img in m["images"]:
              if not pathlib.Path(img["file"]).is_file():
                  errors.append(f"{img['ref']}: missing {img['file']}")
              if len(img.get("sha256", "")) != 64:
                  errors.append(f"{img['ref']}: bad sha256")
              sbom = img.get("sbom") or {}
              status = sbom.get("status")
              if status == "present":
                  if not pathlib.Path(sbom.get("file", "")).is_file():
                      errors.append(f"{img['ref']}: SBOM claimed present but the file is missing")
              elif status == "unavailable":
                  # The whole point: never imply an SBOM exists when it does not.
                  if not sbom.get("reason"):
                      errors.append(f"{img['ref']}: SBOM unavailable with no reason given")
              else:
                  errors.append(f"{img['ref']}: unknown sbom status {status!r}")

          if not m.get("created_at") or not m.get("version"):
              errors.append("MANIFEST.json is missing created_at/version")

          if errors:
              print("MANIFEST.json problems:", *errors, sep="\n  - ")
              sys.exit(1)
          print(f"MANIFEST.json OK — {len(m['images'])} images, sbom_mode={m['sbom_mode']}")
          PY

      # Licence boundary of the bundle: MongoDB (SSPL-1.0) is an external
      # prerequisite and must NOT be redistributed; Valkey (BSD-3-Clause) and
      # versitygw (Apache-2.0) replaced Redis 7.4 (RSALv2/SSPLv1) and PGSTY
      # Silo/mc (AGPL-3.0) and must be present.
      - name: Bundle carries no SSPL/AGPL/RSAL images and lists Mongo as external
        run: |
          set -euo pipefail
          cd "testlookup-offline-${BUNDLE_VERSION}"
          python3 - <<'PY'
          import json

          refs = {line.split("\t")[1].strip() for line in open("images.list") if line.strip()}
          names = {ref.rsplit(":", 1)[0] for ref in refs}
          errors = []
          for banned in ("mongo", "redis", "pgsty/silo", "pgsty/mc", "minio/minio", "minio/mc"):
              if banned in names or f"docker.io/library/{banned}" in names:
                  errors.append(f"bundle redistributes {banned}")
          for required in ("valkey/valkey", "ghcr.io/versity/versitygw"):
              if required not in names:
                  errors.append(f"bundle is missing {required}")
          manifest = json.load(open("MANIFEST.json"))
          if "mongo:7" not in manifest.get("external_prerequisites", []):
              errors.append("MANIFEST.json does not list mongo:7 under external_prerequisites")
          for f in ("LICENSE",):
              try:
                  open(f).close()
              except OSError:
                  errors.append(f"bundle ships no {f}")
          if errors:
              raise SystemExit("bundle licence boundary violated:\n  - " + "\n  - ".join(errors))
          print(f"bundle images OK: {sorted(refs)}; external: {manifest['external_prerequisites']}")
          PY

      - name: Verdict
        run: |
          {
            echo "## Offline bundle verification"
            echo ""
            echo "Bundle integrity + offline import **verified** with the network blocked:"
            echo ""
            echo "- transfer checksum + all in-bundle checksums (checked inside \`--network none\`)"
            echo "- \`docker load\` of every image straight from the tarball"
            echo "- retag/render via \`import-bundle.sh\` with no registry contact"
            echo "- backend + MCP images run offline with \`--pull=never\`"
            echo "- \`MANIFEST.json\` consistency, incl. honest per-image SBOM status"
