name: TestLookup — Offline bundle (air-gapped install)

# ============================================================================
# US-13.1 — proves `make offline-bundle` produces a bundle that can be
# imported with NO network access.
#
# TWO JOBS, deliberately:
#   1. build-bundle   — has network. Builds the app images, pulls the
#                       third-party images, assembles the tarball.
#   2. verify-offline — downloads that tarball and does every import step
#                       inside `docker run --network none --pull=never`
#                       containers, so a step that secretly needed the
#                       internet FAILS instead of quietly succeeding.
#
# WHAT THIS PROVES: bundle integrity (checksums), that `docker load` works
# from the tarball alone, that the images are self-contained enough for the
# backend application module to import with the network switched off, and
# that MANIFEST.json's SBOM status is internally consistent.
#
# WHAT THIS DOES NOT PROVE: it is NOT a full-stack end-to-end run. Nothing
# here boots Postgres/Mongo/Redis/MinIO or exercises the app against them —
# that is `backend-test` + the deploy workflows' job. Do not read a green
# tick here as "the air-gapped deployment works", only as "the bundle is
# intact and importable offline".
#
# Not reusing ci.yml's `backend-test`: that job runs `services:` containers
# which GitHub starts by PULLING from Docker Hub — the exact thing an
# offline verifier must not do.
# ============================================================================

on:
  push:
    branches: [main]
    paths:
      - "deploy/images.manifest.txt"
      - "scripts/release/**"
      - "docker-compose*.yml"
      - "k8s/**"
      - "openshiftsetup/**"
      - "Makefile"
      - ".github/workflows/offline-bundle.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/images.manifest.txt"
      - "scripts/release/**"
      - "docker-compose*.yml"
      - "k8s/**"
      - "openshiftsetup/**"
      - "Makefile"
      - ".github/workflows/offline-bundle.yml"
  workflow_dispatch:
    inputs:
      with_llm:
        description: "Also bundle Ollama + ChromaDB (adds ~2 GB)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUNDLE_VERSION: ci-${{ github.sha }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # PHASE 1 — build (network available)
  # ───────────────────────────────────────────────────────────────
  build-bundle:
    name: Build bundle (online)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.4.2"

      # created_at is derived from the COMMIT timestamp, not the wall clock, so
      # rebuilding the same commit produces the same bundle metadata. Verified
      # locally: two builds of the same images with the same --created-at are
      # byte-identical in every file.
      - name: Derive a deterministic created_at from the commit
        id: meta
        run: |
          set -euo pipefail
          commit_iso="$(git show -s --format=%cI HEAD)"
          echo "created_at=$(date -u -d "$commit_iso" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Show the bundle plan
        run: |
          bash scripts/release/offline-bundle.sh --dry-run \
            --version "${BUNDLE_VERSION}" \
            --created-at "${{ steps.meta.outputs.created_at }}"

      # syft is intentionally NOT installed here: the released images carry
      # BuildKit SBOM attestations in the registry, which `docker save` cannot
      # carry into a tarball. This job therefore exercises the honest
      # "unavailable" path, and verify-offline asserts MANIFEST.json says so
      # explicitly rather than implying an SBOM exists. Release engineers who
      # need SBOMs in the bundle install syft on the build host first — see
      # user-guide/air-gapped-install.md.
      - name: Build the offline bundle
        run: |
          set -euo pipefail
          ARGS="--version ${BUNDLE_VERSION} --created-at ${{ steps.meta.outputs.created_at }}"
          if [ "${{ github.event.inputs.with_llm }}" = "true" ]; then
            ARGS="$ARGS --with-llm"
          fi
          # shellcheck disable=SC2086
          bash scripts/release/offline-bundle.sh $ARGS

      - name: Bundle summary
        run: |
          set -euo pipefail
          ls -lh dist/
          {
            echo "## Offline bundle"
            echo ""
            echo "\`\`\`"
            cat "dist/testlookup-offline-${BUNDLE_VERSION}.tar.gz.sha256"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle for the offline verifier
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: |
            dist/testlookup-offline-${{ env.BUNDLE_VERSION }}.tar.gz
            dist/testlookup-offline-${{ env.BUNDLE_VERSION }}.tar.gz.sha256
          retention-days: 5
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # PHASE 2 — verify with the network switched off
  # ───────────────────────────────────────────────────────────────
  verify-offline:
    name: Verify bundle import (network-blocked)
    runs-on: ubuntu-latest
    needs: [build-bundle]
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: offline-bundle
          path: incoming

      # From here on, every command that touches the bundle either runs inside
      # a `--network none` container or is a purely local daemon operation
      # (`docker load` never contacts a registry).
      - name: Verify the transfer checksum
        working-directory: incoming
        run: sha256sum -c "testlookup-offline-${BUNDLE_VERSION}.tar.gz.sha256"

      - name: Unpack
        run: tar xzf "incoming/testlookup-offline-${BUNDLE_VERSION}.tar.gz"

      # busybox comes OUT OF THE BUNDLE — nothing is pulled. It then becomes
      # the network-isolated verifier for everything else.
      - name: Load busybox from the bundle
        run: |
          set -euo pipefail
          cd "testlookup-offline-${BUNDLE_VERSION}"
          tar_rel="$(awk -F'\t' '$2 ~ /^busybox:/ {print $1; exit}' images.list)"
          test -n "$tar_rel"
          docker load -i "$tar_rel"

      - name: Prove the verifier container really has no network
        run: |
          set -euo pipefail
          if docker run --rm --network none --pull=never busybox:1.36 \
               sh -c 'wget -T 3 -q -O- http://example.com >/dev/null 2>&1'; then
            echo "::error::the --network none container reached the internet — this verification is meaningless"
            exit 1
          fi
          echo "Network isolation confirmed. ✓"

      - name: Verify every bundle checksum (inside --network none)
        run: |
          set -euo pipefail
          docker run --rm --network none --pull=never \
            -v "${PWD}/testlookup-offline-${BUNDLE_VERSION}:/bundle" -w /bundle \
            busybox:1.36 sha256sum -c checksums.sha256

      - name: Import the bundle (docker load + retag, no registry contact)
        run: |
          set -euo pipefail
          cd "testlookup-offline-${BUNDLE_VERSION}"
          # A real air-gapped site would add --push; there is no registry here,
          # so we stop at retag. Everything up to that point is identical.
          ./import-bundle.sh --registry ci.invalid \
                             --storage-class ci-storage \
                             --apps-domain apps.ci.invalid

      - name: Backend image starts with the network switched off
        run: |
          set -euo pipefail
          # --pull=never guarantees this image came from the tarball and was
          # not silently fetched from a registry.
          # app/db/postgres.py builds the SQLAlchemy engine at IMPORT time, so
          # `import app.main` needs a parseable DATABASE_URL even though nothing
          # here connects to anything (the network is off). These values are
          # syntactically valid and point nowhere on purpose — same contract the
          # backend test suite runs under (see backend/CLAUDE.md).
          docker run --rm --network none --pull=never \
            -e APP_ENV=production -e AI_OFFLINE_MODE=true \
            -e DATABASE_URL="postgresql+asyncpg://offline:offline@127.0.0.1:5432/offline" \
            -e MONGODB_URL="mongodb://127.0.0.1:27017" \
            -e REDIS_URL="redis://127.0.0.1:6379/0" \
            -e JWT_SECRET_KEY="offline-verify-not-a-real-secret" \
            -e STORAGE_BACKEND=local \
            "ci.invalid/testlookup/backend:${BUNDLE_VERSION}" \
            python -c "import fastapi, uvicorn, sqlalchemy, celery, alembic; import app.main; print('backend app module imported offline OK')"

      - name: MCP image imports with the network switched off
        run: |
          set -euo pipefail
          # Import the exact symbol server.py depends on, not just `mcp`:
          # `import mcp` also succeeds on mcp 2.x, which DROPPED
          # mcp.server.fastmcp and crash-looped the pod in production.
          # (requirements pin <2.0.0; this asserts the pin held in the image.)
          docker run --rm --network none --pull=never \
            "ci.invalid/testlookup/mcp:${BUNDLE_VERSION}" \
            python -c "from mcp.server.fastmcp import FastMCP; import mcp; print('mcp runtime present offline OK')"

      - name: MANIFEST.json is internally consistent and honest about SBOMs
        run: |
          set -euo pipefail
          cd "testlookup-offline-${BUNDLE_VERSION}"
          python3 - <<'PY'
          import json, pathlib, sys

          m = json.load(open("MANIFEST.json"))
          errors = []

          listed = {line.split("\t")[1].strip()
                    for line in open("images.list") if line.strip()}
          manifest_refs = {i["ref"] for i in m["images"]}
          if listed != manifest_refs:
              errors.append(f"images.list {listed} != MANIFEST.json {manifest_refs}")

          for img in m["images"]:
              if not pathlib.Path(img["file"]).is_file():
                  errors.append(f"{img['ref']}: missing {img['file']}")
              if len(img.get("sha256", "")) != 64:
                  errors.append(f"{img['ref']}: bad sha256")
              sbom = img.get("sbom") or {}
              status = sbom.get("status")
              if status == "present":
                  if not pathlib.Path(sbom.get("file", "")).is_file():
                      errors.append(f"{img['ref']}: SBOM claimed present but the file is missing")
              elif status == "unavailable":
                  # The whole point: never imply an SBOM exists when it does not.
                  if not sbom.get("reason"):
                      errors.append(f"{img['ref']}: SBOM unavailable with no reason given")
              else:
                  errors.append(f"{img['ref']}: unknown sbom status {status!r}")

          if not m.get("created_at") or not m.get("version"):
              errors.append("MANIFEST.json is missing created_at/version")

          if errors:
              print("MANIFEST.json problems:", *errors, sep="\n  - ")
              sys.exit(1)
          print(f"MANIFEST.json OK — {len(m['images'])} images, sbom_mode={m['sbom_mode']}")
          PY

      - name: Verdict
        run: |
          {
            echo "## Offline bundle verification"
            echo ""
            echo "Bundle integrity + offline import **verified** with the network blocked:"
            echo ""
            echo "- transfer checksum + all in-bundle checksums (checked inside \`--network none\`)"
            echo "- \`docker load\` of every image straight from the tarball"
            echo "- retag/render via \`import-bundle.sh\` with no registry contact"
            echo "- backend + MCP images run offline with \`--pull=never\`"
            echo "- \`MANIFEST.json\` consistency, incl. honest per-image SBOM status"
            echo ""
            echo "> This is **not** a full-stack end-to-end test — no datastores are started."
          } >> "$GITHUB_STEP_SUMMARY"
