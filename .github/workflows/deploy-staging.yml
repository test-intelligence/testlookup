name: Deploy to Staging (GCP VM)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_HOSTNAME: gcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Stage client SDKs into backend context
        # Populate ``backend/__client_sdks_staged/`` so the production
        # Dockerfile bakes the SDK artifacts into the image (the
        # ``/api/v1/sdk/{lang}`` endpoint reads from there). Mirrors the
        # equivalent step in ci.yml and homelabsetup/deploy-homelab.sh.
        run: |
          set -euo pipefail
          STAGED_SDK="./backend/__client_sdks_staged"
          rm -rf "$STAGED_SDK"
          mkdir -p "$STAGED_SDK"
          rsync -a \
            --exclude='.pytest_cache' --exclude='__pycache__' \
            --exclude='*.pyc' --exclude='.venv' --exclude='venv' \
            --exclude='node_modules' --exclude='.tox' \
            --exclude='.mypy_cache' --exclude='.ruff_cache' \
            --exclude='target' --exclude='build' \
            --exclude='*.egg-info' --exclude='.coverage' \
            --exclude='htmlcov' --exclude='.DS_Store' \
            ./client/ "$STAGED_SDK/"

      - name: Build & Push Backend
        run: |
          docker build -t $GCR_HOSTNAME/$PROJECT_ID/testlookup-backend:$IMAGE_TAG ./backend
          docker push $GCR_HOSTNAME/$PROJECT_ID/testlookup-backend:$IMAGE_TAG

      - name: Build & Push Frontend
        run: |
          docker build -t $GCR_HOSTNAME/$PROJECT_ID/testlookup-frontend:$IMAGE_TAG ./frontend
          docker push $GCR_HOSTNAME/$PROJECT_ID/testlookup-frontend:$IMAGE_TAG

  deploy-staging:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy via SSH to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST_STAGING }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd /opt/testlookup
            git pull origin develop
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            docker-compose -f docker-compose.gcp-vm.yml pull
            docker-compose -f docker-compose.gcp-vm.yml up -d --remove-orphans
            docker system prune -f

      - name: Health Check
        run: |
          sleep 30
          curl --fail ${{ secrets.STAGING_URL }}/health || exit 1

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Staging deployment successful for commit ${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Staging deployment FAILED for commit ${{ github.sha }}"
