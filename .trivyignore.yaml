# Accepted vulnerability findings for the PR security scans (re-audit M23).
#
# .github/workflows/ci.yml runs Trivy on every pull request:
#   security-deps    trivy fs    (Python requirements, npm lockfiles, Maven, Go)
#   security-images  trivy image (the backend, frontend and MCP images)
# Both FAIL on any HIGH or CRITICAL vulnerability that has a fixed version
# (--severity HIGH,CRITICAL --ignore-unfixed). MEDIUM and below, and findings
# with no fix yet, are reported by Dependabot / the release scan, not blocked.
#
# To accept a finding you cannot fix yet, add an entry here in the PR that
# needs it. Every entry needs all three keys (scripts/test_ci_security.py
# enforces this):
#   id          the CVE / GHSA id Trivy reported
#   statement   WHY it is acceptable (not reachable, mitigated by X, ...)
#   expired_at  a date at most 90 days out. After it, the entry stops
#               suppressing and the scan fails again, which forces a re-review.
# Optionally narrow it with `paths:` (the lockfile / package path Trivy printed).
#
# Example:
#   - id: CVE-2024-00000
#     statement: Only reachable through the XML parser, which we never feed untrusted input.
#     expired_at: 2026-12-01
#     paths: ["backend/requirements.txt"]
vulnerabilities:
  # 2026-11-12 (PR-2 supply chain): ten entries removed, all fixed rather than accepted.
  #   starlette CVE-2026-54283, CVE-2026-48818: the backend moved to starlette 1.10.0
  #     (prometheus-fastapi-instrumentator 8.1.0 lifted the <1.0 cap); CVE-2025-62727
  #     was already fixed in the 0.52.1 it replaced.
  #   util-linux CVE-2026-53612/53613/53614/76642/78408/78409/78410: Alpine 3.24 ships
  #     2.42.3-r1, and the frontend image (nginx 1.31.8-alpine3.24) runs apk upgrade.
  # ── e2e-runner image: packages bundled INSIDE the Cypress 16.3.0 binary (its Electron app's
  #    resources/app tree). 16.3.0 (2026-11-10) is the newest Cypress, so none of these fixes can be
  #    installed. Every entry is scoped to that one directory: the same id anywhere else (another
  #    image, a lockfile, a later Cypress) still fails the scan. scripts/test_ci_security.py ties the
  #    path to the Cypress version e2e-runner/reporters/js/package-lock.json installs, so a Cypress
  #    bump fails until these entries are re-reviewed or deleted.
  # @babel/plugin-transform-modules-systemjs
  - id: CVE-2026-44728
    statement: &cypress-bundle >-
      MITIGATED. Not shipped, and not fixable yet: bundled inside the Cypress 16.3.0 binary, the
      newest release, in the CI-only e2e-runner image. CI never publishes that image (build-images pushes backend,
      frontend and MCP only), and it runs only as a release-verification job. There Cypress runs
      one local spec of two arithmetic tests (e2e-runner/reporters/js/release.cy.js) headless in
      Electron and visits no page. Dependabot watches e2e-runner/reporters/js; re-review on the
      next Cypress release.
    expired_at: 2026-12-11
    paths: ["opt/cypress/16.3.0/Cypress/resources/app/**"]
