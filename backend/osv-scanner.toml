# Accepted OSV findings for backend/requirements*.txt (osv-scanner reads this
# file for the lockfiles in this directory; OpenSSF Scorecard's Vulnerabilities
# check runs osv-scanner over the repository).
#
# Each entry is a finding with NO fixed release whose vulnerable code the app
# does not run. Every entry names the evidence and expires after at most 90
# days, so it comes back for review instead of staying hidden
# (scripts/test_ci_security.py enforces both). Each advisory is listed under
# all of its IDs (PYSEC, GHSA, CVE) because OSV reports it under more than one.
# Dependabot alerts for the same advisories are triaged separately on GitHub.

# ── chromadb 1.5.9 (newest release; no fix) ─────────────────────────────────
# The four advisories sit in chromadb's Python HTTP server, its FastAPI app and
# its auth providers. The app uses only the client: HttpClient to the Rust
# chromadb/chroma server image, and an in-process EphemeralClient with no
# server and no auth. backend/tests/regression/
# test_chromadb_server_code_is_never_used.py fails the day app code imports
# the server, the FastAPI app or an auth provider, or passes
# trust_remote_code=True. The Dependabot alerts were dismissed on the same
# basis (OSS repo review 2026-11-12, H-7).
[[IgnoredVulns]]
id = "PYSEC-2026-311"
ignoreUntil = 2027-02-16
reason = "chromadb server endpoint (collection create with trust_remote_code); app runs only the client - see test_chromadb_server_code_is_never_used.py"

