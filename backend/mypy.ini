[mypy]
python_version = 3.11
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = false

# Third-party packages without type stubs — suppress import errors globally
[mypy-celery.*]
ignore_missing_imports = True

[mypy-celery]
ignore_missing_imports = True

[mypy-motor.*]
ignore_missing_imports = True

