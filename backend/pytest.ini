[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
cache_dir = tests/.pytest_cache
markers =
    integration: tests that exercise API wiring or live service/container boundaries
    live: tests that require a running TestLookup stack
    regression: pinned bug-fix tests for 2026-05-18/19 fixes (see backend/tests/regression/)
