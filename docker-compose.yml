#version: "3.9"
name: testlookup

# ============================================================
# TestLookup — Local Development Stack
# ============================================================
# Default start (no local LLM — uses rules/ML engine):
#   docker compose up -d --build
#
# With local LLM (Ollama + ChromaDB — adds ~4GB download):
#   docker compose --profile local-llm up -d --build
#   docker compose exec ollama ollama pull qwen2.5:7b
#
# Or via Make (recommended):
#   make dev          # no local LLM
#   make dev-llm      # with Ollama + ChromaDB
#   make dev-setup    # first-time: dev-llm + pull LLM models
#
# The backend degrades gracefully when local-llm services are
# absent: ANALYSIS_MODE=auto falls back to ML then rules.
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # DATABASE LAYER
  # ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=${PG_FLEET_MAX_CONNECTIONS:-400}"]
    container_name: testlookup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testlookup}
      POSTGRES_USER: ${POSTGRES_USER:-testlookup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with any local PostgreSQL on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testlookup_user} -d ${POSTGRES_DB:-testlookup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    networks:
      - testlookup_net

  db-budget-check:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: python -m app.db.compose_budget_gate
    restart: "no"
    environment:
      PG_API_PROCESSES_PER_POD: "1"
      PG_API_POOL_SIZE: ${PG_API_POOL_SIZE:-2}
      PG_API_MAX_OVERFLOW: ${PG_API_MAX_OVERFLOW:-1}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      CELERY_CHILDREN_CONCURRENCY: "1"
      PG_WORKER_POOL_SIZE: ${PG_WORKER_POOL_SIZE:-1}
      PG_WORKER_MAX_OVERFLOW: ${PG_WORKER_MAX_OVERFLOW:-1}
      PG_FLEET_MAX_CONNECTIONS: ${PG_FLEET_MAX_CONNECTIONS:-400}
      PG_FLEET_OPERATIONAL_RESERVE: ${PG_FLEET_OPERATIONAL_RESERVE:-50}
      PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS: ${PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS:-3}
      PG_FLEET_RESERVED_CONNECTIONS: ${PG_FLEET_RESERVED_CONNECTIONS:-0}
      PG_FLEET_MIGRATION_CONNECTIONS: "1"
      PG_FLEET_REQUIRED_CONNECTIONS: ${PG_COMPOSE_REQUIRED_CONNECTIONS:-14}

  mongo:
    image: mongo:7
    container_name: testlookup_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-testlookup_logs}
      # Root credentials — required to prevent unauthenticated access on 27017.
      # Defined in .env; MONGO_URI in backend/worker services must include these.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-testlookup}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    # Bind to loopback only so a laptop cannot accidentally expose the DB on LAN.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    networks:
      - testlookup_net

  redis:
    image: redis:7-alpine
    container_name: testlookup_redis
    restart: unless-stopped
    # volatile-lru (not allkeys-lru): only evict keys that carry a TTL. This protects
    # TTL-less critical keys — live session tokens (X-Session-Token O(1) lookup) and the
    # live-events stream — from eviction under memory pressure. Bounded-memory assumption:
    # the events stream is MAXLEN-capped (100k) and the per-run testcases buffer has a 25h
    # TTL + is drained to Postgres every 30s, so unevictable keys can't grow unbounded.
    # --requirepass is applied only when REDIS_PASSWORD is set (the container
    # shell evaluates ${...:+...}; $$ escapes compose interpolation). Empty
    # password → no auth, backward-compatible for a purely-internal Redis.
    command: sh -c 'redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Bind to loopback only: Redis is the Celery broker (task injection = code
    # execution) + JWT-revocation + authz cache and must never be reachable from
    # the LAN/internet. Internal services reach it over the compose network by
    # hostname; this published port is for local debugging on the host only.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 128M
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # OBJECT STORAGE
  # ──────────────────────────────────────────────────────────

  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: testlookup_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set — copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set — copy .env.example to .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  # MinIO setup: create bucket and configure webhook notification
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: testlookup_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-test-telemetry};
      mc mb --ignore-existing local/testlookup-attachments;
      mc anonymous set download local/testlookup-attachments;
      echo 'MinIO setup complete';
      "
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # AI LAYER — LOCAL LLM (OPTIONAL — profile: local-llm)
  # ──────────────────────────────────────────────────────────
  # These services are NOT started by default to keep the dev
  # stack lightweight.  Enable them with:
  #   docker compose --profile local-llm up -d --build
  #   make dev-llm
  # The backend falls back to rules/ML engine when absent.
  # ──────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:0.5.4
    container_name: testlookup_ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - testlookup_net

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: testlookup_chroma
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # APPLICATION LAYER
  # ──────────────────────────────────────────────────────────

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=operation
      - PG_PROCESSES_PER_POD=1
      - PG_POOL_SIZE=1
      - PG_MAX_OVERFLOW=0
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
    depends_on:
      db-budget-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - testlookup_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: testlookup_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app                   # Hot-reload in development
      - ./backend/app:/app/app
      - ./client:/app/client_sdks:ro     # Client SDK files served at /api/v1/sdk/
      - ./infra:/app/infra:ro            # Read-only access for SLO drift test (item #8)
      - ./cli:/cli:ro                    # Read-only access for CLI structure tests
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=api
      - PG_PROCESSES_PER_POD=1
      - PG_POOL_SIZE=${PG_API_POOL_SIZE:-2}
      - PG_MAX_OVERFLOW=${PG_API_MAX_OVERFLOW:-1}
      - PG_FLEET_MAX_CONNECTIONS=${PG_FLEET_MAX_CONNECTIONS:-400}
      - PG_FLEET_OPERATIONAL_RESERVE=${PG_FLEET_OPERATIONAL_RESERVE:-50}
      - PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS=${PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS:-3}
      - PG_FLEET_RESERVED_CONNECTIONS=${PG_FLEET_RESERVED_CONNECTIONS:-0}
      - PG_FLEET_MIGRATION_CONNECTIONS=1
      - PG_FLEET_REQUIRED_CONNECTIONS=${PG_COMPOSE_REQUIRED_CONNECTIONS:-14}
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      # Secure-by-default: a naive `docker compose up` (no .env) runs in
      # production mode (dev-login off, refuses default secrets). `make dev` /
      # gen-dev-env.sh set these to development/true in .env for local use.
      - APP_ENV=${APP_ENV:-production}
      - DEV_AUTO_LOGIN_ENABLED=${DEV_AUTO_LOGIN_ENABLED:-false}
      # The development stack has one ingestion worker on the legacy queue.
      - LIVE_INGEST_SHARD_COUNT=0
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M
    networks:
      - testlookup_net

  # Celery worker for background tasks (ingestion, AI analysis)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: testlookup_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,critical,ingestion,ai_analysis --max-tasks-per-child=200
    volumes:
      - ./backend:/app
    tmpfs:
      - /tmp/prometheus-multiproc:mode=1777
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=worker
      - PG_PROCESSES_PER_POD=${CELERY_CONCURRENCY:-4}
      - PG_POOL_SIZE=${PG_WORKER_POOL_SIZE:-1}
      - PG_MAX_OVERFLOW=${PG_WORKER_MAX_OVERFLOW:-1}
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - APP_ENV=${APP_ENV:-production}
      - DEV_AUTO_LOGIN_ENABLED=${DEV_AUTO_LOGIN_ENABLED:-false}
      - LIVE_INGEST_SHARD_COUNT=0
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
      - WORKER_METRICS_PORT=9100
    depends_on:
      - backend
      - redis
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          memory: 512M
    networks:
      - testlookup_net

  # Isolated bounded queue for planner-spawned Investigator children.
  worker-children:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: testlookup_worker_children
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 -Q agent_children --max-tasks-per-child=25
    volumes:
      - ./backend:/app
    tmpfs:
      - /tmp/prometheus-multiproc:mode=1777
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=worker
      - PG_PROCESSES_PER_POD=1
      - PG_POOL_SIZE=${PG_WORKER_POOL_SIZE:-1}
      - PG_MAX_OVERFLOW=${PG_WORKER_MAX_OVERFLOW:-1}
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - APP_ENV=${APP_ENV:-production}
      - DEV_AUTO_LOGIN_ENABLED=${DEV_AUTO_LOGIN_ENABLED:-false}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
      - WORKER_METRICS_PORT=9100
    depends_on:
      - backend
      - redis
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - testlookup_net

  # Celery Beat scheduler for periodic tasks
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: testlookup_beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      - redis
    networks:
      - testlookup_net

  # Flower — Celery monitoring UI. Requires HTTP basic auth so the Celery
  # control plane (inspect, revoke, terminate) is not exposed to anyone on
  # the LAN. Credentials are loaded from .env (FLOWER_USER / FLOWER_PASSWORD).
  flower:
    image: mher/flower:2.0
    container_name: testlookup_flower
    restart: unless-stopped
    command:
      - celery
      - --broker=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - flower
      - --port=5555
      - --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    networks:
      - testlookup_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: testlookup_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src         # Hot-reload in development
      - ./frontend/public:/app/public
      - /app/node_modules               # Preserve node_modules from container
    environment:
      # Empty → bundle uses same-origin relative URLs (browser hits
      # localhost:3000/api/...), avoiding cross-origin CORS/CSP issues.
      - VITE_API_BASE_URL=
      # Vite dev server proxies /api, /webhooks, /ws to the backend container
      # (localhost from inside the container is the container itself, not the host).
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_APP_NAME=TestLookup
      - VITE_APP_VERSION=0.0.1
    depends_on:
      - backend
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # SEED INIT — one-shot: auto-seeds dev database after backend
  # is healthy. Idempotent — safe to run on every `make dev`.
  # ──────────────────────────────────────────────────────────
  seed-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: testlookup_seed_init
    restart: "no"
    command: sh -c "python /app/scripts/seed_dev_data.py"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # MCP SERVER — AI assistant integration (SSE transport)
  # ──────────────────────────────────────────────────────────
  # Primary use: stdio (Desktop Clients) — run `make mcp-start` locally.
  # This container enables SSE transport for CI pipelines and web clients.

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: testlookup_mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - TESTLOOKUP_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

# ──────────────────────────────────────────────────────────
# NETWORKS & VOLUMES
# ──────────────────────────────────────────────────────────

networks:
  testlookup_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
  ollama_models:     # Persists downloaded LLM models (4–14GB each)
  chroma_data:       # Persists embedding vectors
