# testlookup.properties — used by livestream_script.py and any other ad-hoc
# script in this directory. Generated from Settings → API Keys → Generate
# streaming key in the TestLookup UI.

testlookup.endpoint=https://testlookup.local
testlookup.api.key=qai_REPLACE_ME
testlookup.project=My Project
testlookup.launch=Smoke suite

# Homelab / dev TLS — pick ONE if you're hitting a self-signed cert:
#
#   1. Preferred: point at the cluster's TLS cert (preserves verification).
#      Export the cert once with:
#        kubectl -n testlookup get secret testlookup-tls-cert \
#          -o jsonpath='{.data.tls\.crt}' | base64 -d > ./testlookup-ca.crt
#      Then uncomment:
# testlookup.ca_cert_path=./testlookup-ca.crt
#
#   2. Last resort: skip TLS verification entirely. Don't ship this in CI.
testlookup.insecure=true
