# testlookup.properties — generated from Settings → API Keys → Generate streaming key.
# Drop this file in the project root (next to pytest.ini / pyproject.toml).
# The pytest plugin auto-detects it — no CLI flags or conftest.py changes needed.

testlookup.endpoint=https://testlookup.local
testlookup.api.key=qai_-kRVJSoSK4oMsOPiXWkwzkBvHGvvDVoG37J7sX8Pxfo
testlookup.project=EverGreen
testlookup.launch=Smoke suite

# Optional CI metadata. Most CI runners expose these as env vars; leave them
# commented to use the env-var fallback (TESTLOOKUP_BUILD, TESTLOOKUP_BRANCH,
# TESTLOOKUP_COMMIT) instead.
# testlookup.build=42
# testlookup.branch=main
# testlookup.commit=abc1234

# Homelab / dev TLS — only set ONE of these and only when needed:
#
#   1. Preferred: point at the cluster's TLS cert (preserves verification).
#      Export the cert once with:
#        kubectl -n testlookup get secret testlookup-tls-cert \
#          -o jsonpath='{.data.tls\.crt}' | base64 -d > ./testlookup-ca.crt
#      Then uncomment:
# testlookup.ca_cert_path=./testlookup-ca.crt
#
#   2. Last resort: skip TLS verification entirely. Don't ship this in CI.
# testlookup.insecure=true
