name: testlookup

# ============================================================
# TestLookup — Release / Self-Host Stack (PRE-BUILT IMAGES)
# ============================================================
# Run TestLookup WITHOUT cloning the repo or building images.
# This file pulls pinned, pre-built images from the GitHub
# Container Registry instead of building from source.
#
# Fastest path — the remote one-liner does everything for you:
#   curl -fsSL https://raw.githubusercontent.com/anandtopu/testlookup/main/install.sh | bash
#
# Or by hand (download this file + the env tooling, generate .env, then up):
#   mkdir testlookup && cd testlookup && mkdir scripts
#   base=https://raw.githubusercontent.com/anandtopu/testlookup/main
#   curl -fsSLO $base/docker-compose.release.yml
#   curl -fsSLo .env.example          $base/.env.example
#   curl -fsSLo scripts/gen-dev-env.sh $base/scripts/gen-dev-env.sh
#   curl -fsSLo scripts/init-db.sql    $base/scripts/init-db.sql
#   bash scripts/gen-dev-env.sh        # writes .env with random local secrets
#   docker compose -f docker-compose.release.yml up -d
#
# Image selection (override via the environment / .env):
#   TESTLOOKUP_IMAGE    registry + namespace   (default ghcr.io/anandtopu/testlookup)
#   TESTLOOKUP_VERSION  image tag              (default latest — tracks main)
# For a reproducible deploy, pin TESTLOOKUP_VERSION to a published commit SHA
# or release tag instead of the moving `latest`, e.g.:
#   TESTLOOKUP_VERSION=055d8c1 docker compose -f docker-compose.release.yml up -d
#
# Optional demo seed data (three demo projects, 30 days of history):
#   docker compose -f docker-compose.release.yml --profile demo up -d
#
# Optional local LLM (Ollama + ChromaDB — adds ~4GB download):
#   docker compose -f docker-compose.release.yml --profile local-llm up -d
#   docker compose -f docker-compose.release.yml exec ollama ollama pull qwen2.5:7b
#
# This stack still reads secrets from .env — generate one with
# scripts/gen-dev-env.sh (local/demo) or supply your own for production.
# ============================================================

x-app-image: &app-backend-image
  image: ${TESTLOOKUP_IMAGE:-ghcr.io/anandtopu/testlookup}/backend:${TESTLOOKUP_VERSION:-latest}

services:

  # ──────────────────────────────────────────────────────────
  # DATABASE LAYER
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: testlookup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testlookup}
      POSTGRES_USER: ${POSTGRES_USER:-testlookup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — generate a .env with scripts/gen-dev-env.sh}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init-db.sql is fetched alongside this file by install.sh; it only enables
      # PG extensions (uuid-ossp, pgcrypto, pg_trgm) on first boot.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testlookup_user} -d ${POSTGRES_DB:-testlookup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  mongo:
    image: mongo:7
    container_name: testlookup_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-testlookup_logs}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-testlookup}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  redis:
    image: redis:7-alpine
    container_name: testlookup_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # OBJECT STORAGE
  # ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: testlookup_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set — generate a .env with scripts/gen-dev-env.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set — generate a .env with scripts/gen-dev-env.sh}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  minio-setup:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: testlookup_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-test-telemetry};
      mc mb --ignore-existing local/testlookup-attachments;
      mc anonymous set download local/testlookup-attachments;
      echo 'MinIO setup complete';
      "
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # AI LAYER — LOCAL LLM (OPTIONAL — profile: local-llm)
  # ──────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.5.4
    container_name: testlookup_ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - testlookup_net

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: testlookup_chroma
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # APPLICATION LAYER — pinned pre-built images (no build:)
  # The production backend image's default CMD runs the Alembic
  # migrations then `uvicorn --workers 4`, so no command override
  # is needed here.
  # ──────────────────────────────────────────────────────────
  backend:
    <<: *app-backend-image
    container_name: testlookup_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - testlookup_net

  worker:
    <<: *app-backend-image
    container_name: testlookup_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,ingestion,ai_analysis --max-tasks-per-child=200
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

  beat:
    <<: *app-backend-image
    container_name: testlookup_beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - testlookup_net

  frontend:
    image: ${TESTLOOKUP_IMAGE:-ghcr.io/anandtopu/testlookup}/frontend:${TESTLOOKUP_VERSION:-latest}
    container_name: testlookup_frontend
    restart: unless-stopped
    # Production image is nginx serving the built SPA on :80 and proxying /api
    # to BACKEND_UPSTREAM (default backend:8000).
    ports:
      - "3000:80"
    environment:
      - BACKEND_UPSTREAM=backend:8000
    depends_on:
      - backend
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # DEMO SEED — one-shot, OPTIONAL (profile: demo)
  # Loads three demo projects + 30 days of history. Idempotent.
  # ──────────────────────────────────────────────────────────
  seed-init:
    <<: *app-backend-image
    container_name: testlookup_seed_init
    profiles: ["demo"]
    restart: "no"
    command: sh -c "python /app/scripts/seed_dev_data.py"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # MCP SERVER — AI assistant integration (SSE transport)
  # ──────────────────────────────────────────────────────────
  mcp:
    image: ${TESTLOOKUP_IMAGE:-ghcr.io/anandtopu/testlookup}/mcp:${TESTLOOKUP_VERSION:-latest}
    container_name: testlookup_mcp
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - TESTLOOKUP_API_URL=http://backend:8000
      - TESTLOOKUP_USERNAME=${MCP_USERNAME:-}
      - TESTLOOKUP_PASSWORD=${MCP_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

networks:
  testlookup_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
  ollama_models:
  chroma_data:
