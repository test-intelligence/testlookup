name: testlookup

# ============================================================
# TestLookup — Release / Self-Host Stack (PRE-BUILT IMAGES)
# ============================================================
# Run TestLookup WITHOUT cloning the repo or building images.
# This file pulls pinned, pre-built images from the GitHub
# Container Registry instead of building from source.
#
# Fastest path — the remote one-liner does everything for you:
#   curl -fsSL https://raw.githubusercontent.com/anandtopu/testlookup/main/install.sh | bash
#
# Or by hand (download this file + the env tooling, generate .env, then up):
#   mkdir testlookup && cd testlookup && mkdir scripts
#   base=https://raw.githubusercontent.com/anandtopu/testlookup/main
#   curl -fsSLO $base/docker-compose.release.yml
#   curl -fsSLo .env.example          $base/.env.example
#   curl -fsSLo scripts/gen-dev-env.sh $base/scripts/gen-dev-env.sh
#   curl -fsSLo scripts/init-db.sql    $base/scripts/init-db.sql
#   bash scripts/gen-dev-env.sh        # writes .env with random local secrets
#   docker compose -f docker-compose.release.yml up -d
#
# Image selection (override via the environment / .env):
#   TESTLOOKUP_IMAGE    registry + namespace   (default ghcr.io/anandtopu/testlookup)
#   TESTLOOKUP_VERSION  image tag              (default latest — tracks main)
# For a reproducible deploy, pin TESTLOOKUP_VERSION to a published commit SHA
# or release tag instead of the moving `latest`, e.g.:
#   TESTLOOKUP_VERSION=055d8c1 docker compose -f docker-compose.release.yml up -d
#
# Optional demo seed data (three demo projects, 30 days of history):
#   docker compose -f docker-compose.release.yml --profile demo up -d
#
# Optional local LLM (Ollama + ChromaDB — adds ~4GB download):
#   docker compose -f docker-compose.release.yml --profile local-llm up -d
#   docker compose -f docker-compose.release.yml exec ollama ollama pull qwen2.5:7b
#
# This stack still reads secrets from .env — generate one with
# scripts/gen-dev-env.sh (local/demo) or supply your own for production.
# ============================================================

x-app-image: &app-backend-image
  image: ${TESTLOOKUP_IMAGE:-ghcr.io/anandtopu/testlookup}/backend:${TESTLOOKUP_VERSION:-latest}

services:

  # ──────────────────────────────────────────────────────────
  # DATABASE LAYER
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=${PG_FLEET_MAX_CONNECTIONS:-400}"]
    container_name: testlookup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testlookup}
      POSTGRES_USER: ${POSTGRES_USER:-testlookup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — generate a .env with scripts/gen-dev-env.sh}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init-db.sql is fetched alongside this file by install.sh; it only enables
      # PG extensions (uuid-ossp, pgcrypto, pg_trgm) on first boot.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testlookup_user} -d ${POSTGRES_DB:-testlookup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  db-budget-check:
    <<: *app-backend-image
    command: python -m app.db.compose_budget_gate
    restart: "no"
    environment:
      PG_API_PROCESSES_PER_POD: "4"
      PG_API_POOL_SIZE: ${PG_API_POOL_SIZE:-2}
      PG_API_MAX_OVERFLOW: ${PG_API_MAX_OVERFLOW:-1}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      CELERY_CHILDREN_CONCURRENCY: ${CELERY_CHILDREN_CONCURRENCY:-1}
      PG_WORKER_POOL_SIZE: ${PG_WORKER_POOL_SIZE:-1}
      PG_WORKER_MAX_OVERFLOW: ${PG_WORKER_MAX_OVERFLOW:-1}
      PG_FLEET_MAX_CONNECTIONS: ${PG_FLEET_MAX_CONNECTIONS:-400}
      PG_FLEET_OPERATIONAL_RESERVE: ${PG_FLEET_OPERATIONAL_RESERVE:-50}
      PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS: ${PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS:-3}
      PG_FLEET_RESERVED_CONNECTIONS: ${PG_FLEET_RESERVED_CONNECTIONS:-0}
      PG_FLEET_MIGRATION_CONNECTIONS: "1"
      PG_FLEET_REQUIRED_CONNECTIONS: ${PG_COMPOSE_REQUIRED_CONNECTIONS:-23}

  mongo:
    image: mongo:7
    container_name: testlookup_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-testlookup_logs}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-testlookup}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  redis:
    image: redis:7-alpine
    container_name: testlookup_redis
    restart: unless-stopped
    # --requirepass is applied only when REDIS_PASSWORD is set (the container
    # shell evaluates ${...:+...}; $$ escapes compose interpolation). Empty
    # password → no auth, backward-compatible for a purely-internal Redis.
    command: sh -c 'redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Bind to loopback only: Redis is the Celery broker (task injection = code
    # execution) + JWT-revocation + authz cache and must never be reachable from
    # the LAN/internet. Internal services reach it over the compose network by
    # hostname; this published port is for local debugging on the host only.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # OBJECT STORAGE
  # ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: testlookup_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set — generate a .env with scripts/gen-dev-env.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set — generate a .env with scripts/gen-dev-env.sh}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  minio-setup:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: testlookup_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-test-telemetry};
      mc mb --ignore-existing local/testlookup-attachments;
      mc anonymous set download local/testlookup-attachments;
      echo 'MinIO setup complete';
      "
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # AI LAYER — LOCAL LLM (OPTIONAL — profile: local-llm)
  # ──────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.5.4
    container_name: testlookup_ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - testlookup_net

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: testlookup_chroma
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # APPLICATION LAYER — pinned pre-built images (no build:)
  # The production image preserves four Uvicorn workers. Its shared
  # PROMETHEUS_MULTIPROC_DIR makes /metrics aggregate all four processes.
  # ──────────────────────────────────────────────────────────
  db-migrate:
    <<: *app-backend-image
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=operation
      - PG_PROCESSES_PER_POD=1
      - PG_POOL_SIZE=1
      - PG_MAX_OVERFLOW=0
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
    depends_on:
      db-budget-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - testlookup_net

  backend:
    <<: *app-backend-image
    # Deployment-owned command bypasses legacy image entrypoints that bundled
    # Alembic, so an immediate N-1 rollback can start against N's schema.
    command: sh -c 'rm -f "$$PROMETHEUS_MULTIPROC_DIR"/*.db && exec gunicorn -c gunicorn_conf.py app.main:app'
    container_name: testlookup_backend
    restart: unless-stopped
    ports:
      # Loopback-only by default. The supported entry point is the frontend on
      # :3000, which proxies /api; publishing the API on every interface let a
      # caller reach it WITHOUT passing through nginx, and a direct peer inside
      # the trusted bridge range could then set its own X-Forwarded-For. Set
      # BACKEND_PUBLISH_ADDR=0.0.0.0 to expose it deliberately, and put a proxy
      # in front of it when you do.
      - "${BACKEND_PUBLISH_ADDR:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=api
      # Re-audit H2: the frontend nginx proxies /api, so without this the API
      # sees that container as every caller. Trust the Docker bridge range the
      # nginx container connects from -- NOT "*", under which uvicorn returns
      # the leftmost X-Forwarded-For entry, i.e. whatever the caller sent.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      - PG_PROCESSES_PER_POD=4
      - PG_POOL_SIZE=${PG_API_POOL_SIZE:-2}
      - PG_MAX_OVERFLOW=${PG_API_MAX_OVERFLOW:-1}
      - PG_FLEET_MAX_CONNECTIONS=${PG_FLEET_MAX_CONNECTIONS:-400}
      - PG_FLEET_OPERATIONAL_RESERVE=${PG_FLEET_OPERATIONAL_RESERVE:-50}
      - PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS=${PG_FLEET_SUPERUSER_RESERVED_CONNECTIONS:-3}
      - PG_FLEET_RESERVED_CONNECTIONS=${PG_FLEET_RESERVED_CONNECTIONS:-0}
      - PG_FLEET_MIGRATION_CONNECTIONS=1
      - PG_FLEET_REQUIRED_CONNECTIONS=${PG_COMPOSE_REQUIRED_CONNECTIONS:-23}
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - LIVE_INGEST_SHARD_COUNT=8
      # Secure-by-default: a naive `docker compose up` (no .env) runs in
      # production mode (dev-login off, refuses default secrets).
      - APP_ENV=${APP_ENV:-production}
      - DEV_AUTO_LOGIN_ENABLED=${DEV_AUTO_LOGIN_ENABLED:-false}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - testlookup_net

  worker:
    <<: *app-backend-image
    container_name: testlookup_worker
    restart: unless-stopped
    # Keep this subscription set in lockstep with celery_app routes and the
    # default LIVE_INGEST_SHARD_COUNT=8. Missing one queue leaves work pending
    # forever in a fresh release stack.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,critical,ingestion,ingestion.shard.0,ingestion.shard.1,ingestion.shard.2,ingestion.shard.3,ingestion.shard.4,ingestion.shard.5,ingestion.shard.6,ingestion.shard.7,ai_analysis --max-tasks-per-child=200
    tmpfs:
      - /tmp/prometheus-multiproc:mode=1777
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=worker
      - PG_PROCESSES_PER_POD=${CELERY_CONCURRENCY:-4}
      - PG_POOL_SIZE=${PG_WORKER_POOL_SIZE:-1}
      - PG_MAX_OVERFLOW=${PG_WORKER_MAX_OVERFLOW:-1}
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - LIVE_INGEST_SHARD_COUNT=8
      - APP_ENV=${APP_ENV:-production}
      - DEV_AUTO_LOGIN_ENABLED=${DEV_AUTO_LOGIN_ENABLED:-false}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
      - WORKER_METRICS_PORT=9100
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

  # Dedicated consumer for the agent_children queue (cluster-child
  # investigations). Kept separate from `worker` so a long recursive
  # investigation cannot starve ingestion/analysis; low concurrency and a short
  # max-tasks-per-child because these tasks are memory-heavy and long-running.
  worker-children:
    <<: *app-backend-image
    container_name: testlookup_worker_children
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CHILDREN_CONCURRENCY:-1} --prefetch-multiplier=1 -Q agent_children --max-tasks-per-child=25
    tmpfs:
      - /tmp/prometheus-multiproc:mode=1777
    env_file:
      - .env
    environment:
      - PG_PROCESS_ROLE=worker
      - PG_PROCESSES_PER_POD=${CELERY_CHILDREN_CONCURRENCY:-1}
      - PG_POOL_SIZE=${PG_WORKER_POOL_SIZE:-1}
      - PG_MAX_OVERFLOW=${PG_WORKER_MAX_OVERFLOW:-1}
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
      - MONGO_URI=mongodb://${MONGO_USER:-testlookup}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-testlookup_logs}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - APP_ENV=${APP_ENV:-production}
      - DEV_AUTO_LOGIN_ENABLED=${DEV_AUTO_LOGIN_ENABLED:-false}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
      - WORKER_METRICS_PORT=9100
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

  beat:
    <<: *app-backend-image
    container_name: testlookup_beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      - redis
    networks:
      - testlookup_net

  frontend:
    image: ${TESTLOOKUP_IMAGE:-ghcr.io/anandtopu/testlookup}/frontend:${TESTLOOKUP_VERSION:-latest}
    container_name: testlookup_frontend
    restart: unless-stopped
    # Production image is nginx serving the built SPA on :80 and proxying /api
    # to BACKEND_UPSTREAM (default backend:8000).
    ports:
      - "3000:80"
    environment:
      - BACKEND_UPSTREAM=backend:8000
    depends_on:
      - backend
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # DEMO SEED — one-shot, OPTIONAL (profile: demo)
  # Loads three demo projects + 30 days of history. Idempotent.
  # ──────────────────────────────────────────────────────────
  seed-init:
    <<: *app-backend-image
    container_name: testlookup_seed_init
    profiles: ["demo"]
    restart: "no"
    command: sh -c "python /app/scripts/seed_dev_data.py"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-testlookup_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testlookup}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

  # ──────────────────────────────────────────────────────────
  # MCP SERVER — AI assistant integration (SSE transport)
  # ──────────────────────────────────────────────────────────
  mcp:
    image: ${TESTLOOKUP_IMAGE:-ghcr.io/anandtopu/testlookup}/mcp:${TESTLOOKUP_VERSION:-latest}
    container_name: testlookup_mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - TESTLOOKUP_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testlookup_net

networks:
  testlookup_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
  ollama_models:
  chroma_data:
