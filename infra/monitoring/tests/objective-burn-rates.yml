rule_files:
- ../objectives/api-slos.yml
evaluation_interval: 1m
tests:
- name: complete replicas aggregate before ratios and independently reset counters
  interval: 1m
  input_series:
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: 0+100x29 100+100x60
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: '0x90'
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="b"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="b"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="b",outcome="good"}
    values: 0+900x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="b",outcome="bad"}
    values: 0+10x90
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-b",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-b",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: '0x90'
  - series: testlookup_api_journey_events_total{installation="site-b",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+1000x90
  - series: up{cluster="other",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="other",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="other",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: '0x90'
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="other",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+1000x90
  - series: up{cluster="lab",namespace="other",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="other",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="other",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: '0x90'
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="other",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+1000x90
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="staging",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="staging",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: '0x90'
  - series: testlookup_api_journey_events_total{installation="site-a",environment="staging",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+1000x90
  promql_expr_test:
  - expr: testlookup:api_sli_eligible_events{installation="site-a",environment="production",cluster="lab",namespace="prod",window="1h"}
    eval_time: 61m
    exp_samples:
    - labels: testlookup:api_sli_eligible_events{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",window="1h"}
      value: 60600
  - expr: testlookup:api_sli_error_ratio{installation="site-a",environment="production",cluster="lab",namespace="prod",window="1h"}
    eval_time: 61m
    exp_samples:
    - labels: testlookup:api_sli_error_ratio{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",window="1h"}
      value: 0.009900990099009901
  - expr: testlookup:api_sli_error_ratio{installation="site-a",environment="production",cluster="lab",namespace="prod",window="30d"}
    eval_time: 61m
    exp_samples: []
  alert_rule_test:
  - eval_time: 70m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
- name: quiet configured API has no fabricated success or burn and no missing-data alert
  interval: 1m
  input_series:
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: '0x90'
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: '0x90'
  - series: testlookup:api_objective_adopted{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",owner="api-team"}
    values: 1x500
  promql_expr_test:
  - expr: testlookup:api_sli_valid
    eval_time: 70m
    exp_samples:
    - labels: testlookup:api_sli_valid{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability"}
      value: 1
  - expr: testlookup:api_sli_error_ratio
    eval_time: 70m
    exp_samples: []
  - expr: testlookup:api_sli_burn_rate
    eval_time: 70m
    exp_samples: []
  alert_rule_test:
  - eval_time: 70m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
  - eval_time: 70m
    alertname: TestLookupAPIObjectiveDataUnavailable
    exp_alerts: []
- name: fast burn requires adopted scope and resolves on short-window recovery
  interval: 1m
  input_series:
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: 0+980x65 64700+1000x24
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+20x65 1300x24
  - series: testlookup:api_objective_adopted{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",owner="api-team"}
    values: 1x500
  alert_rule_test:
  - eval_time: 59m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
  - eval_time: 63m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: &id003
    - exp_labels:
        installation: site-a
        environment: production
        cluster: lab
        namespace: prod
        objective: api_availability
        owner: api-team
        severity: critical
        category: objective
      exp_annotations: &id001
        summary: Adopted API objective is consuming error budget quickly
        description: Both the long and short windows exceed the proposed page burn threshold with at least
          three estimated bad attempts in the short window. Scope and owner come from the explicitly adopted
          policy. This covers completed eligible API attempts; censored in-flight requests require independent
          availability monitoring.
        runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/api-objectives.md
  - eval_time: 75m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
- name: unadopted placeholder owner and differently scoped policy never enable paging
  interval: 1m
  input_series:
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: '0x90'
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+1000x90
  - series: testlookup:api_objective_adopted{installation="site-a",environment="production",cluster="other",namespace="prod",objective="api_availability",owner="other-team"}
    values: 1x500
  - series: testlookup:api_objective_adopted{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",owner="UNASSIGNED"}
    values: 1x500
  alert_rule_test:
  - eval_time: 70m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
- name: one estimated short-window failure cannot page a quiet fleet
  interval: 1m
  input_series:
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
    values: 1x90
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="good"}
    values: '0x90'
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+0.2x90
  - series: testlookup:api_objective_adopted{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",owner="api-team"}
    values: 1x500
  alert_rule_test:
  - eval_time: 70m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
- name: medium burn pages only after six-hour coverage and resolves
  interval: 1m
  input_series:
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x420
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_availability",job="testlookup-backend",instance="a"}
