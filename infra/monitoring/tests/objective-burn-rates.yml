- name: latency uses its distinct five-percent proposed budget and recovers
  interval: 1m
  input_series:
  - series: up{cluster="lab",namespace="prod",job="testlookup-backend",instance="a"}
    values: 1x160
  - series: testlookup_api_sli_configured{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_latency",job="testlookup-backend",instance="a"}
