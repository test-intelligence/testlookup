      exp_labels:
        category: objective
        cluster: lab
        environment: production
        installation: site-a
        namespace: prod
        objective: api_latency
        owner: api-team
        severity: critical
  - eval_time: 155m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
  promql_expr_test:
  - eval_time: 63m
    expr: testlookup:api_sli_burn_rate{window="1h"}
    exp_samples:
    - labels: testlookup:api_sli_burn_rate{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_latency",window="1h"}
      value: 0.39999999999999997
group_eval_order:
- testlookup.api-objectives
- testlookup.api-objectives-slow
- testlookup.api-objective-alerts
