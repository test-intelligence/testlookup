  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_latency",job="testlookup-backend",instance="a",outcome="good"}
    values: 0+980x70 68800+200x74 84600+1000x15
  - series: testlookup_api_journey_events_total{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_latency",job="testlookup-backend",instance="a",outcome="bad"}
    values: 0+20x70 2200+800x74 61400x15
  - series: testlookup:api_objective_adopted{installation="site-a",environment="production",cluster="lab",namespace="prod",objective="api_latency",owner="api-team"}
    values: 1x500
  alert_rule_test:
  - eval_time: 63m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts: []
  - eval_time: 140m
    alertname: TestLookupAPIObjectiveBudgetBurnPage
    exp_alerts:
    - exp_annotations:
        description: Both the long and short windows exceed the proposed page burn threshold with at least
          three estimated bad attempts in the short window. Scope and owner come from the explicitly adopted
          policy. This covers completed eligible API attempts; censored in-flight requests require independent
