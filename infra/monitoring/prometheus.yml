# TestLookup — Prometheus scrape configuration
# Used by the Prometheus service in docker-compose.monitoring.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'testlookup'

rule_files:
  - "rules/*.yml"

scrape_config_files:
  - backend-scrape.yml
  - telemetry-scrape-*.yml

scrape_configs:
  # ── Celery worker (via prometheus-client multiprocess) ───────────────────────
  # Each prefork worker container aggregates its children on port 9100.
  - job_name: 'testlookup-worker'
    static_configs:
      - targets: ['worker:9100']
        labels:
          telemetry_profile: compose
          telemetry_role: worker
      - targets: ['worker-children:9100']
        labels:
          telemetry_profile: compose
          telemetry_role: worker-children
    metrics_path: /metrics
    scrape_interval: 30s

  # ── Prometheus itself ────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Opt-in site-operated host and PostgreSQL exporter jobs use the
  # telemetry-scrape-*.yml include. See docs/operations/infrastructure-exporters.md.
