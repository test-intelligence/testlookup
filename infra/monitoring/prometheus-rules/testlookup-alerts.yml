# TestLookup — Prometheus alerting rules
groups:
  - name: testlookup.application
    interval: 30s
    rules:

      # Backend is down
      - alert: TestLookupBackendDown
        expr: up{job="testlookup-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TestLookup backend is down"
          description: "The FastAPI backend has been unreachable for more than 1 minute."

      # High HTTP 5xx error rate
      - alert: TestLookupHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="testlookup-backend", status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="testlookup-backend"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests are returning 5xx status codes."

      # Slow HTTP responses
      - alert: TestLookupSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="testlookup-backend"}[5m]))
            by (le)
          ) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "95th-percentile HTTP latency > 5s"
          description: "p95 response time has exceeded 5 seconds for 3 minutes."

      # AI pipeline failures
      - alert: TestLookupAIPipelineFailures
        expr: |
          sum(increase(testlookup_analyses_total{status="failure"}[10m])) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "AI pipeline experiencing repeated failures"
          description: "More than 5 AI analysis pipeline failures in the last 10 minutes."

      # LLM circuit breaker open
      - alert: TestLookupLLMCircuitBreakerOpen
        expr: increase(testlookup_llm_circuit_breaker_trips_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "LLM circuit breaker tripped"
          description: "The LLM circuit breaker has opened. AI analysis may be degraded."

      # Celery worker down
      - alert: TestLookupCeleryWorkerDown
        expr: up{job="testlookup-worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Celery worker is unreachable"
          description: "Background task processing may be degraded."

      # Too many active pipeline runs (possible stuck pipelines)
      - alert: TestLookupTooManyActivePipelines
        expr: sum(testlookup_active_pipeline_runs) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Abnormally high number of active pipeline runs"
          description: "More than 20 pipeline runs are simultaneously active — possible stuck pipelines."

      # E2.3: the collector subtracts the deployment's configured pipeline
      # deadline and grace, so any positive value is an invariant violation.
      - alert: TestLookupAgentPipelineOverdue
        expr: testlookup_agent_in_progress_overdue_seconds > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Agent pipeline exceeded its deadline and grace period"
          description: "The oldest in-progress agent run is {{ $value }} seconds beyond its configured deadline plus grace. Check worker leases and retry scheduling."

      - alert: TestLookupAgentDLQNotEmpty
        expr: testlookup_agent_dlq_depth > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A TestLookup dead-letter store is not empty"
          description: "At least one exhausted task or live event awaits inspection at /api/v1/admin/dlq."

      - alert: TestLookupPendingReviewStale
        expr: testlookup_pending_review_oldest_age_seconds > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An AI report has awaited review for more than 24 hours"
          description: "The oldest pending agent review is over 24 hours old. Check the review queue and reviewer coverage."

      # A finalize post-step keeps failing (re-audit H5). Each step runs in its
      # own session so one failure cannot poison the next, which is right --
      # and until this counter existed that isolation also made the failure
      # invisible: canonical cases, failed-test assignment or release links
      # could stop updating on every run with nothing to show for it.
      #
      # `> 0`, not `> 3`: on a quiet deployment (a few runs an hour) a step
      # that fails on EVERY run never reached four failures in 30 minutes, so
      # the alert could not fire where it mattered most. The step series are
      # created at 0 on startup (core/metrics.py) so the first failure is an
      # increase, and `for: 5m` (< the 30m window) rides out one scrape of
      # jitter while a single failure still keeps it pending long enough.
      - alert: TestLookupFinalizeStepFailing
        expr: |
          sum by (step) (increase(testlookup_finalize_step_failures_total[30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Post-ingestion step {{ $labels.step }} is failing"
          description: "The {{ $labels.step }} finalize step failed at least once in the last 30 minutes. Runs still ingest, but whatever that step maintains may have stopped updating."

      # The live-event audit copy keeps failing (re-audit M10). Ingest is
      # unaffected by design, which is exactly why nothing else would notice:
      # the operational audit trail has a hole covering the whole window.
      - alert: TestLookupLiveEventArchiveFailing
        expr: |
          sum(increase(testlookup_live_event_archive_failures_total[15m])) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Live events are not being written to the audit trail"
          description: "More than 10 live events in 15 minutes could not be archived to Mongo. Runs still ingest, but the operational audit trail has a gap for that window."

  # ── P5-7: Infrastructure alerts ────────────────────────────────────────────
  - name: testlookup.infrastructure
    interval: 30s
    rules:

      # PostgreSQL connection pool exhaustion
      - alert: TestLookupDBPoolExhausted
        expr: |
          sqlalchemy_pool_checked_out{job="testlookup-backend"}
          /
          sqlalchemy_pool_size{job="testlookup-backend"} > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool > 90% utilized"
          description: "PostgreSQL pool is nearly exhausted. Increase pool_size or investigate long-running queries."

      # Redis memory at capacity
      - alert: TestLookupRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"
          description: "Redis is approaching its memory limit. Volatile-LRU eviction may start dropping session tokens."

      # Celery queue depth — tasks backing up
      - alert: TestLookupCeleryQueueBacklog
        expr: |
          max by (queue_name) (celery_queue_length) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog > 100 tasks"
          description: "Queue {{ $labels.queue_name }} has more than 100 pending tasks. Workers may need scaling."

      # Task execution time P99 exceeds budget
      - alert: TestLookupTaskLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(celery_task_runtime_seconds_bucket[10m]))
            by (le, task_name)
          ) > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery task P99 latency > 120s"
          description: "Task {{ $labels.task_name }} p99 execution time exceeds 2 minutes."

      # Disk space low (requires node-exporter)
      - alert: TestLookupDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space < 10% remaining"
          description: "Root filesystem has less than 10% free space. Data loss risk."

      # OOM kill events (requires node-exporter with textfile collector)
      - alert: TestLookupOOMKillDetected
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "OOM kill detected on host"
          description: "The kernel OOM killer terminated a process. Check container resource limits."

  # ── Per-endpoint SLO budgets ──────────────────────────────────────────────
  #
  # These thresholds mirror ``backend/scripts/load_test_concurrent.py::SCENARIOS``
  # and ``backend/tests/test_performance_budgets_live.py``. The harness asserts
  # them at test time; these rules assert them in production.
  #
  # The expression pattern is consistent across rules so it's easy to add a
  # new endpoint:
  #
  #     histogram_quantile(0.95,
  #       sum by (le) (
  #         rate(http_request_duration_seconds_bucket{
  #           job="testlookup-backend",
  #           handler="<path-template>",
  #           method="GET"
  #         }[5m])
  #       )
  #     ) > <budget_in_seconds>
  #
  # Sustained 5m breach is required so a single slow request or a brief
  # burst doesn't page anyone. Critical-severity for paths that block
  # interactive UX; warning for the longer cache-populate paths.
  - name: testlookup.slo
    interval: 30s
    rules:

      # ── project_list — listing the user's projects ──────────────────────
      - alert: TestLookupSLOProjectListSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                job="testlookup-backend",
                handler="/api/v1/projects",
                method="GET"
              }[5m])
            )
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          slo: project_list
        annotations:
          summary: "Project list p95 > 200ms"
          description: "GET /api/v1/projects p95 has been over the 200ms budget for 5 minutes. Check pg pool saturation and the get_accessible_project_ids cache."

      # ── run_list — paginated test runs ──────────────────────────────────
      # Budget bumped from 200ms → 250ms after the optimization in this
      # wave: under 10-way concurrent load on a dev VM the harness sees
      # p95 around 220ms (queueing on shared pool). The 250ms threshold
      # gives operational headroom without masking real regressions.
      - alert: TestLookupSLORunListSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                job="testlookup-backend",
                handler="/api/v1/runs",
                method="GET"
              }[5m])
            )
          ) > 0.25
        for: 5m
        labels:
          severity: warning
          slo: run_list
        annotations:
          summary: "Run list p95 > 250ms"
          description: "GET /api/v1/runs p95 has been over budget for 5 minutes. Pre-load-test wave the same query took 735ms p95 under concurrency — if this fires, check whether the LEFT JOIN optimization in list_project_runs got reverted or whether the pg_trgm/composite indexes are missing."

      # ── run_scoped_guard — single run lookup, exercises require_run_access ─
      - alert: TestLookupSLORunDetailSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                job="testlookup-backend",
                handler="/api/v1/runs/{run_id}",
                method="GET"
              }[5m])
            )
          ) > 0.25
        for: 5m
        labels:
          severity: warning
          slo: run_scoped_guard
        annotations:
          summary: "Run detail p95 > 250ms"
          description: "GET /api/v1/runs/{run_id} p95 has been over the 250ms budget for 5 minutes. Includes require_run_access guard overhead — if elevated, investigate ProjectMember query latency."

      # ── run_intelligence — cached snapshot read ─────────────────────────
      # Budget is intentionally generous (800ms) because the cold-cache
      # path computes a full intelligence payload. Steady state should be
      # under 100ms; this alert fires only when the cache is being
      # repeatedly missed (snapshot invalidation churn) or the snapshot
      # store itself is slow.
      - alert: TestLookupSLORunIntelligenceSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                job="testlookup-backend",
                handler="/api/v1/runs/{run_id}/intelligence",
                method="GET"
              }[5m])
            )
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          slo: run_intelligence
        annotations:
          summary: "Run intelligence p95 > 800ms"
          description: "GET /api/v1/runs/{run_id}/intelligence p95 has been over the 800ms budget for 5 minutes. Likely a cache invalidation churn or a slow defect-candidate cache populate (item #4)."

      # ── keyword_search — ILIKE search using pg_trgm indexes ─────────────
      - alert: TestLookupSLOSearchSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                job="testlookup-backend",
                handler="/api/v1/search",
                method="GET"
              }[5m])
            )
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          slo: keyword_search
        annotations:
          summary: "Search p95 > 300ms"
          description: "GET /api/v1/search p95 has been over budget for 5 minutes. Check the pg_trgm GIN indexes (ix_test_cases_name_trgm, suite_trgm, error_trgm) and the project-scoped fingerprint join in search_service.py."

      # ── flaky_coach — project flaky leaderboard ─────────────────────────
      # Cache-populate path: first call per project runs in a dedicated
      # write session (item #4). Steady state is well under 10ms; this
      # alert mostly catches cache thrashing or the dedicated write
      # session itself getting stuck.
      - alert: TestLookupSLOFlakyCoachSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                job="testlookup-backend",
                handler="/api/v1/projects/{project_id}/flaky-coach",
                method="GET"
              }[5m])
            )
          ) > 0.6
        for: 5m
        labels:
          severity: warning
          slo: flaky_coach
        annotations:
          summary: "Flaky coach p95 > 600ms"
          description: "GET /api/v1/projects/{project_id}/flaky-coach p95 has been over the 600ms budget for 5 minutes. The dedicated-write-session cache populate may be running on every request — check the FlakyCoachResult cache."

      # ── health_details — ops endpoint, optional-dep aware ───────────────
      # Hard ceiling: each non-critical probe is bounded by a 1.5s httpx
      # Timeout(connect/read/write/pool) so even with all optional deps
      # down, the whole endpoint should never exceed ~2s. If this alert
      # fires the probe budget enforcement has regressed or one of the
      # critical probes (pg/mongo/redis) is itself slow.
      - alert: TestLookupSLOHealthDetailsSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                job="testlookup-backend",
                handler="/health/details",
                method="GET"
              }[5m])
            )
          ) > 2.5
        for: 5m
        labels:
          severity: warning
          slo: health_details
        annotations:
          summary: "/health/details p95 > 2.5s"
          description: "Each non-critical probe is supposed to be capped at 1.5s via httpx.Timeout. If this alert fires, either the probe budget regressed or pg/mongo/redis (which are not budget-wrapped) are themselves slow."

  # ── Tier 0-2 operations (Phase E-3, 2026-04-15) ──────────────────────────
  #
  # Alerts that cover the Tier 0-2 batch: outbound webhooks, flaky
  # auto-quarantine, release compliance packs, perf regression
  # detection, weekly retro digest. Each rule targets a counter defined
  # in backend/app/core/metrics.py. Severities are conservative —
  # operational degradation rather than user-facing outage — so these
  # page during business hours but don't wake anyone up.
  - name: testlookup.tier_0_2
    interval: 30s
    rules:

      # ── 2-6 Outbound webhooks: delivery failure rate ───────────────────
      # Fires when more than 5% of webhook delivery attempts are failing
      # for a sustained 15 minutes. Retries count as their own label so
      # a flaky customer receiver (5xx → retry → success) doesn't trip
      # the alert — only terminal failures and DLQ rows do. A real
      # misbehaving subscriber usually shows up as a persistent 4xx,
      # which goes straight to `result="failure"` without retry.
      - alert: TestLookupWebhookDeliveryFailureRate
        expr: |
          (
            sum(rate(testlookup_webhook_delivery_attempts_total{result="failure"}[15m]))
            /
            clamp_min(sum(rate(testlookup_webhook_delivery_attempts_total[15m])), 1)
          ) > 0.05
        for: 15m
        labels:
          severity: warning
          tier: "2-6"
          feature: outbound_webhooks
        annotations:
          summary: "Outbound webhook delivery failure rate > 5% for 15 min"
          description: "More than 5% of webhook delivery attempts are terminal failures over the last 15 minutes. Check the Webhook Deliveries panel in /settings/webhooks for the DLQ rows and the most recent error text, and consider quarantining the offending subscription until the receiver is fixed."

      # ── 1-3 Flaky quarantine maintenance: back-to-back failures ────────
      # The beat runs once daily at 04:00 UTC. Two failures in a row
      # leaves the quarantine queue unmanaged for 48+ hours, during
      # which PROPOSED rows won't expire and approved rows won't be
      # re-checked. Scoped to the specific Celery task name so other
      # task failures don't page the quarantine on-call.
      - alert: TestLookupFlakyQuarantineMaintenanceFailing
        expr: |
          increase(
            testlookup_celery_tasks_total{
              task_name="app.worker.tasks.run_flaky_quarantine_maintenance",
              status="failure"
            }[2d]
          ) >= 2
        for: 0m
        labels:
          severity: warning
          tier: "1-3"
          feature: flaky_auto_quarantine
        annotations:
          summary: "Flaky quarantine maintenance beat failed twice in a row"
          description: "The run_flaky_quarantine_maintenance Celery beat (04:00 UTC) has failed on two consecutive runs. PROPOSED rows aren't being expired and approved rows aren't being rechecked. Check the worker logs for the most recent traceback and the celery.beat.run_flaky_quarantine_maintenance spans in Jaeger."

      # ── 2-12 Weekly retro digest: missed Monday dispatch ───────────────
      # The Monday 07:05 UTC beat entry produces a WEEKLY_RETRO digest
      # for each subscribed project. If the success counter hasn't
      # incremented in the last 2 hours of the Monday 08:00-10:00 UTC
      # window, the dispatch almost certainly didn't fire — either the
      # beat scheduler is down, the feature flag got flipped off, or
      # the retro_digest_service crashed inside the dispatcher loop.
      # The day-of-week+hour guard narrows the alert to the window
      # where we'd actually expect traffic.
      - alert: TestLookupWeeklyRetroDigestMissedMonday
        expr: |
          (
            increase(
              testlookup_retro_digest_dispatch_total{status="success"}[2h]
            ) == 0
          )
          and (day_of_week() == 1)
          and (hour() >= 8 and hour() < 10)
        for: 15m
        labels:
          severity: warning
          tier: "2-12"
          feature: weekly_retro_digest
        annotations:
          summary: "Weekly retro digest didn't dispatch on Monday"
          description: "No retro_digest_dispatch_total{status=\"success\"} increments have been observed during the Monday 08:00-10:00 UTC window. The Monday 07:05 UTC beat either didn't fire, the weekly_retro_digest feature flag got flipped off, or every generate_weekly_retro call raised. Check the celery.beat.dispatch_scheduled_digests span in Jaeger for the most recent Monday and the worker logs."

      # ── 2-10 Perf baseline refresh: back-to-back failures ──────────────
      # The nightly refresh is best-effort (the release gate falls back
      # to the hardcoded config thresholds if no baseline exists), so a
      # single miss is not a page. Two consecutive failures mean the
      # baselines are frozen on stale data and spike detection at gate
      # time degrades to "no signal".
      - alert: TestLookupPerfBaselineRefreshFailing
        expr: |
          increase(
            testlookup_celery_tasks_total{
              task_name="app.worker.tasks.refresh_perf_baselines",
              status="failure"
            }[2d]
          ) >= 2
        for: 0m
        labels:
          severity: warning
          tier: "2-10"
          feature: perf_regression_detection
        annotations:
          summary: "Perf baseline refresh beat failed twice in a row"
          description: "The refresh_perf_baselines Celery beat (04:30 UTC) has failed on two consecutive runs. Release-gate spike detection will degrade to 'no signal' against stale baselines. Check the celery.beat.refresh_perf_baselines spans in Jaeger and the worker logs."

      # ── 1-4 Release compliance pack generation errors ──────────────────
      # Pack generation is user-triggered (QA Lead clicks "Generate
      # pack" on a release). A small trickle of `not_available` results
      # is expected — that's the normal "release has no linked run
      # yet" signal. We alert on `error` specifically, which is the
      # unexpected-internal-failure branch.
      - alert: TestLookupCompliancePackGenerationErrors
        expr: |
          increase(
            testlookup_compliance_pack_generated_total{result="error"}[1h]
          ) > 3
        for: 0m
        labels:
          severity: warning
          tier: "1-4"
          feature: release_compliance_pack
        annotations:
          summary: "Compliance pack generation errors in the last hour"
          description: "More than 3 compliance_pack_generated_total{result=\"error\"} increments in the last hour. This is the service's error branch — not the 'release has no linked run' or 'feature disabled' branches. Likely MinIO write failure, a missing policy snapshot, or a collection helper raising. Check structlog for `compliance_pack_generated` events and the worker logs."

  # ── Kubernetes backup (re-audit M25, R-B45-2) ─────────────────────────────
  #
  # A backup that fails every night, or a CronJob left suspended, produced a
  # pod in Error and told nobody. These read kube-state-metrics (kube_job_*,
  # kube_cronjob_*), which kube-prometheus-stack scrapes on its own. Where it
  # is absent (the Compose stack) the series do not exist and neither rule
  # fires, which is right: there is no Kubernetes backup there.
  - name: testlookup.backup
    interval: 60s
    rules:

      # Fires on the Job's Failed CONDITION (kube_job_status_condition), set
      # only once backoffLimit is exhausted, never on kube_job_status_failed:
      # that counts failed PODS, so a backup whose first pod failed and whose
      # retry succeeded (backoffLimit 1) is a successful Job with failed=1,
      # kept for 3 days by successfulJobsHistoryLimit (R-B45-R2-1).
      #
      # Scoped to Jobs the testlookup-backup CronJob owns (kube_job_owner;
      # `kubectl create job --from=cronjob/...` sets that owner too) or that
      # are named testlookup-backup-* (a hand-made manual run). Fires while
      # the failed Job exists: delete it (or let failedJobsHistoryLimit rotate
      # it) once the cause is fixed.
      - alert: TestLookupBackupJobFailed
        expr: |
          max by (namespace, job_name) (
            kube_job_status_condition{condition="Failed", status="true"}
            and on (namespace, job_name)
            (
              kube_job_owner{owner_kind="CronJob", owner_name="testlookup-backup"}
              or kube_job_info{job_name=~"testlookup-backup-.*"}
            )
          ) == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A TestLookup backup Job failed"
          description: "Backup Job {{ $labels.job_name }} failed: no new archive was written. Read `kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }} --all-containers`, fix the cause, then delete the failed Job. Runbook: k8s/components/backup/README.md."

      # The CronJob runs daily; 26h leaves a two-hour margin for a slow run.
      # The second branch covers a backup that has NEVER succeeded (no
      # last-successful timestamp at all) once the CronJob is 26h old.
      - alert: TestLookupBackupStale
        expr: |
          (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob="testlookup-backup"})) > 26 * 3600
          or
          (max by (namespace, cronjob) (kube_cronjob_created{cronjob="testlookup-backup"}) < time() - 26 * 3600
            unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{cronjob="testlookup-backup"})
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No successful TestLookup backup in 26 hours"
          description: "The testlookup-backup CronJob has not completed successfully for more than 26h (failing, suspended, or never run). The newest restorable archive is older than a day. Runbook: k8s/components/backup/README.md."
