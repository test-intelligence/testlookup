# Optional proposed API objectives, outside the default rules/*.yml glob.
# Load one inert example or reviewed site adoption policy.
# Minute-level validity is rolled into lossless complete five-minute checkpoints.
# Heavy 3d/30d counter queries run every five minutes; inspect their as-of time.
groups:
- name: testlookup.api-objectives
  interval: 1m
  rules:
  - record: testlookup:api_sli_valid
    expr: (count by (installation, environment, cluster, namespace, objective) (testlookup_api_sli_configured{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency"}
      == 1) == on (installation, environment, cluster, namespace, objective) count by (installation, environment, cluster,
      namespace, objective) ((testlookup_api_sli_configured{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency"}
      == 1) and on (installation, environment, cluster, namespace, objective, job, instance) (count by (installation, environment,
      cluster, namespace, objective, job, instance) (testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome=~"good|bad"})
      == 2) and on (cluster, namespace, job, instance) (up{job="testlookup-backend"} == 1))) >
      bool 0
  - record: testlookup:api_sli_error_budget_ratio
    expr: testlookup:api_sli_valid{objective="api_availability"} * 0.001 or testlookup:api_sli_valid{objective="api_latency"}
      * 0.05
  - record: testlookup:api_sli_window_coverage
    expr: clamp_max(count_over_time(testlookup:api_sli_valid[6m]) / 6, 1)
    labels:
      window: 5m
  - record: testlookup:api_sli_window_complete
    expr: (testlookup:api_sli_window_coverage{window="5m"} >= 1) and on (installation, environment, cluster, namespace, objective)
      (testlookup:api_sli_valid == 1)
    labels:
      window: 5m
  - record: testlookup:api_sli_eligible_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome=~"good|bad"}[5m]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="5m"}
    labels:
      window: 5m
  - record: testlookup:api_sli_bad_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome="bad"}[5m]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="5m"}
    labels:
      window: 5m
  - record: testlookup:api_sli_error_ratio
    expr: testlookup:api_sli_bad_events{window="5m"} / on (installation, environment, cluster, namespace, objective, window)
      (testlookup:api_sli_eligible_events{window="5m"} > 0)
    labels:
      window: 5m
  - record: testlookup:api_sli_burn_rate
    expr: testlookup:api_sli_error_ratio{window="5m"} / on (installation, environment, cluster, namespace, objective) group_left
      testlookup:api_sli_error_budget_ratio
    labels:
      window: 5m
  - record: testlookup:api_sli_window_coverage
    expr: clamp_max(count_over_time(testlookup:api_sli_valid[31m]) / 31, 1)
    labels:
      window: 30m
  - record: testlookup:api_sli_window_complete
    expr: (testlookup:api_sli_window_coverage{window="30m"} >= 1) and on (installation, environment, cluster, namespace, objective)
      (testlookup:api_sli_valid == 1)
    labels:
      window: 30m
  - record: testlookup:api_sli_eligible_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome=~"good|bad"}[30m]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="30m"}
    labels:
      window: 30m
  - record: testlookup:api_sli_bad_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome="bad"}[30m]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="30m"}
    labels:
      window: 30m
  - record: testlookup:api_sli_error_ratio
    expr: testlookup:api_sli_bad_events{window="30m"} / on (installation, environment, cluster, namespace, objective, window)
      (testlookup:api_sli_eligible_events{window="30m"} > 0)
    labels:
      window: 30m
  - record: testlookup:api_sli_burn_rate
    expr: testlookup:api_sli_error_ratio{window="30m"} / on (installation, environment, cluster, namespace, objective) group_left
      testlookup:api_sli_error_budget_ratio
    labels:
      window: 30m
  - record: testlookup:api_sli_window_coverage
    expr: clamp_max(count_over_time(testlookup:api_sli_valid[61m]) / 61, 1)
    labels:
      window: 1h
  - record: testlookup:api_sli_window_complete
    expr: (testlookup:api_sli_window_coverage{window="1h"} >= 1) and on (installation, environment, cluster, namespace, objective)
      (testlookup:api_sli_valid == 1)
    labels:
      window: 1h
  - record: testlookup:api_sli_eligible_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome=~"good|bad"}[1h]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="1h"}
    labels:
      window: 1h
  - record: testlookup:api_sli_bad_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome="bad"}[1h]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="1h"}
    labels:
      window: 1h
  - record: testlookup:api_sli_error_ratio
    expr: testlookup:api_sli_bad_events{window="1h"} / on (installation, environment, cluster, namespace, objective, window)
      (testlookup:api_sli_eligible_events{window="1h"} > 0)
    labels:
      window: 1h
  - record: testlookup:api_sli_burn_rate
    expr: testlookup:api_sli_error_ratio{window="1h"} / on (installation, environment, cluster, namespace, objective) group_left
      testlookup:api_sli_error_budget_ratio
    labels:
      window: 1h
  - record: testlookup:api_sli_window_coverage
    expr: clamp_max(count_over_time(testlookup:api_sli_valid[361m]) / 361, 1)
    labels:
      window: 6h
  - record: testlookup:api_sli_window_complete
    expr: (testlookup:api_sli_window_coverage{window="6h"} >= 1) and on (installation, environment, cluster, namespace, objective)
      (testlookup:api_sli_valid == 1)
    labels:
      window: 6h
  - record: testlookup:api_sli_eligible_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome=~"good|bad"}[6h]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="6h"}
    labels:
      window: 6h
  - record: testlookup:api_sli_bad_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome="bad"}[6h]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="6h"}
    labels:
      window: 6h
  - record: testlookup:api_sli_error_ratio
    expr: testlookup:api_sli_bad_events{window="6h"} / on (installation, environment, cluster, namespace, objective, window)
      (testlookup:api_sli_eligible_events{window="6h"} > 0)
    labels:
      window: 6h
  - record: testlookup:api_sli_burn_rate
    expr: testlookup:api_sli_error_ratio{window="6h"} / on (installation, environment, cluster, namespace, objective) group_left
      testlookup:api_sli_error_budget_ratio
    labels:
      window: 6h
  - record: testlookup:api_sli_window_coverage
    expr: clamp_max(count_over_time(testlookup:api_sli_valid[4321m]) / 4321, 1)
    labels:
      window: 3d
  - record: testlookup:api_sli_window_complete
    expr: (testlookup:api_sli_window_coverage{window="3d"} >= 1) and on (installation, environment, cluster, namespace, objective)
      (testlookup:api_sli_valid == 1)
    labels:
      window: 3d
- name: testlookup.api-objectives-slow
  interval: 5m
  rules:
  - record: testlookup:api_sli_five_minute_checkpoint
    expr: max without (window) (testlookup:api_sli_window_complete{window="5m"} == 1)
  - record: testlookup:api_sli_window_coverage
    expr: clamp_max(count_over_time(testlookup:api_sli_five_minute_checkpoint[30d]) / 8640, 1)
    labels:
      window: 30d
  - record: testlookup:api_sli_window_complete
    expr: (testlookup:api_sli_window_coverage{window="30d"} >= 1) and on (installation, environment, cluster, namespace, objective)
      (testlookup:api_sli_valid == 1)
    labels:
      window: 30d
  - record: testlookup:api_sli_eligible_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome=~"good|bad"}[3d]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="3d"}
    labels:
      window: 3d
  - record: testlookup:api_sli_bad_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome="bad"}[3d]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="3d"}
    labels:
      window: 3d
  - record: testlookup:api_sli_error_ratio
    expr: testlookup:api_sli_bad_events{window="3d"} / on (installation, environment, cluster, namespace, objective, window)
      (testlookup:api_sli_eligible_events{window="3d"} > 0)
    labels:
      window: 3d
  - record: testlookup:api_sli_burn_rate
    expr: testlookup:api_sli_error_ratio{window="3d"} / on (installation, environment, cluster, namespace, objective) group_left
      testlookup:api_sli_error_budget_ratio
    labels:
      window: 3d
  - record: testlookup:api_sli_eligible_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome=~"good|bad"}[30d]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="30d"}
    labels:
      window: 30d
  - record: testlookup:api_sli_bad_events
    expr: sum by (installation, environment, cluster, namespace, objective) (increase(testlookup_api_journey_events_total{job="testlookup-backend",installation!="",environment!="",objective=~"api_availability|api_latency",outcome="bad"}[30d]))
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="30d"}
    labels:
      window: 30d
  - record: testlookup:api_sli_error_ratio
    expr: testlookup:api_sli_bad_events{window="30d"} / on (installation, environment, cluster, namespace, objective, window)
      (testlookup:api_sli_eligible_events{window="30d"} > 0)
    labels:
      window: 30d
  - record: testlookup:api_sli_burn_rate
    expr: testlookup:api_sli_error_ratio{window="30d"} / on (installation, environment, cluster, namespace, objective) group_left
      testlookup:api_sli_error_budget_ratio
    labels:
      window: 30d
  - record: testlookup:api_sli_budget_observed_at_seconds
    expr: testlookup:api_sli_error_ratio{window="30d"} * 0 + time()
- name: testlookup.api-objective-alerts
  interval: 1m
  rules:
  - record: testlookup:api_sli_remaining_error_budget_ratio
    expr: (1 - testlookup:api_sli_burn_rate{window="30d"}) and on (installation, environment, cluster, namespace, objective)
      testlookup:api_sli_window_complete{window="30d"} and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="5m"}
  - record: testlookup:api_objective_active
    expr: (testlookup:api_objective_adopted{owner!="",owner!="UNASSIGNED"} == 1) and on (installation, environment, cluster, namespace, objective)
      (count by (installation, environment, cluster, namespace, objective) (testlookup:api_objective_adopted{owner!="",owner!="UNASSIGNED"} ==
      1) == 1)
  - alert: TestLookupAPIObjectiveBudgetBurnPage
    expr: (max by (installation, environment, cluster, namespace, objective) ((testlookup:api_sli_burn_rate{window="1h"} >
      14.4) and ignoring (window) (testlookup:api_sli_burn_rate{window="5m"} > 14.4) and ignoring (window) (testlookup:api_sli_bad_events{window="5m"}
      >= 3) and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="1h"}
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="5m"}) or
      max by (installation, environment, cluster, namespace, objective) ((testlookup:api_sli_burn_rate{window="6h"} > 6) and
      ignoring (window) (testlookup:api_sli_burn_rate{window="30m"} > 6) and ignoring (window) (testlookup:api_sli_bad_events{window="30m"}
      >= 3) and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="6h"}
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="30m"}))
      * on (installation, environment, cluster, namespace, objective) group_left (owner) testlookup:api_objective_active
    for: 2m
    labels:
      severity: critical
      category: objective
    annotations:
      summary: Adopted API objective is consuming error budget quickly
      description: Both the long and short windows exceed the proposed page burn threshold with at least three estimated bad
        attempts in the short window. Scope and owner come from the explicitly adopted policy. This covers completed eligible
        API attempts; censored in-flight requests require independent availability monitoring.
      runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/api-objectives.md
  - alert: TestLookupAPIObjectiveBudgetBurnTicket
    expr: (max by (installation, environment, cluster, namespace, objective) ((testlookup:api_sli_burn_rate{window="3d"} >
      1) and ignoring (window) (testlookup:api_sli_burn_rate{window="6h"} > 1) and ignoring (window) (testlookup:api_sli_bad_events{window="6h"}
      >= 3) and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="3d"}
      and on (installation, environment, cluster, namespace, objective) testlookup:api_sli_window_complete{window="6h"}))
      * on (installation, environment, cluster, namespace, objective) group_left (owner) testlookup:api_objective_active
    for: 15m
    labels:
      severity: warning
      category: objective
    annotations:
      summary: Adopted API objective has sustained error budget burn
      description: Both the three-day and six-hour windows exceed one times the proposed error budget burn, with at least
        three estimated bad attempts in the short window. Inspect the scoped objective and route diagnostics before changing
        the policy.
      runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/api-objectives.md
  - alert: TestLookupAPIObjectiveDataUnavailable
    expr: testlookup:api_objective_active unless on (installation, environment, cluster, namespace, objective) (testlookup:api_sli_valid
      == 1)
    for: 5m
    labels:
      severity: warning
      category: objective
    annotations:
      summary: Adopted API objective measurement is unavailable
      description: The adopted scope lacks a complete current pair of outcome counters on every observed configured API target,
        or a configured target is down. Quiet eligible traffic does not trigger this alert. Restore measurement before assessing
        compliance; independent scrape-discovery alerts cover vanished targets.
      runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/api-objectives.md
  - alert: TestLookupAPIObjectivePolicyAmbiguous
    expr: count by (installation, environment, cluster, namespace, objective) (testlookup:api_objective_adopted{owner!="",owner!="UNASSIGNED"}
      == 1) > 1
    for: 5m
    labels:
      severity: warning
      category: objective
    annotations:
      summary: Multiple API objective owners are active in one scope
      description: More than one adopted policy matches the same installation, environment, cluster, namespace and objective.
        Objective paging is disabled for the ambiguous scope until exactly one reviewed policy remains.
      runbook_url: https://github.com/test-intelligence/testlookup/blob/main/docs/operations/api-objectives.md
