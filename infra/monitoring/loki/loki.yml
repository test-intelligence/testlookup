# Private, single-process reference profile. Loki has no authentication layer:
# expose it only to the collector/Grafana on the dedicated internal network.
target: all
auth_enabled: false
analytics:
  reporting_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache

ingester:
  lifecycler:
    min_ready_duration: 1s
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem

limits_config:
  retention_period: 168h
  deletion_mode: disabled
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  max_structured_metadata_size: 16KB
  max_structured_metadata_entries_count: 32
  # Only these OTLP resource attributes become stream/index labels. IDs,
  # per-instance identity and bounded application role remain metadata.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment.name
  ingestion_rate_strategy: local
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  per_stream_rate_limit: 512KB
  per_stream_rate_limit_burst: 1MB
  max_global_streams_per_user: 500
  max_line_size: 64KB
  max_line_size_truncate: false
  max_label_names_per_series: 3
  max_query_lookback: 168h
  max_query_length: 168h
  max_query_series: 500
  max_entries_limit_per_query: 1000
  max_query_parallelism: 4
  query_timeout: 30s
  shard_streams:
    enabled: false

querier:
  max_concurrent: 2
frontend:
  max_outstanding_per_tenant: 64
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32
ruler:
  enable_api: false
  rule_path: /loki/rules-temp
  wal:
    dir: /loki/ruler-wal
