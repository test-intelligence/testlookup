# nginx's main configuration for the frontend image (/etc/nginx/nginx.conf).
#
# The image runs nginx as the unprivileged `nginx` user (uid 101) from the
# first process on, so this file differs from the stock one in three ways:
#
#   * no `user` directive: there is no root master process to change user;
#   * the pid file lives in /tmp, which uid 101 can write;
#   * the five temp paths live in /tmp. nginx creates all five at start, also
#     the ones it never uses, and their built-in place (/var/cache/nginx) is
#     owned by root and is read-only when the root filesystem is.
#
# So /tmp and /etc/nginx/conf.d (where the entrypoint renders the server block
# from the template) are the only paths the container writes. Kubernetes
# mounts an emptyDir on each and keeps the rest read-only
# (k8s/base/frontend-deployment.yaml). Pinned by
# backend/tests/regression/test_frontend_runs_unprivileged.py.
worker_processes  auto;

# Level crit, not notice or error: nginx writes the raw request line, the
# upstream URL and the Referer into every error-level message (an upstream
# that refused, a missing file), and that text cannot be reformatted. A report
# share link is a bearer token in the path, so those lines would keep it. The
# access log below records what an operator needs from them instead: the
# status, the upstream's status and its response time.
error_log  /var/log/nginx/error.log crit;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The access log keeps no credential. A request line can carry one:
    #
    #   * a report share link holds its bearer token in the path
    #     (/api/v1/shared/reports/<token>);
    #   * one-time tickets and the OIDC callback's code and state arrive in
    #     the query string;
    #   * a Referer header repeats the URL of the page the request came from.
    #
    # So the log records the method, the path without its query, and no
    # Referer; a share link's path is replaced whole. The share test reads
    # $uri (decoded and normalised by nginx), so an encoded or doubled slash
    # cannot slip a token past it. Pinned by
    # backend/tests/regression/test_nginx_access_log_keeps_no_credentials.py.
    map $uri $log_is_share {
        default                         0;
        ~*^/+api/+v1/+shared/           1;
    }
    map "$log_is_share:$request_uri" $log_path {
        default                         "-";
        ~^1:                            "/api/v1/shared/reports/[REDACTED]";
        "~^0:(?<log_plain_path>[^?]*)"  $log_plain_path;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $log_path $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time us=$upstream_status urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
