<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy — baseline hardening against XSS.

      script-src: strict 'self' — the production bundle is fully self-served
        via Vite and contains no inline scripts.
      style-src: 'unsafe-inline' is required by Tailwind arbitrary values and
        react-hot-toast's dynamic styles. Scoped to 'self' + Google Fonts.
      connect-src: same-origin API + WebSockets only. Anchors to external
        systems (Jira, Confluence) are full page navigations, not fetches,
        so they do not need a connect-src entry.
      img-src: 'self' + data: + blob: + https: — https: covers arbitrary
        gravatars / project logos embedded in user data.
      form-action 'self': block form exfiltration to 3rd-party origins.
      base-uri 'self': prevent <base> tag relative-url hijacking.
      object-src 'none': block Flash / legacy plugin XSS vectors.

      NOTE: ``frame-ancestors`` is deliberately ABSENT here. Browsers ignore it
      in a meta tag and log an error for it on every single page load
      ("The Content Security Policy directive 'frame-ancestors' is ignored
      when delivered via a <meta> element"). It never protected anything from
      this position. Clickjacking protection is now a real response header --
      ``Content-Security-Policy: frame-ancestors 'none'`` plus
      ``X-Frame-Options: DENY`` -- emitted by every nginx config and pinned by
      ``backend/tests/regression/test_frontend_security_headers.py``. Removing
      the dead directive clears constant console noise that would otherwise
      camouflage a genuine CSP violation.

      NOTE: ``upgrade-insecure-requests`` was intentionally removed from the
      meta CSP. When the page is served over plain HTTP (homelab without
      TLS, kubectl port-forward, etc.) that directive forces the browser to
      retry every request as HTTPS, which then has nothing listening and
      the page goes blank. For HTTPS production deployments that want the
      upgrade behavior, set CSP as a real response header in nginx,
      conditional on ``$scheme = https``, so HTTP origins are unaffected.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; form-action 'self'; base-uri 'self'; object-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()" />
    <title>TestLookup — Instant Answers from Your Test Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
