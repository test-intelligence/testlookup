# Public read-only demo ONLY. docker-compose.demo.yml mounts this file into the
# frontend container's /etc/nginx/conf.d/, which nginx includes inside http {},
# so every directive below is inherited by the server and all its locations.
# Normal deployments never load it.

# 1. The real client address.
#    Requests reach nginx from the cloudflared container on testlookup_net
#    (pinned to 172.28.0.0/16 in docker-compose.release.yml). Cloudflare appends
#    the visitor's address to X-Forwarded-For; walking right-to-left past the
#    trusted hops finds it. A forged X-Forwarded-For from the visitor sits to
#    the LEFT of the address Cloudflare appended, so it is never reached.
set_real_ip_from 172.28.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 2. A per-address ceiling on pages and API calls: the second layer behind the
#    Cloudflare rate-limit rule. A dashboard load fires a burst of parallel API
#    calls, hence the generous burst. A script hammering the demo is held to
#    20 requests/s and refused with 429.
#
#    Static files are not counted. A first visit fetches well over a hundred
#    hashed chunks at once, and Cloudflare serves them from its cache only
#    after the first request at each of its locations: a phone on mobile data
#    (live demo, 2026-11-11) sent 142 requests in 10 s and had 38 refused.
#    The files are immutable and cheap to serve, so limiting them protected
#    nothing. nginx does not count a request whose key is empty.
map $uri $demo_limit_key {
    ~*\.(js|mjs|css|map|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf)$  "";
    default                                                         $binary_remote_addr;
}

limit_req_zone $demo_limit_key zone=demo_per_ip:10m rate=20r/s;
limit_req zone=demo_per_ip burst=80 nodelay;
limit_req_status 429;

limit_conn_zone $demo_limit_key zone=demo_conn:10m;
limit_conn demo_conn 40;
limit_conn_status 429;
