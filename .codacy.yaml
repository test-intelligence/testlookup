# Codacy scan tuning for mixed-language monorepo.
# Keep scan focused on source code and avoid generated/runtime artifacts
# that can cause false failures (encoding/build-tool specific files).
exclude_paths:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/target/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/*.min.js"
  - "**/*.lock"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.pdf"
  - "**/*.zip"
  - "**/*.tar"
  - "**/*.tar.gz"
  - "**/*.jar"
  - "**/*.war"
  - "**/*.class"
  - "**/*.log"
  - "appmiss.log"
  - "backend/backend_lint.txt"
  - "backend/backend_mypy.txt"
  - "backend/mypy_errors.txt"
  - "frontend/frontend_lint.txt"
  - "frontend/frontend_tsc.txt"
  - "test-results.txt"
  - "backend/celerybeat-schedule"

